          put('d-issuer-alias.yaml', {'apiVersion': 'cert-manager.io/v1', 'kind': 'Issuer', 'metadata': {'name': 'ci-issuer-alias', 'namespace': 'cert-manager'}, 'spec': {'ca': {'secretName': 'logging-root-ca'}}})
          put('d-alias-clusterissuer.yaml', {'apiVersion': 'cert-manager.io/v1', 'kind': 'ClusterIssuer', 'metadata': {'name': 'ci-alias-root'}, 'spec': {'ca': {'secretName': 'logging-root-ca'}}})
          put('c-issuer-unrelated.yaml', {'apiVersion': 'cert-manager.io/v1', 'kind': 'Issuer', 'metadata': {'name': 'ci-issuer-unrelated', 'namespace': 'untrusted'}, 'spec': {'ca': {'secretName': 'logging-root-ca'}}})
          put('c-issuer-other-root.yaml', {'apiVersion': 'cert-manager.io/v1', 'kind': 'Issuer', 'metadata': {'name': 'ci-issuer-other-root', 'namespace': 'cert-manager'}, 'spec': {'ca': {'secretName': 'ci-other-root-secret'}}})
          def csr(name, signer):
            return {'apiVersion': 'certificates.k8s.io/v1', 'kind': 'CertificateSigningRequest', 'metadata': {'name': name}, 'spec': {'request': req, 'signerName': signer, 'usages': ['client auth']}}
          put('d-csr-ca.yaml', csr('ci-csr-ca', 'clusterissuers.cert-manager.io/logging-ca'))
          put('d-csr-self.yaml', csr('ci-csr-self', 'clusterissuers.cert-manager.io/logging-selfsigned'))
          put('c-csr-other.yaml', csr('ci-csr-other', 'kubernetes.io/kube-apiserver-client'))
          for n, t in F.items(): (adm / n).write_text(t)
          EOF
          A="$W/adm"
          ok() { K "$@" >/dev/null 2>"$W/adm.err" || fail "allow failed: $*"; }
          denied() {
          local m="$1"; shift
          if K "$@" >/dev/null 2>"$W/adm.err"; then
            fail "no deny: $*"
          fi
          grep -q "$m" "$W/adm.err" || fail "wrong deny msg for $*: $(head -c120 "$W/adm.err")"
          }
          CERTMSG="Logging PKI Certificates"
          CRMSG="Logging PKI CertificateRequests"
          CIMSG="Logging PKI ClusterIssuers"
          IMGMSG="Logging PKI Issuers"
          CSRMSG="built-in CertificateSigningRequest path is disabled"
          for f in issuers root loki alloy graf prom; do ok --as="$ARGO" create -f "$A/$f.yaml"; done
          ROOT_UID=$(K get certificate -n cert-manager logging-root-ca -o jsonpath='{.metadata.uid}')
          LOKI_UID=$(K get certificate -n logging loki-server -o jsonpath='{.metadata.uid}')
          ALLOY_UID=$(K get certificate -n logging alloy-client -o jsonpath='{.metadata.uid}')
          GRAF_UID=$(K get certificate -n grafana grafana-loki-client -o jsonpath='{.metadata.uid}')
          PROM_UID=$(K get certificate -n logging prometheus-client -o jsonpath='{.metadata.uid}')
          [ -n "$ROOT_UID" ] && [ -n "$LOKI_UID" ] && [ -n "$ALLOY_UID" ] && [ -n "$GRAF_UID" ] && [ -n "$PROM_UID" ] \
            || fail "could not read fixture Certificate UIDs from the CI kind API"
          python - "$W" "$ROOT_UID" "$LOKI_UID" "$ALLOY_UID" "$GRAF_UID" "$PROM_UID" <<'EOF'
          import base64, copy, sys, yaml
          from pathlib import Path
          w = Path(sys.argv[1]); adm = w / 'adm-cr'; adm.mkdir(exist_ok=True)
          root_uid, loki_uid, alloy_uid, graf_uid, prom_uid = sys.argv[2:7]
          req = base64.b64encode((w / 'adm.csr').read_bytes()).decode()
          CA = {'name': 'logging-ca', 'kind': 'ClusterIssuer', 'group': 'cert-manager.io'}
          SELF = {'name': 'logging-selfsigned', 'kind': 'ClusterIssuer', 'group': 'cert-manager.io'}
          F = {}
          def put(n, *docs): F[n] = yaml.safe_dump_all(list(docs))
          def crq(name, ns, owner, owner_uid, issuer, usages, isca=None, controller=True):
            d = {'apiVersion': 'cert-manager.io/v1', 'kind': 'CertificateRequest', 'metadata': {'name': name, 'namespace': ns, 'ownerReferences': [{ 'apiVersion': 'cert-manager.io/v1', 'kind': 'Certificate', 'name': owner, 'uid': owner_uid, 'controller': controller}]}, 'spec': {'request': req, 'issuerRef': issuer, 'usages': usages}}
            if isca is not None:
                d['spec']['isCA'] = isca
            return d
          put('cr-loki.yaml', crq('ci-cr-loki', 'logging', 'loki-server', loki_uid, CA, ['server auth']))
          put('cr-root.yaml', crq('ci-cr-root', 'cert-manager', 'logging-root-ca', root_uid, SELF, ['signing', 'cert sign', 'crl sign'], isca=True))
          put('cr-alloy.yaml', crq('ci-cr-alloy', 'logging', 'alloy-client', alloy_uid, CA, ['client auth']))
          put('cr-graf.yaml', crq('ci-cr-graf', 'grafana', 'grafana-loki-client', graf_uid, CA, ['client auth']))
          put('cr-prom.yaml', crq('ci-cr-prom', 'logging', 'prometheus-client', prom_uid, CA, ['client auth']))
          put('d-cr-prom-server-auth.yaml', crq('ci-cr-psa', 'logging', 'prometheus-client', prom_uid, CA, ['server auth']))
          put('d-cr-prom-wrong-owner.yaml', crq('ci-cr-pwo', 'grafana', 'prometheus-client', prom_uid, CA, ['client auth']))
          m = crq('ci-cr-pbt', 'logging', 'prometheus-client', prom_uid, CA, ['client auth'])
          m['metadata']['ownerReferences'][0]['kind'] = 'Issuer'
          put('d-cr-prom-bad-type.yaml', m)
          put('d-cr-noncontrolling.yaml', crq('ci-cr-nc', 'logging', 'loki-server', loki_uid, CA, ['server auth'], controller=False))
          put('d-cr-server-client-auth.yaml', crq('ci-cr-sca', 'logging', 'loki-server', loki_uid, CA, ['client auth']))
          put('d-cr-wrong-owner.yaml', crq('ci-cr-wo', 'grafana', 'grafana-loki-client', graf_uid, CA, ['server auth']))
          put('d-cr-bad-usages.yaml', crq('ci-cr-bu', 'logging', 'loki-server', loki_uid, CA, ['server auth', 'client auth']))
          put('d-cr-root-not-ca.yaml', crq('ci-cr-rn', 'cert-manager', 'logging-root-ca', root_uid, SELF, ['signing'], isca=False))
          put('d-cr-root-dup.yaml', crq('ci-cr-rd', 'cert-manager', 'logging-root-ca', root_uid, SELF, ['signing', 'cert sign', 'crl sign', 'signing', 'cert sign', 'crl sign'], isca=True))
          for n, t in F.items(): (adm / n).write_text(t)
          EOF
          AC="$W/adm-cr"
          ok --as="$CM" create -f "$AC/cr-loki.yaml"
          ok --as="$CM" create -f "$AC/cr-root.yaml"
          ok --as="$CM" create -f "$AC/cr-alloy.yaml"
          ok --as="$CM" create -f "$AC/cr-graf.yaml"
          ok --as="$CM" create -f "$AC/cr-prom.yaml"
          ok --as="$CM" annotate certificaterequest -n logging ci-cr-loki ci=kept
          ok --as="$U" annotate certificate -n logging loki-server ci=metadata-only
          ok --as="$U" annotate clusterissuer logging-ca ci=metadata-only
          ok --as="$U" create -f "$A/controls.yaml"
          ok --as="$U" create -f "$A/c-issuer-unrelated.yaml"
          ok --as="$U" create -f "$A/c-issuer-other-root.yaml"
          ok --as="$U" create -f "$A/c-csr-other.yaml"
          ok --as="$U" delete clusterissuer logging-selfsigned
          denied "$CERTMSG" --as="$U" create -f "$A/loki.yaml"
          denied "$CERTMSG" --as="$U" create -f "$A/prom.yaml"
          for spec in \
          '{"spec":{"commonName":"evil.logging.svc"}}' \
          '{"spec":{"secretName":"evil-secret"}}' \
          '{"spec":{"usages":["client auth"]}}' \
          '{"spec":{"isCA":true}}' \
          '{"spec":{"duration":"4320h"}}' \
          '{"spec":{"issuerRef":{"name":"unrelated-issuer","kind":"ClusterIssuer","group":"cert-manager.io"}}}'; do
          denied "$CERTMSG" --as="$U" patch certificate loki-server -n logging \
            --type=merge -p "$spec"
          denied "$CERTMSG" --as="$ARGO" patch certificate loki-server -n logging \
            --type=merge -p "$spec"
          done
          denied "$CERTMSG" --as="$ARGO" create -f "$A/d-root-in-logging.yaml"
          denied "$CERTMSG" --as="$ARGO" create -f "$A/d-root-always.yaml"
          denied "$CERTMSG" --as="$ARGO" create -f "$A/d-selfsigned-leaf.yaml"
          denied "$CERTMSG" --as="$ARGO" create -f "$A/d-loki-wrong-ns.yaml"
          denied "$CERTMSG" --as="$ARGO" replace -f "$A/d-prom-server-auth.yaml"
          denied "$CERTMSG" --as="$ARGO" create -f "$A/d-prom-wrong-ns.yaml"
          denied "$CIMSG" --as="$U" create -f "$A/ci-self.yaml"
          ok --as="$ARGO" create -f "$A/ci-self.yaml"
          denied "$CIMSG" --as="$U" replace -f "$A/d-ci-ca.yaml"
          denied "$CIMSG" --as="$U" replace -f "$A/d-ci-self.yaml"
          denied "$CIMSG" --as="$ARGO" create -f "$A/d-alias-clusterissuer.yaml"
          denied "$CIMSG" --as="$U" create -f "$A/d-alias-clusterissuer.yaml"
          denied "$IMGMSG" --as="$ARGO" create -f "$A/d-issuer-alias.yaml"
          denied "$IMGMSG" --as="$U" create -f "$A/d-issuer-alias.yaml"
          denied "$CRMSG" --as="$U" create -f "$AC/cr-loki.yaml"
          denied "$CRMSG" --as="$U" create -f "$AC/cr-prom.yaml"
          for f in d-cr-noncontrolling d-cr-server-client-auth d-cr-wrong-owner d-cr-bad-usages d-cr-root-not-ca d-cr-root-dup d-cr-prom-server-auth d-cr-prom-wrong-owner d-cr-prom-bad-type; do
          denied "$CRMSG" --as="$CM" create -f "$AC/$f.yaml"
          done
          denied "$CSRMSG" --as="$ARGO" create -f "$A/d-csr-ca.yaml"
          for a in "$ARGO" "$CM" "$U"; do
          denied "$CSRMSG" --as="$a" create -f "$A/d-csr-self.yaml"
          done
