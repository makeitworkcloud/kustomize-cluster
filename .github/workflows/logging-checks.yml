name: logging checks

on: workflow_call

permissions:
  contents: read

jobs:
  ci-logging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Setup Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: "3.12"
      - name: Render charts, extract inputs, registered watch
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-ci"
          RENDER="${RUNNER_TEMP}/logging-render"
          mkdir -p "$W" "$RENDER"
          command -v docker openssl curl kustomize kind >/dev/null || exit 1
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - "$RENDER" <<'EOF'
          import shlex, subprocess, sys, yaml
          from pathlib import Path
          out = Path(sys.argv[1])
          errors = []
          def check(cond, msg): cond or errors.append(msg)
          def chart_source(path, chart, version, repo, ns='logging'):
            app = yaml.safe_load(Path(path).read_text())
            src = next((s for s in app['spec'].get('sources', []) if 'chart' in s), None)
            helm = (src or {}).get('helm', {})
            values = helm.get('values')
            check(src is not None and src.get('repoURL') == repo and src.get('chart') == chart and src.get('targetRevision') == version, '%s must pin %s %s from %s' % (path, chart, version, repo))
            check(helm.get('releaseName') == chart, '%s releaseName %s' % (path, chart))
            check(isinstance(values, str) and values.strip(), '%s inline values' % path)
            check(app['spec']['destination']['namespace'] == ns, '%s ns %s' % (path, ns))
            return src, values
          loki_src, loki_values = chart_source( 'workloads/apps/loki-app.yaml', 'loki', '18.13.7', 'https://grafana-community.github.io/helm-charts')
          alloy_src, alloy_values = chart_source( 'workloads/apps/alloy-app.yaml', 'alloy', '1.13.0', 'https://grafana.github.io/helm-charts')
          reloader_app = yaml.safe_load(subprocess.check_output(
              ['kustomize', 'build', 'operators/reloader'], text=True))
          (out / 'reloader-application.yaml').write_text(yaml.safe_dump(reloader_app, sort_keys=False))
          reloader_src = reloader_app['spec']['source']
          reloader_values = reloader_src.get('helm', {}).get('valuesObject')
          check(reloader_src.get('chart') == 'reloader' and reloader_src.get('repoURL') == 'https://stakater.github.io/stakater-charts' and reloader_src.get('targetRevision') == '2.2.16', 'reloader Application must pin reloader 2.2.16 stakater')
          check(isinstance(reloader_values, dict), 'reloader Application must carry a helm valuesObject')
          reloader_namespace = reloader_app['spec']['destination']['namespace']
          if errors:
            for e in errors:
                print('LOGGING-SOURCE-INVALID: %s' % e)
            sys.exit(1)
          (out / 'loki-values.yaml').write_text(loki_values)
          (out / 'alloy-values.yaml').write_text(alloy_values)
          (out / 'reloader-values.yaml').write_text( yaml.safe_dump(reloader_values, sort_keys=False))
          (out / 'sources.env').write_text( "LOKI_REPO_URL=%s\nLOKI_CHART_VERSION=%s\nALLOY_REPO_URL=%s\n" "ALLOY_CHART_VERSION=%s\nNAMESPACE=logging\n" "RELOADER_REPO_URL=%s\nRELOADER_CHART_VERSION=%s\nRELOADER_NAMESPACE=%s\n" % (shlex.quote(loki_src['repoURL']), shlex.quote(loki_src['targetRevision']), shlex.quote(alloy_src['repoURL']), shlex.quote(alloy_src['targetRevision']), shlex.quote(reloader_src['repoURL']), shlex.quote(reloader_src['targetRevision']), shlex.quote(reloader_namespace)))
          EOF
          . "$RENDER/sources.env"
          helm repo add loki-vendor "$LOKI_REPO_URL"
          helm repo add alloy-vendor "$ALLOY_REPO_URL"
          helm repo add stakater-vendor "$RELOADER_REPO_URL"
          helm repo update >/dev/null
          helm template loki loki-vendor/loki --version "$LOKI_CHART_VERSION" \
          --namespace "$NAMESPACE" --values "$RENDER/loki-values.yaml" \
          > "$RENDER/loki-rendered.yaml"
          helm template alloy alloy-vendor/alloy --version "$ALLOY_CHART_VERSION" \
          --namespace "$NAMESPACE" --values "$RENDER/alloy-values.yaml" \
          > "$RENDER/alloy-rendered.yaml"
          helm template reloader stakater-vendor/reloader --version "$RELOADER_CHART_VERSION" \
          --namespace "$RELOADER_NAMESPACE" --values "$RENDER/reloader-values.yaml" \
          > "$RENDER/reloader-rendered.yaml"
          python - "$W" "$RENDER" <<'EOF'
          import shlex, sys, yaml
          from pathlib import Path
          work, render = (Path(sys.argv[1]), Path(sys.argv[2]))
          errors = []
          def check(cond, msg): cond or errors.append(msg)
          loki_docs = [d for d in yaml.safe_load_all((render / 'loki-rendered.yaml').read_text()) if isinstance(d, dict)]
          alloy_docs = [d for d in yaml.safe_load_all((render / 'alloy-rendered.yaml').read_text()) if isinstance(d, dict)]
          loki_values = yaml.safe_load((render / 'loki-values.yaml').read_text())
          alloy_values = yaml.safe_load((render / 'alloy-values.yaml').read_text())
          config_docs = []
          for d in loki_docs:
            if d.get('kind') in ('Secret', 'ConfigMap'):
                for value in (d.get('data') or {}).values():
                    parsed = yaml.safe_load(value) if isinstance(value, str) else None
                    if isinstance(parsed, dict) and 'auth_enabled' in parsed:
                        config_docs.append((value, parsed))
          check(len(config_docs) == 1, 'exactly one rendered loki config artifact expected')
          if not config_docs:
            for e in errors:
                print('LOKI-NATIVE-INVALID: %s' % e)
            sys.exit('LOKI-NATIVE-INVALID: no rendered loki config found')
          config_text, config = config_docs[0]
          def struct_diff_names(rendered, structured, path=''):
            # Names-only diagnostics: report which field NAMES differ when
            # the rendered template cannot reproduce structuredConfig
            # exactly; never print config values (no credential material).
            if isinstance(rendered, dict) and isinstance(structured, dict):
              for k in sorted(set(rendered) | set(structured)):
                if k not in rendered or k not in structured:
                  yield '%s%s' % (path, k)
                else:
                  for name in struct_diff_names(rendered[k], structured[k], '%s%s.' % (path, k)):
                    yield name
            elif rendered != structured:
              yield path.rstrip('.') or '(root)'
          check(config == loki_values['loki']['structuredConfig'], 'rendered config must equal loki.structuredConfig verbatim; differing field names (names only, values never printed): %s' % sorted(set(struct_diff_names(config, loki_values['loki']['structuredConfig']))))
          (work / 'loki-config.yaml').write_text(config_text)
          sts = next(d for d in loki_docs if d.get('kind') == 'StatefulSet')
          loki_image = next(c['image'] for c in sts['spec']['template']['spec']['containers'] if c['name'] == 'loki')
          check(loki_image.endswith('grafana/loki:3.7.8'), 'loki image must be grafana/loki:3.7.8, got %s' % loki_image)
          loki_args = next(c.get('args') or [] for c in sts['spec']['template']['spec']['containers'] if c['name'] == 'loki')
          # -config.expand-env=true: vendor-native Loki flag the pinned chart
          # 18.13.7 always passes; allowed EXACTLY as =true only, never
          # =false or arbitrary values. The rendered config is free of ${ENV}
          # interpolation strings, so expansion cannot change any value; the
          # native docker runs mirror the same flag. -target=all is the chart
          # default. -memberlist.advertise-addr=$(POD_IP) stays allowed as a
          # documented limitation: unused with the in-memory single-binary
          # ring and a runtime pod-IP placeholder, not statically evaluable.
          # -config.file keeps a prefix rule because the chart path is
          # configurable.
          check('-config.expand-env=true' in loki_args, 'chart must pass -config.expand-env=true so the native docker mirror stays faithful')
          check(all(a == '-config.expand-env=true' or a.startswith(('-config.file=', '-target=', '-memberlist.advertise-addr=')) for a in loki_args), 'native run mirrors only -config.file plus the documented exact flags; other chart ' 'args need explicit mirroring or a documented gate first: %s' % loki_args)
          dep = next(d for d in alloy_docs if d.get('kind') == 'Deployment')
          alloy_container = next(c for c in dep['spec']['template']['spec']['containers'] if c['name'] == 'alloy')
          check(alloy_container['image'].endswith('grafana/alloy:v1.20.0'), 'alloy image must be grafana/alloy:v1.20.0, got %s' % alloy_container['image'])
          tls = config['server']['http_tls_config']
          check(tls.get('client_auth_type') == 'RequireAndVerifyClientCert', 'native config must require and verify client certificates')
          check(config['common']['path_prefix'] == '/var/loki', 'path_prefix must be /var/loki so the ephemeral data mount matches')
          # The pinned alloy chart renders config.alloy through a |- literal
          # block (strip-final-newline chomping): grafana/alloy commit
          # 389e3d59e9c73ade9f91b72f35353267ded3dc29 (chart 1.13.0 release,
          # app v1.20.0), operations/helm/charts/alloy/templates/configmap.yaml:
          #   {{ include "alloy.config-map.key" . }}: |-
          #     {{- (tpl $values.configMap.content .) | nindent 4 }}
          # so the rendered ConfigMap string may differ from the values
          # string ONLY by the trailing newline. Compare BOTH sides
          # newline-normalized (rstrip('\n') ONLY - never spaces or any
          # other whitespace; any other difference still fails) and feed the
          # RENDERED ConfigMap bytes to native validate, exactly as the prod
          # runtime mounts them, instead of the unrendered values string.
          acms = [d for d in alloy_docs if d.get('kind') == 'ConfigMap' and d['metadata']['name'] == 'alloy']
          check(len(acms) == 1, 'exactly one rendered alloy ConfigMap expected')
          rendered_river = acms[0]['data'].get('config.alloy') if len(acms) == 1 else None
          desired_river = alloy_values['alloy']['configMap']['content']
          check(isinstance(rendered_river, str) and isinstance(desired_river, str), 'rendered alloy ConfigMap must carry a config.alloy string')
          if isinstance(rendered_river, str) and isinstance(desired_river, str):
            if rendered_river.rstrip('\n') != desired_river.rstrip('\n'):
              print('LOKI-NATIVE-INVALID: rendered config.alloy != values content after newline-only normalization (lengths only, values never printed): rendered=%d desired=%d' % (len(rendered_river), len(desired_river)))
            check(rendered_river.rstrip('\n') == desired_river.rstrip('\n'), 'rendered config.alloy must equal values content modulo trailing newline')
            (work / 'alloy.river').write_text(rendered_river)
          stability = next((a for a in alloy_container.get('args', []) if a.startswith('--stability.level=')), '')
          if errors:
            for e in errors:
                print('LOKI-NATIVE-INVALID: %s' % e)
            sys.exit(1)
          (work / 'params.env').write_text( "LOKI_IMAGE=%s\nALLOY_IMAGE=%s\nALLOY_STABILITY_ARGS=%s\n" "LOKI_TLS_CERT=%s\nLOKI_TLS_KEY=%s\nLOKI_TLS_CA=%s\n" % (shlex.quote(loki_image), shlex.quote(alloy_container['image']), shlex.quote(stability), shlex.quote(tls['cert_file']), shlex.quote(tls['key_file']), shlex.quote(tls['client_ca_file'])))
          server_cert = yaml.safe_load( Path('workloads/logging/loki/server-certificate.yaml').read_text())
          san = ','.join('DNS:%s' % d for d in server_cert['spec']['dnsNames'])
          (work / 'pki-server.ext').write_text( "basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\n" "extendedKeyUsage=serverAuth\nsubjectAltName=%s\n" % san)
          (work / 'pki-client.ext').write_text( "basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\n" "extendedKeyUsage=clientAuth\n")
          EOF
      - name: Assert chart and activation contracts
        run: |
          python - "${RUNNER_TEMP}/logging-render" <<'EOF'
          import re, shlex, sys, yaml
          from pathlib import Path
          render = Path(sys.argv[1])
          errors = []
          def check(cond, msg): cond or errors.append(msg)
          loki_docs = [d for d in yaml.safe_load_all((render / 'loki-rendered.yaml').read_text()) if isinstance(d, dict)]
          alloy_docs = [d for d in yaml.safe_load_all((render / 'alloy-rendered.yaml').read_text()) if isinstance(d, dict)]
          loki_values = yaml.safe_load((render / 'loki-values.yaml').read_text())
          alloy_values = yaml.safe_load((render / 'alloy-values.yaml').read_text())
          reloader_docs = [d for d in yaml.safe_load_all((render / 'reloader-rendered.yaml').read_text()) if isinstance(d, dict)]
          reloader_app = yaml.safe_load((render / 'reloader-application.yaml').read_text())
          reloader_values = reloader_app['spec']['source']['helm']['valuesObject']
          reloader_namespace = reloader_app['spec']['destination']['namespace']
          stss = [d for d in loki_docs if d.get('kind') == 'StatefulSet']
          check(len(stss) == 1, 'exactly one loki StatefulSet')
          sts = stss[0] if stss else None
          loki_container = None
          if sts:
            check(sts['metadata']['name'] == 'loki', 'sts name loki')
            check(sts['spec'].get('replicas') == 1, 'loki replicas 1')
            pod_labels = sts['spec']['template']['metadata']['labels']
            for label, value in (('app.kubernetes.io/name', 'loki'), ('app.kubernetes.io/instance', 'loki'), ('app.kubernetes.io/component', 'single-binary')):
                check(pod_labels.get(label) == value, 'pod label %s=%s' % (label, value))
            ann = sts['metadata'].get('annotations', {})
            check(ann.get('secret.reloader.stakater.com/reload') == 'loki-server-tls', 'sts named-secret reload = loki-server-tls')
            check('reloader.stakater.com/auto' not in ann, 'no reloader auto on sts')
            loki_container = next((c for c in sts['spec']['template']['spec']['containers'] if c['name'] == 'loki'), None)
            check(loki_container is not None, 'loki container missing')
            if loki_container:
                check(loki_container['image'].endswith('grafana/loki:3.7.8'), 'loki image 3.7.8, got %s' % loki_container['image'])
                ports = {p.get('containerPort') for p in loki_container.get('ports') or []}
                check(ports == {3100, 9095, 7946}, 'pod ports exactly 3100/9095/7946 (no 9096), got %s' % sorted(ports))
                args = loki_container.get('args') or []
                check('-target=all' in args, 'chart runs -target=all')
                check('-config.expand-env=true' in args, 'chart runs -config.expand-env=true exactly (never =false)')
                check(all(a == '-config.expand-env=true' or a.startswith(('-config.file=', '-target=', '-memberlist.advertise-addr=')) for a in args), 'loki args outside allowed set (expand-env must be exactly =true): %s' % args)
            vcts = sts['spec'].get('volumeClaimTemplates', [])
            check(len(vcts) == 1, 'one volumeClaimTemplate')
            if vcts:
                check(vcts[0]['spec']['resources']['requests']['storage'] == '100Gi', 'PVC 100Gi')
                check(vcts[0]['spec'].get('storageClassName') == 'local-path', 'PVC local-path')
            pol = sts['spec'].get('persistentVolumeClaimRetentionPolicy', {})
            check(pol.get('whenDeleted') == 'Retain' and pol.get('whenScaled') == 'Retain', 'PVC Retain/Retain')
            vols = {v['name']: v for v in sts['spec']['template']['spec'].get('volumes', [])}
            check(vols.get('server-tls', {}).get('secret', {}).get('secretName') == 'loki-server-tls', 'server-tls volume secret')
            m = {x['mountPath']: x for x in (loki_container or {}).get('volumeMounts', [])}
            t = m.get('/etc/loki/server-tls')
            check(t is not None and t.get('name') == 'server-tls' and t.get('readOnly') is True, 'server-tls ro mount')
            if loki_container:
                for probe in ('startupProbe', 'readinessProbe', 'livenessProbe'):
                    h = loki_container.get(probe, {}).get('httpGet', {})
                    check(h.get('path') == '/ready' and h.get('port') == 3101 and h.get('scheme') == 'HTTP', '%s probes 3101 /ready' % probe)
          cds = []
          for d in loki_docs:
            if d.get('kind') in ('Secret', 'ConfigMap'):
                for v in (d.get('data') or {}).values():
                    p = yaml.safe_load(v) if isinstance(v, str) else None
                    if isinstance(p, dict) and 'auth_enabled' in p:
                        cds.append(p)
          check(len(cds) == 1, 'one rendered loki config artifact')
          structured = loki_values.get('loki', {}).get('structuredConfig')
          if cds:
            cfg = cds[0]
            check(cfg == structured, 'config == structuredConfig verbatim')
            for path, want in [ ('auth_enabled', False), ('server.http_listen_address', '0.0.0.0'), ('server.http_listen_port', 3100), ('server.register_instrumentation', True), ('server.grpc_listen_address', '127.0.0.1'), ('server.grpc_listen_port', 9095), ('server.http_tls_config.client_auth_type', 'RequireAndVerifyClientCert'), ('server.http_tls_config.cert_file', '/etc/loki/server-tls/tls.crt'), ('server.http_tls_config.key_file', '/etc/loki/server-tls/tls.key'), ('server.http_tls_config.client_ca_file', '/etc/loki/server-tls/ca.crt'), ('internal_server.enable', True), ('internal_server.http_listen_address', '0.0.0.0'), ('internal_server.http_listen_port', 3101), ('internal_server.register_instrumentation', False), ('common.instance_addr', '127.0.0.1'), ('frontend_worker.frontend_address', '127.0.0.1:9095'), ('memberlist.bind_addr', ['127.0.0.1']), ('memberlist.join_members', []), ('limits_config.discover_service_name', []), ('limits_config.retention_period', '720h'), ('limits_config.max_query_lookback', '720h'), ('limits_config.ingestion_rate_mb', 0.02), ('limits_config.ingestion_burst_size_mb', 1), ('limits_config.max_streams_per_user', 1000), ('limits_config.max_line_size', 4096), ('limits_config.per_stream_rate_limit', 20480), ('limits_config.per_stream_rate_limit_burst', 1048576), ('compactor.retention_enabled', True), ('compactor.delete_request_store', 'filesystem'), ]:
                node = cfg
                for part in path.split('.'):
                    node = node[part]
                check(node == want, 'cfg.%s must be %r' % (path, want))
          gw = [d['metadata']['name'] for d in loki_docs if 'gateway' in d['metadata']['name']]
          check(not gw, 'no gateway resources: %s' % gw)
          check(not [d for d in loki_docs if d.get('kind') == 'Ingress'], 'no loki Ingress')
          check(not [d for d in loki_docs if d.get('kind') == 'ServiceMonitor'], 'loki chart SM off')
          deps = [d for d in alloy_docs if d.get('kind') == 'Deployment']
          check(len(deps) == 1, 'one alloy Deployment')
          alloy_container = None
          if deps:
            dep = deps[0]
            check(dep['metadata']['name'] == 'alloy', 'deployment name alloy')
            check(dep['spec'].get('replicas') == 1, 'alloy replicas 1')
            ann = dep['metadata'].get('annotations', {})
            check(ann.get('secret.reloader.stakater.com/reload') == 'loki-alloy-client', 'deploy named-secret reload = loki-alloy-client')
            check('reloader.stakater.com/auto' not in ann, 'no reloader auto on deploy')
            spec = dep['spec']['template']['spec']
            check(spec.get('securityContext', {}).get('runAsNonRoot') is True and spec.get('securityContext', {}).get('runAsUser') == 473, 'alloy non-root 473')
            alloy_container = next((c for c in spec['containers'] if c['name'] == 'alloy'), None)
            check(alloy_container is not None, 'alloy container missing')
            if alloy_container:
                check(alloy_container['image'].endswith('grafana/alloy:v1.20.0'), 'alloy image v1.20.0, got %s' % alloy_container['image'])
                check(not alloy_container.get('resources'), 'alloy no resources')
                check(alloy_container.get('securityContext', {}) .get('readOnlyRootFilesystem') is True, 'alloy ro rootfs')
            for v in spec.get('volumes', []):
                check('hostPath' not in v, 'no hostPath: %s' % v.get('name'))
            bn = {v['name']: v for v in spec.get('volumes', [])}
            check(bn.get('client-tls', {}).get('secret', {}).get('secretName') == 'loki-alloy-client', 'client-tls volume secret')
            m = {x['name']: x for x in (alloy_container or {}).get('volumeMounts', [])}
            cm = m.get('client-tls')
            check(cm is not None and cm.get('mountPath') == '/etc/alloy/client-tls' and cm.get('readOnly') is True, 'client-tls ro mount')
          rb = [d for d in alloy_docs if d.get('kind') in ('Role', 'ClusterRole')]
          check(len(rb) >= 1, 'alloy RBAC present')
          granted = set()
          for d in rb:
            for r in d.get('rules') or []:
                res = r.get('resources') or []
                vs = r.get('verbs') or []
                check(r.get('apiGroups') == [''], '%s core group only' % d['metadata']['name'])
                check('secrets' not in res and 'nodes' not in res and '*' not in res, '%s no secrets/nodes/*' % d['metadata']['name'])
                check(not ({'create', 'update', 'patch', 'delete', 'deletecollection', '*'} & set(vs)), '%s read-only' % d['metadata']['name'])
                for x in res:
                    for y in vs:
                        granted.add((x, y))
          check(granted == {('pods', 'get'), ('pods', 'list'), ('pods', 'watch'), ('pods/log', 'get')}, 'RBAC grant pods+logs only, got %s' % sorted(granted))
          for d in alloy_docs:
            for r in d.get('rules') or []:
                check('secrets' not in (r.get('resources') or []), 'no RBAC secrets')
          cmaps = [d for d in alloy_docs if d.get('kind') == 'ConfigMap' and d['metadata']['name'] == 'alloy']
          check(len(cmaps) == 1, 'alloy ConfigMap')
          if cmaps:
            # |- chomping: only the trailing newline may differ (see the
            # render step comment citing the pinned chart template);
            # newline-normalize BOTH sides, nothing else, and keep failing
            # on any real content difference.
            rendered_river = cmaps[0]['data'].get('config.alloy')
            desired_river = alloy_values['alloy']['configMap']['content']
            if isinstance(rendered_river, str) and isinstance(desired_river, str) and rendered_river.rstrip('\n') != desired_river.rstrip('\n'):
              print('LOGGING-CHART-INVALID: config.alloy mismatch after newline-only normalization (lengths only, values never printed): rendered=%d desired=%d' % (len(rendered_river), len(desired_river)))
            check(isinstance(rendered_river, str) and rendered_river.rstrip('\n') == desired_river.rstrip('\n'), 'ConfigMap River verbatim modulo EOF newline')
          mons = [d for d in alloy_docs if d.get('kind') == 'ServiceMonitor']
          check(len(mons) == 1, 'one alloy SM')
          svcs = [d for d in alloy_docs if d.get('kind') == 'Service']
          if mons:
            mo = mons[0]
            check(mo['metadata'].get('labels', {}).get('release') == 'kube-prometheus-stack', 'alloy SM release label')
            sel = mo['spec']['selector'].get('matchLabels', {})
            matched = [s for s in svcs if all(s['metadata'].get('labels', {}).get(k) == v for k, v in sel.items())]
            check(len(matched) == 1, 'alloy SM selects one Service')
            pn = mo['spec']['endpoints'][0].get('port')
            if len(matched) == 1:
                ps = {p['name']: p.get('port') for p in matched[0]['spec'].get('ports', [])}
                check(pn in ps, 'SM port %s on Service' % pn)
                check(ps.get(pn) == 12345, 'alloy metrics port 12345')
          sc = yaml.safe_load( Path('workloads/logging/loki/server-certificate.yaml').read_text())
          cc = yaml.safe_load( Path('workloads/logging/alloy/client-certificate.yaml').read_text())
          mc = yaml.safe_load( Path('workloads/logging/loki/metrics-client-certificate.yaml').read_text())
          for cert, usages in ((sc, ['server auth']), (cc, ['client auth']), (mc, ['client auth'])):
            n = cert['metadata']['name']
            check(cert.get('kind') == 'Certificate', '%s kind' % n)
            check(cert['spec'].get('usages') == usages, '%s usages' % n)
