          watch_bindings = [b for b in bindings
                            if b["metadata"]["name"].endswith("-role-binding")]
          check(sorted(b["metadata"]["namespace"] for b in watch_bindings) == watch_namespaces
                and all(b.get("roleRef", {}).get("kind") == "Role" for b in watch_bindings)
                and all((b.get("subjects") or [{}])[0].get("namespace") == reloader_namespace
                        for b in watch_bindings),
                "one RoleBinding per watched namespace must bind the namespaced Role "
                "to the operator ServiceAccount")
          reloader_dep = next(d for d in reloader_docs if d.get("kind") == "Deployment")
          reloader_args = (reloader_dep["spec"]["template"]["spec"]["containers"][0]
                           .get("args") or [])
          check("--namespaces=%s" % ",".join(watch_namespaces) in reloader_args,
                "the Deployment watch flag must cover exactly %s, got %s"
                % (watch_namespaces, reloader_args))
          for flag in ("--reload-on-create=true", "--reload-on-delete=true",
                       "--sync-after-restart=true"):
              check(flag in reloader_args, "the Deployment must keep %s" % flag)
          check(not any(a.startswith("--auto-reload-all") for a in reloader_args),
                "auto-reload-all must stay off: only named Secret opt-in reloads")
          check(not any(a.startswith("--reload-strategy") for a in reloader_args),
                "the default reload strategy (named annotations) must stay")

          for path, kind, name, container, env_name in (
                  ("workloads/apps/loki-app.yaml", "StatefulSet", "loki", "loki",
                   "STAKATER_LOKI_SERVER_TLS_SECRET"),
                  ("workloads/apps/alloy-app.yaml", "Deployment", "alloy", "alloy",
                   "STAKATER_LOKI_ALLOY_CLIENT_SECRET")):
              app = yaml.safe_load(Path(path).read_text())
              app_name = app["metadata"]["name"]
              ignores = app["spec"].get("ignoreDifferences")
              check(isinstance(ignores, list) and len(ignores) == 1,
                    "%s must declare exactly one ignoreDifferences entry" % app_name)
              if isinstance(ignores, list) and len(ignores) == 1:
                  entry = ignores[0]
                  check(set(entry) == {"group", "kind", "name", "namespace",
                                       "jqPathExpressions"},
                        "%s ignoreDifferences entry must not broaden scope" % app_name)
                  check(entry.get("group") == "apps" and entry.get("kind") == kind
                        and entry.get("name") == name and entry.get("namespace") == "logging",
                        "%s ignoreDifferences must target exactly %s %s in logging"
                        % (app_name, kind, name))
                  env_path = ('.spec.template.spec.containers[] | select(.name == "%s") '
                              '| .env[] | select(.name == "%s")' % (container, env_name))
                  check(entry.get("jqPathExpressions") == [
                      env_path,
                      '.spec.template.metadata.annotations'
                      '["reloader.stakater.com/last-reloaded-from"]',
