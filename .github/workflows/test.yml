                  "%s must ignore only the Reloader env hash in container %s plus the "
                  "last-reloaded-from annotation" % (app_name, container))
              options = app["spec"].get("syncPolicy", {}).get("syncOptions") or []
              check("RespectIgnoreDifferences=true" in options,
                    "%s must keep RespectIgnoreDifferences=true" % app_name)

          if errors:
              for e in errors:
                  print("LOGGING-CHART-INVALID: %s" % e)
              sys.exit(1)
          print("OK: loki/alloy chart render, certificates, and monitoring contract verified")
          EOF

      - name: Assert fail-closed log-collection privacy contract
        run: |
          python - <<'EOF'
          import re, sys, yaml
          from pathlib import Path

          errors = []
          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          app = yaml.safe_load(Path("workloads/apps/alloy-app.yaml").read_text())
          source = next(s for s in app["spec"]["sources"] if "chart" in s)
          river = yaml.safe_load(source["helm"]["values"])["alloy"]["configMap"]["content"]

          check(re.search(r"targets\s*=\s*discovery\.kubernetes\.pods\.targets", river)
                is not None, "discovery.relabel must consume discovery.kubernetes targets")
          check(re.search(r"targets\s*=\s*discovery\.relabel\.approved_pods\.output", river)
                is not None, "loki.source must consume only relabelled targets")
          check(re.search(r"forward_to\s*=\s*\[loki\.process\.approved_pods\.receiver\]", river)
                is not None, "log source must forward through loki.process")
          check(re.search(r"forward_to\s*=\s*\[loki\.write\.logging\.receiver\]", river)
                is not None, "processor must forward to the loki.write endpoint")
          check(river.index("discovery.kubernetes") < river.index("loki.source.kubernetes"),
                "hard-denies must run in relabeling before any log source starts")

          rules = []
          for block in re.findall(r"rule\s*\{([^{}]*)\}", river):
              def field(name):
                  match = re.search(r"\b%s\s*=\s*(.+)" % name, block)
                  return match.group(1).strip() if match else None
              labels = re.search(r"\[([^\]]*)\]", field("source_labels") or "").group(1)
              rules.append({
                  "source_labels": [x.strip().strip('"') for x in labels.split(",")],
                  "regex": (field("regex") or "").strip('"'),
                  "action": (field("action") or "").strip('"'),
                  "target_label": (field("target_label") or "").strip('"'),
              })
          gating = [r for r in rules if r["action"] in ("keep", "drop")]
          mapping = [r for r in rules if r["target_label"]]
          check([(r["action"], r["regex"]) for r in gating] == [
              ("keep", "true"), ("keep", ".+"),
              ("drop", "opencode|mcp|arc-runners"), ("drop", "runner")],
              "gating rules must stay exactly: keep annotation=true, keep non-empty "
              "app.kubernetes.io/name, drop opencode|mcp|arc-runners namespaces, "
              "drop runner containers")
          if len(gating) == 4 and mapping:
              check(rules.index(gating[3]) < rules.index(mapping[0]),
                    "deny rules must be evaluated before label mapping")
              check([r["target_label"] for r in mapping]
                    == ["namespace", "application", "container"],
                    "mapped labels must be exactly namespace/application/container")
          keep = re.search(r"stage\.label_keep\s*\{\s*values\s*=\s*\[([^\]]*)\]", river)
          check(keep is not None
                and [v.strip().strip('"') for v in keep.group(1).split(",")]
                == ["namespace", "application", "container"],
                "stage.label_keep must pin indexed labels to namespace/application/container")
          check(re.search(r"action\s*=\s*\"labeldrop\"", river) is None,
                "no labeldrop rule may strip the internal pod name/UID target attributes")

          def evaluate(labels):
              for rule in gating:
                  joined = ";".join(labels.get(sl, "") for sl in rule["source_labels"])
                  if rule["action"] == "keep" and not re.fullmatch(rule["regex"], joined):
                      return None
                  if rule["action"] == "drop" and re.fullmatch(rule["regex"], joined):
                      return None
              for rule in mapping:
                  labels = dict(labels)
                  labels[rule["target_label"]] = ";".join(
                      labels.get(sl, "") for sl in rule["source_labels"])
              return labels

          def meta(namespace, container, annotation, app_name):
              return {
                  "__meta_kubernetes_namespace": namespace,
                  "__meta_kubernetes_pod_container_name": container,
                  "__meta_kubernetes_pod_annotation_logging_makeitwork_cloud_approved": annotation,
                  "__meta_kubernetes_pod_label_app_kubernetes_io_name": app_name,
              }

          fixtures = [
              (meta("team-a", "web", "", "web"), False, "unannotated pods are not collected"),
              (meta("team-a", "web", "false", "web"), False, "approved=false is not collected"),
              (meta("team-a", "web", "true", ""), False, "empty app.kubernetes.io/name is not collected"),
              (meta("opencode", "web", "true", "anything"), False,
               "opencode namespace is hard-denied even when approved"),
              (meta("mcp", "web", "true", "anything"), False, "mcp namespace is hard-denied"),
              (meta("arc-runners", "web", "true", "anything"), False,
               "arc-runners namespace is hard-denied"),
              (meta("team-a", "runner", "true", "web"), False,
               "runner containers are hard-denied"),
              (meta("team-a", "web", "true", "web"), True, "approved labeled pods are collected"),
          ]
          for labels, expected_kept, why in fixtures:
              result = evaluate(labels)
              check(bool(result) is expected_kept, why)
          positive = evaluate(meta("team-a", "web", "true", "web"))
          check(positive is not None
                and {k: positive[k] for k in ("namespace", "application", "container")}
                == {"namespace": "team-a", "application": "web", "container": "web"},
                "positive fixture must map exactly the three indexed labels")

          expected_strings = {
              "url": "https://loki.logging.svc:3100/loki/api/v1/push", "batch_wait": "1s",
              "batch_size": "64KiB", "remote_timeout": "10s", "min_backoff_period": "500ms",
              "max_backoff_period": "30s", "server_name": "loki.logging.svc"}
          for key, expected in expected_strings.items():
              match = re.search(r"\b%s\s*=\s*\"([^\"]*)\"" % key, river)
              check(match is not None and match.group(1) == expected,
                    "loki.write %s must be exactly %s" % (key, expected))
          retries = re.search(r"\bmax_backoff_retries\s*=\s*(\d+)", river)
          check(retries is not None and retries.group(1) == "3",
                "loki.write max_backoff_retries must be 3")
          check(re.search(r"\binsecure_skip_verify\s*=\s*false", river) is not None,
                "loki.write must verify the Loki server certificate")
          check(re.search(r"\bcluster\s*=\s*\"k3s\"", river) is not None,
                "external_labels must pin cluster=k3s")
          ca_path = re.search(r"\bca_file\s*=\s*\"([^\"]*)\"", river)
          cert_path = re.search(r"\bcert_file\s*=\s*\"([^\"]*)\"", river)
          key_path = re.search(r"\bkey_file\s*=\s*\"([^\"]*)\"", river)
          check(ca_path is not None and cert_path is not None and key_path is not None
                and ca_path.group(1).startswith("/etc/alloy/client-tls/")
                and cert_path.group(1).startswith("/etc/alloy/client-tls/")
                and key_path.group(1).startswith("/etc/alloy/client-tls/"),
                "writer TLS files must come from the client-tls volume mount")
          server_cert = yaml.safe_load(
              Path("workloads/logging/loki/server-certificate.yaml").read_text())
          check("loki.logging.svc" in server_cert["spec"]["dnsNames"],
                "server certificate must cover the SNI name the writer verifies")

          if errors:
              for e in errors:
                  print("LOGGING-PRIVACY-INVALID: %s" % e)
              sys.exit(1)
          print("OK: fail-closed privacy contract verified against the shipped River rules")
          EOF

  ci-logging-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Setup Python
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      - name: Install CI Python dependencies
        run: python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt

      - name: Fail fast on required preinstalled runner CLIs
        run: |
          for cli in docker openssl curl; do
            command -v "$cli" >/dev/null 2>&1 || {
              echo "required runner CLI missing: $cli"; exit 1;
            }
          done

      - name: Render charts and extract the real native runtime inputs
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-native"
          RENDER="${RUNNER_TEMP}/logging-render"
          mkdir -p "$W" "$RENDER"
          python - "$RENDER" <<'EOF'
          import shlex, sys, yaml
          from pathlib import Path

          out = Path(sys.argv[1])
          entries = []
          for path, name in (("workloads/apps/loki-app.yaml", "loki"),
                             ("workloads/apps/alloy-app.yaml", "alloy")):
              app = yaml.safe_load(Path(path).read_text())
              source = next(s for s in app["spec"]["sources"] if "chart" in s)
              (out / ("%s-values.yaml" % name)).write_text(source["helm"]["values"])
              entries.append("%s_REPO_URL=%s" % (name.upper(), shlex.quote(source["repoURL"])))
              entries.append("%s_CHART_VERSION=%s"
                             % (name.upper(), shlex.quote(source["targetRevision"])))
          (out / "sources.env").write_text("\n".join(entries) + "\n")
          EOF
          . "$RENDER/sources.env"
          helm repo add loki-vendor "$LOKI_REPO_URL"
          helm repo add alloy-vendor "$ALLOY_REPO_URL"
          helm repo update >/dev/null
          helm template loki loki-vendor/loki --version "$LOKI_CHART_VERSION" \
            --namespace logging --values "$RENDER/loki-values.yaml" \
            > "$RENDER/loki-rendered.yaml"
          helm template alloy alloy-vendor/alloy --version "$ALLOY_CHART_VERSION" \
            --namespace logging --values "$RENDER/alloy-values.yaml" \
            > "$RENDER/alloy-rendered.yaml"
          python - "$W" "$RENDER" <<'EOF'
          import shlex, sys, yaml
          from pathlib import Path

          work, render = (Path(sys.argv[1]), Path(sys.argv[2]))
          errors = []
          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          loki_docs = [d for d in yaml.safe_load_all((render / "loki-rendered.yaml").read_text())
                       if isinstance(d, dict)]
          alloy_docs = [d for d in yaml.safe_load_all((render / "alloy-rendered.yaml").read_text())
                        if isinstance(d, dict)]
          loki_values = yaml.safe_load((render / "loki-values.yaml").read_text())
          alloy_values = yaml.safe_load((render / "alloy-values.yaml").read_text())

          config_docs = []
          for d in loki_docs:
              if d.get("kind") in ("Secret", "ConfigMap"):
                  for value in (d.get("data") or {}).values():
                      parsed = yaml.safe_load(value) if isinstance(value, str) else None
                      if isinstance(parsed, dict) and "auth_enabled" in parsed:
                          config_docs.append((value, parsed))
          check(len(config_docs) == 1, "exactly one rendered loki config artifact expected")
          if not config_docs:
              for e in errors:
                  print("LOKI-NATIVE-INVALID: %s" % e)
              sys.exit("LOKI-NATIVE-INVALID: no rendered loki config found")
          config_text, config = config_docs[0]
          check(config == loki_values["loki"]["structuredConfig"],
                "rendered config must equal loki.structuredConfig verbatim")
          (work / "loki-config.yaml").write_text(config_text)

          sts = next(d for d in loki_docs if d.get("kind") == "StatefulSet")
          loki_image = next(c["image"] for c in sts["spec"]["template"]["spec"]["containers"]
                            if c["name"] == "loki")
          check(loki_image.endswith("grafana/loki:3.7.8"),
                "loki image must be grafana/loki:3.7.8, got %s" % loki_image)
          loki_args = next(c.get("args") or []
                           for c in sts["spec"]["template"]["spec"]["containers"]
                           if c["name"] == "loki")
          check(all(a.startswith(("-config.file=", "-target=",
                                  "-memberlist.advertise-addr="))
                    for a in loki_args),
                "native run mirrors only -config.file; other chart args need explicit "
                "mirroring or a documented gate first: %s" % loki_args)
          dep = next(d for d in alloy_docs if d.get("kind") == "Deployment")
          alloy_container = next(c for c in dep["spec"]["template"]["spec"]["containers"]
                                 if c["name"] == "alloy")
          check(alloy_container["image"].endswith("grafana/alloy:v1.20.0"),
                "alloy image must be grafana/alloy:v1.20.0, got %s" % alloy_container["image"])

          tls = config["server"]["http_tls_config"]
          check(tls.get("client_auth_type") == "RequireAndVerifyClientCert",
                "native config must require and verify client certificates")
          check(config["common"]["path_prefix"] == "/var/loki",
                "path_prefix must be /var/loki so the ephemeral data mount matches")
          (work / "alloy.river").write_text(alloy_values["alloy"]["configMap"]["content"])
          stability = next((a for a in alloy_container.get("args", [])
                            if a.startswith("--stability.level=")), "")
          if errors:
              for e in errors:
                  print("LOKI-NATIVE-INVALID: %s" % e)
              sys.exit(1)
          (work / "params.env").write_text(
              "LOKI_IMAGE=%s\nALLOY_IMAGE=%s\nALLOY_STABILITY_ARGS=%s\n"
              "LOKI_TLS_CERT=%s\nLOKI_TLS_KEY=%s\nLOKI_TLS_CA=%s\n"
              % (shlex.quote(loki_image), shlex.quote(alloy_container["image"]),
                 shlex.quote(stability), shlex.quote(tls["cert_file"]),
                 shlex.quote(tls["key_file"]), shlex.quote(tls["client_ca_file"])))

          server_cert = yaml.safe_load(
              Path("workloads/logging/loki/server-certificate.yaml").read_text())
          client_cert = yaml.safe_load(
              Path("workloads/logging/alloy/client-certificate.yaml").read_text())
          san = ",".join("DNS:%s" % d for d in server_cert["spec"]["dnsNames"])
          (work / "pki-server.ext").write_text(
              "basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\n"
              "extendedKeyUsage=serverAuth\nsubjectAltName=%s\n" % san)
          (work / "pki-client.ext").write_text(
              "basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\n"
              "extendedKeyUsage=clientAuth\n")
          print("OK: native inputs extracted (config, River, images, TLS paths, SANs)")
          EOF

      - name: Validate the real River configuration with native Alloy
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-native"
          . "$W/params.env"
          docker run --rm --volume "$W:/conf:ro" "$ALLOY_IMAGE" \
            validate $ALLOY_STABILITY_ARGS /conf/alloy.river
          echo "OK: native alloy validate accepted the shipped River configuration"

      - name: Negative control for native Alloy validate
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-native"
          . "$W/params.env"
          cp "$W/alloy.river" "$W/alloy-broken.river"
          printf '\nci_bogus.component "negative_control" { }\n' >> "$W/alloy-broken.river"
          set +e
          docker run --rm --volume "$W:/conf:ro" "$ALLOY_IMAGE" \
            validate $ALLOY_STABILITY_ARGS /conf/alloy-broken.river >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "LOKI-NATIVE-INVALID: alloy validate accepted a bogus component (must fail)"
            exit 1
          fi
          echo "OK: alloy validate rejects an invalid River file"

      - name: Generate synthetic CI PKI with openssl (never printed)
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-native"
          umask 077
          PKI="$W/pki"
          mkdir -p "$PKI"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=ci-logging-ca" -keyout "$PKI/ca.key" -out "$PKI/ca.crt" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=ci-wrong-ca" -keyout "$PKI/wrong-ca.key" -out "$PKI/wrong-ca.crt" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj "/CN=loki.logging.svc" \
            -keyout "$PKI/server.key" -out "$PKI/server.csr" >/dev/null 2>&1
          openssl x509 -req -in "$PKI/server.csr" -CA "$PKI/ca.crt" -CAkey "$PKI/ca.key" \
            -CAcreateserial -days 2 -out "$PKI/server.crt" \
            -extfile "$W/pki-server.ext" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj "/CN=alloy.logging" \
            -keyout "$PKI/client.key" -out "$PKI/client.csr" >/dev/null 2>&1
          openssl x509 -req -in "$PKI/client.csr" -CA "$PKI/ca.crt" -CAkey "$PKI/ca.key" \
            -CAcreateserial -days 2 -out "$PKI/client.crt" \
            -extfile "$W/pki-client.ext" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj "/CN=alloy-wrong.logging" \
            -keyout "$PKI/wrong-client.key" -out "$PKI/wrong-client.csr" >/dev/null 2>&1
          openssl x509 -req -in "$PKI/wrong-client.csr" -CA "$PKI/wrong-ca.crt" \
            -CAkey "$PKI/wrong-ca.key" -CAcreateserial -days 2 -out "$PKI/wrong-client.crt" \
            -extfile "$W/pki-client.ext" >/dev/null 2>&1
          for f in ca.crt ca.key wrong-ca.crt wrong-ca.key server.crt server.key \
                   client.crt client.key wrong-client.crt wrong-client.key; do
            test -s "$PKI/$f" || { echo "synthetic PKI generation failed for $f"; exit 1; }
          done

      - name: Verify the real rendered Loki config natively
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-native"
          . "$W/params.env"
          RT="$W/runtime"
          rm -rf "$RT"; mkdir -p "$RT/var-loki"; chmod 700 "$RT/var-loki"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$W/loki-config.yaml:/etc/loki/loki.yaml:ro" \
            --volume "$W/pki/server.crt:$LOKI_TLS_CERT:ro" \
            --volume "$W/pki/server.key:$LOKI_TLS_KEY:ro" \
            --volume "$W/pki/ca.crt:$LOKI_TLS_CA:ro" \
            --volume "$RT/var-loki:/var/loki" \
            "$LOKI_IMAGE" -config.file=/etc/loki/loki.yaml -verify-config=true

      - name: Negative controls for native Loki verify-config
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-native"
          . "$W/params.env"
          RT="$W/runtime"
          python - "$W" <<'EOF'
          import sys, yaml
          from pathlib import Path

          work = Path(sys.argv[1])
          config = yaml.safe_load((work / "loki-config.yaml").read_text())
          config["ci_unknown_field_negative_control"] = True
          (work / "loki-broken-unknown-field.yaml").write_text(
              yaml.safe_dump(config, sort_keys=False))
          raw = (work / "loki-config.yaml").read_text()
          (work / "loki-broken-truncated.yaml").write_text(raw[: max(1, len(raw) // 2)])
          EOF
          for broken in loki-broken-unknown-field.yaml loki-broken-truncated.yaml; do
            set +e
            docker run --rm --user "$(id -u):$(id -g)" \
              --volume "$W/$broken:/etc/loki/loki.yaml:ro" \
              --volume "$W/pki/server.crt:$LOKI_TLS_CERT:ro" \
              --volume "$W/pki/server.key:$LOKI_TLS_KEY:ro" \
              --volume "$W/pki/ca.crt:$LOKI_TLS_CA:ro" \
              --volume "$RT/var-loki:/var/loki" \
              "$LOKI_IMAGE" -config.file=/etc/loki/loki.yaml -verify-config=true \
              >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "LOKI-NATIVE-INVALID: -verify-config accepted $broken (must fail)"
              exit 1
            fi
          done

      - name: Prove the mTLS auth boundary with a live isolated Loki
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/logging-native"
          . "$W/params.env"
          PKI="$W/pki"
          RT="$W/runtime"
          fail() { echo "LOKI-RUNTIME-INVALID: $1"; exit 1; }
          cleanup() {
            docker rm -f loki-ci >/dev/null 2>&1 || true
            docker network rm loki-ci-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          rm -rf "$RT/var-loki"; mkdir -p "$RT/var-loki"; chmod 700 "$RT/var-loki"
          docker network create loki-ci-net >/dev/null
          docker run -d --name loki-ci \
            --user "$(id -u):$(id -g)" \
            --network loki-ci-net --network-alias loki.logging.svc --hostname loki \
            --volume "$W/loki-config.yaml:/etc/loki/loki.yaml:ro" \
            --volume "$W/pki/server.crt:$LOKI_TLS_CERT:ro" \
            --volume "$W/pki/server.key:$LOKI_TLS_KEY:ro" \
            --volume "$W/pki/ca.crt:$LOKI_TLS_CA:ro" \
            --volume "$RT/var-loki:/var/loki" \
            --publish 127.0.0.1:31000:3100 --publish 127.0.0.1:31001:3101 \
            "$LOKI_IMAGE" -config.file=/etc/loki/loki.yaml >/dev/null

          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@" || true; }

          ready=""
          for _ in $(seq 1 45); do
            [ "$(code http://127.0.0.1:31001/ready)" = "200" ] && { ready=yes; break; }
            sleep 2
          done
          if [ "$ready" != "yes" ]; then
            docker logs --tail 60 loki-ci >&2 || true
            fail "internal server never became ready on 3101"
          fi
          [ "$(code http://127.0.0.1:31001/metrics)" = "200" ] \
            || fail "internal /metrics must be operational on 3101"
          [ "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:31001/loki/api/v1/push)" = "404" ] \
            || fail "push API must not exist on the internal server"
          [ "$(code -G --data-urlencode 'query={ci="x"}' http://127.0.0.1:31001/loki/api/v1/query_range)" = "404" ] \
            || fail "query API must not exist on the internal server"

          tls_rejected() {
            [ "$2" = "000" ] || return 1
            case "$1" in
              35|56) ;;
              *) return 1 ;;
            esac
            case "$3" in
              *SSL*|*TLS*|*tls*|*certificate*|*alert*) ;;
              *) return 1 ;;
            esac
            return 0
          }
          not_rej() { if tls_rejected "$@"; then fail "$4"; fi; }
          is_rej() { if tls_rejected "$@"; then :; else fail "$4"; fi; }
          not_rej 0 403 "" "oracle: rc=0 http=403 is not a TLS rejection"
          not_rej 0 404 "" "oracle: rc=0 http=404 is not a TLS rejection"
          not_rej 0 500 "" "oracle: rc=0 http=500 is not a TLS rejection"
          not_rej 0 000 "" "oracle: rc=0 http=000 is not a TLS rejection"
          not_rej 7 000 "curl: (7) Connection refused" "oracle: refused is not a TLS rejection"
          not_rej 28 000 "curl: (28) Operation timed out" "oracle: timeout is not a TLS rejection"
          not_rej 60 000 "curl: (60) SSL certificate problem" "oracle: server-CA failure is not client-auth rejection"
          is_rej 35 000 "curl: (35) tlsv13 alert certificate required" "oracle: a TLS alert must count"
          is_rej 56 000 "curl: (56) SSL_read: Connection reset by peer" "oracle: TLS recv failure must count"

          probe_client() {
            local rc=0 http
            http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              --resolve loki.logging.svc:31000:127.0.0.1 --cacert "$PKI/ca.crt" \
              "$@" https://loki.logging.svc:31000/ready 2>"$W/tls-probe.err") || rc=$?
            printf '%s %s' "$rc" "$http"
          }

          valid=$(code --resolve loki.logging.svc:31000:127.0.0.1 --cacert "$PKI/ca.crt" --cert "$PKI/client.crt" --key "$PKI/client.key" https://loki.logging.svc:31000/ready)
          [ "$valid" = "200" ] || fail "valid mTLS client must reach /ready before the negatives"

          plain_rc=0
          plain_http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            http://127.0.0.1:31000/ready 2>/dev/null) || plain_rc=$?
          if [ "$plain_http" != "400" ]; then
            [ "$plain_http" = "000" ] && [ "$plain_rc" -ne 0 ] \
              || fail "plain HTTP must be TLS-rejected (400 or transport failure): rc=$plain_rc http=$plain_http"
          fi

          read nocert_rc nocert_http <<< "$(probe_client)"
          nocert_err=$(cat "$W/tls-probe.err")
          if tls_rejected "$nocert_rc" "$nocert_http" "$nocert_err"; then :; else
            fail "no client certificate must be rejected in the TLS handshake (rc=$nocert_rc http=$nocert_http err=$nocert_err)"
          fi

          read wrongca_rc wrongca_http <<< "$(probe_client --cert "$PKI/wrong-client.crt" --key "$PKI/wrong-client.key")"
          wrongca_err=$(cat "$W/tls-probe.err")
          if tls_rejected "$wrongca_rc" "$wrongca_http" "$wrongca_err"; then :; else
            fail "wrong-CA client certificate must be rejected in the TLS handshake (rc=$wrongca_rc http=$wrongca_http err=$wrongca_err)"
          fi

          valid=$(code --resolve loki.logging.svc:31000:127.0.0.1 --cacert "$PKI/ca.crt" --cert "$PKI/client.crt" --key "$PKI/client.key" https://loki.logging.svc:31000/ready)
          [ "$valid" = "200" ] || fail "valid mTLS client must reach /ready after the negatives"

          TOKEN="ci-synthetic-line-$(date +%s)-$$"
          TIMESTAMP=$(date +%s%N)
          PAYLOAD=$(printf '{"streams":[{"stream":{"ci_job":"loki-ci","namespace":"ci","application":"ci-fixture","container":"ci"},"values":[["%s","%s"]]}]}' "$TIMESTAMP" "$TOKEN")
          pushstatus=$(code -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" \
            --resolve loki.logging.svc:31000:127.0.0.1 --cacert "$PKI/ca.crt" \
            --cert "$PKI/client.crt" --key "$PKI/client.key" \
            https://loki.logging.svc:31000/loki/api/v1/push)
          [ "$pushstatus" = "204" ] || fail "mTLS push must return 204, got $pushstatus"
          sleep 2
          QUERY=$(curl -sS --max-time 10 --resolve loki.logging.svc:31000:127.0.0.1 \
            --cacert "$PKI/ca.crt" --cert "$PKI/client.crt" --key "$PKI/client.key" \
            -G --data-urlencode 'query={ci_job="loki-ci"}' \
            https://loki.logging.svc:31000/loki/api/v1/query_range)
          echo "$QUERY" | grep -q '"status":"success"' \
            || fail "LogQL query over mTLS must succeed"
          echo "$QUERY" | grep -q "$TOKEN" \
            || fail "the pushed synthetic line must be returned by the LogQL query"

          CONTAINER_IP=$(docker inspect -f \
            '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' loki-ci)
          [ -n "$CONTAINER_IP" ] || fail "could not resolve the loki-ci bridge IP"
          for refused_port in 9095 7946 9096; do
            probe_rc=0
            probe_err=$(timeout 3 bash -c \
              "exec 3<>/dev/tcp/$CONTAINER_IP/$refused_port" 2>&1 >/dev/null) || probe_rc=$?
            [ "$probe_rc" -ne 124 ] \
              || fail "port $refused_port probe timed out (ambiguous network failure)"
            case "$probe_err" in
              *"Connection refused"*) ;;
              *) fail "port $refused_port must refuse direct bridge connections, got rc=$probe_rc err=$probe_err" ;;
            esac
          done

          echo "OK: mTLS boundary proven: deny no-cert/wrong-CA, valid push+query, 3101 ops-only, 9095/7946/9096 refused"
