---
name: test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # setup-python main 2026-09-09. The previous pin (5fda3b95, v7.0.0)
        # became unresolvable to runners on 2026-09-09 across regions and
        # retries while the API tag cache still served it; upstream rewrote
        # the tagged commit. Re-pinned to a branch-reachable commit.
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      # A full `kustomize build` is not possible in CI: kustomizations such as
      # workloads/mcp-gateway use KSOPS generators whose SOPS decryption keys
      # are not available to pull-request runners. This check proves every
      # kustomization resource, patch, configuration, and generator reference
      # resolves to a tracked file, which is the failure class reference typos
      # introduce.
      - name: Verify kustomization references
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import subprocess, sys, yaml
          from pathlib import Path

          files = subprocess.run(
              ["git", "ls-files", "*/kustomization.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          missing = []
          for f in files:
              doc = yaml.safe_load(Path(f).read_text()) or {}
              base = Path(f).parent
              for key in ("resources", "patches", "configurations", "generators"):
                  for entry in doc.get(key) or []:
                      ref = entry.get("path") if isinstance(entry, dict) else entry
                      if not ref or not isinstance(ref, str):
                          continue
                      if ref.startswith(("./", "https://", "git::")):
                          continue
                      if not (base / ref).exists():
                          missing.append(f"{key} entry '{ref}' in {f}")
          if missing:
              for m in missing:
                  print(f"MISSING: {m}")
              sys.exit(1)
          print(f"OK: all kustomization references resolve across {len(files)} kustomizations")
          EOF

      - name: Validate OpenCode dashboard and auth-boundary probes
        run: |
          python - <<'EOF'
          import hashlib, json, sys, yaml
          from pathlib import Path

          errors = []
          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          docs = [d for d in yaml.safe_load_all(
              Path("workloads/grafana/status-monitoring.yaml").read_text())
              if isinstance(d, dict)]
          kind_names = [(d.get("kind"), d.get("metadata", {}).get("name"))
                        for d in docs]
          check(len(kind_names) == len(set(kind_names)),
                "status-monitoring documents must have unique kind/name")
          by_kind_name = dict(zip(kind_names, docs))

          cm = by_kind_name.get(("ConfigMap", "blackbox-exporter-config"))
          check(cm is not None, "blackbox-exporter-config ConfigMap missing")
          cfg = yaml.safe_load(cm["data"]["blackbox.yml"])
          modules = cfg.get("modules", {})
          check(set(modules) == {"http_2xx", "http_opencode_auth_boundary"},
                "blackbox modules must be exactly http_2xx and http_opencode_auth_boundary")
          check(modules.get("http_2xx") == {
              "prober": "http", "timeout": "10s",
              "http": {"method": "GET", "preferred_ip_protocol": "ip4",
                       "valid_http_versions": ["HTTP/1.1", "HTTP/2.0"]}},
                "http_2xx module must be unchanged")
          check(modules.get("http_opencode_auth_boundary") == {
              "prober": "http", "timeout": "5s",
              "http": {"method": "GET", "preferred_ip_protocol": "ip4",
                       "valid_http_versions": ["HTTP/1.1", "HTTP/2.0"],
                       "valid_status_codes": [401], "follow_redirects": False}},
                "http_opencode_auth_boundary must be a 401-only, no-redirect, 5s GET prober")
          forbidden = {"basic_auth", "authorization", "headers", "body",
                       "bearer_token", "bearer_token_file", "oauth2", "tls_config"}
          check(not (forbidden & set(modules["http_opencode_auth_boundary"]["http"])),
                "auth-boundary module must not carry credentials, headers, or body")

          dep = by_kind_name.get(("Deployment", "blackbox-exporter"))
          check(dep is not None, "blackbox-exporter Deployment missing")
          ann = dep["spec"]["template"]["metadata"].get("annotations", {})
          digest = hashlib.sha256(
              cm["data"]["blackbox.yml"].encode("utf-8")).hexdigest()
          check(ann.get("checksum/blackbox-exporter-config") == digest,
                "checksum/blackbox-exporter-config must equal sha256 of blackbox.yml")

          probes = {d["metadata"]["name"]: d for d in docs
                    if d.get("kind") == "Probe"}
          status = probes.get("status-endpoints")
          check(status is not None, "status-endpoints Probe missing")
          if status:
              check(status["spec"].get("module") == "http_2xx",
                    "status-endpoints module must remain http_2xx")
              check(status["spec"].get("interval") == "30s",
                    "status-endpoints interval must remain 30s")
              check(status["spec"]["targets"]["staticConfig"]["static"] == [
                  "https://argocd.makeitwork.cloud",
                  "https://grafana.makeitwork.cloud",
                  "https://status.makeitwork.cloud"],
                  "status-endpoints targets must be unchanged")
          expected_probes = {
              "opencode-internal-auth-boundary": (
                  "internal", "http://opencode.opencode.svc:4096/global/health"),
              "opencode-external-auth-boundary": (
                  "external", "https://opencode.makeitwork.cloud/global/health"),
          }
          check(set(expected_probes) <= set(probes),
                "both auth-boundary Probes must exist")
          for name, (path_label, url) in expected_probes.items():
              p = probes.get(name)
              if not p:
                  continue
              check(p["metadata"].get("namespace") == "grafana",
                    "%s namespace must be grafana" % name)
              labels = p["metadata"].get("labels", {})
              check(labels.get("application") == "opencode"
                    and labels.get("probe_path") == path_label,
                    "%s metadata labels must be application=opencode probe_path=%s"
                    % (name, path_label))
              spec = p["spec"]
              check(spec.get("interval") == "30s", "%s interval must be 30s" % name)
              check(spec.get("scrapeTimeout") == "10s",
                    "%s scrapeTimeout must be 10s" % name)
              check(spec.get("module") == "http_opencode_auth_boundary",
                    "%s module must be http_opencode_auth_boundary" % name)
              check(spec.get("jobName") == name,
                    "%s jobName must match the Probe name" % name)
              check(spec.get("prober") == {
                  "path": "/probe", "url": "blackbox-exporter.grafana.svc:9115"},
                  "%s prober must be blackbox-exporter.grafana.svc:9115 /probe" % name)
              static_cfg = spec["targets"]["staticConfig"]
              check(static_cfg["static"] == [url],
                    "%s target must be exactly %s" % (name, url))
              check(static_cfg.get("labels") == {
                  "application": "opencode", "probe_path": path_label},
                  "%s target labels must be application=opencode probe_path=%s"
                  % (name, path_label))

          dash_doc = yaml.safe_load(
              Path("workloads/grafana/opencode-dashboard.yaml").read_text())
          check(dash_doc.get("kind") == "GrafanaDashboard", "dashboard kind")
          check(dash_doc["metadata"].get("name") == "opencode-sessions",
                "dashboard name must be opencode-sessions")
          dash = json.loads(dash_doc["spec"]["json"])
          check(dash.get("uid") == "opencode-sessions",
                "dashboard uid must remain opencode-sessions")
          panels = dash.get("panels", [])
          ids = [p.get("id") for p in panels]
          check(len(ids) == len(set(ids)), "dashboard panel ids must be unique")
          check(sorted(ids) == list(range(1, 23)),
                "dashboard must contain exactly panels 1..22")
          grid = [(p["gridPos"]["x"], p["gridPos"]["y"],
                   p["gridPos"]["w"], p["gridPos"]["h"]) for p in panels]
          check(len(grid) == len(set(grid)),
                "dashboard panel grid positions must be unique")
          for p in panels:
              targets = p.get("targets") or []
              check(bool(targets), "panel %s must have targets" % p.get("id"))
              for t in targets:
                  check(t.get("datasource", {}).get("uid") == "prometheus",
                        "panel %s datasource uid must be prometheus" % p.get("id"))
                  check(isinstance(t.get("expr"), str) and t["expr"].strip(),
                        "panel %s must have a non-empty metric expression" % p.get("id"))

          by_id = {p.get("id"): p for p in panels}
          psi_exprs = " ".join(
              t.get("expr", "") for t in by_id.get(17, {}).get("targets", []))
          for metric in ("node_pressure_cpu_waiting_seconds_total",
                         "node_pressure_memory_stalled_seconds_total",
                         "node_pressure_io_stalled_seconds_total"):
              check(metric in psi_exprs,
                    "panel 17 must use exporter PSI metric %s" % metric)
          check("_full_stalled" not in psi_exprs,
                "panel 17 must not use nonexistent *_full_stalled PSI metric names")
          for pid in (20, 21, 22):
              for t in by_id.get(pid, {}).get("targets", []):
                  check("probe_path" in (t.get("legendFormat") or ""),
                        "panel %s legend must bind the probe_path label" % pid)

          if errors:
              for e in errors:
                  print("OPENCODE-OBS-INVALID: %s" % e)
              sys.exit(1)
          print("OK: OpenCode dashboard and auth-boundary probe contract verified")
          EOF

      # Guard the staged opencode-memory-pilot evaluation: minimal overlay,
      # fixed Application/values contract, and inactivity until the
      # owner-confirmed activation PR.
      - name: Validate staged opencode-memory-pilot contract and inactivity
        run: |
          python - <<'EOF'
          import os, subprocess, sys, yaml
          from pathlib import Path

          errors = []
          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          base = Path("workloads/opencode-memory-pilot")
          expected_files = {
              "kustomization.yaml", "persistent-volume-claim.yaml",
              "service.yaml", "application.yaml", "README.md",
          }
          actual_files = {p.name for p in base.iterdir() if p.is_file()}
          check(actual_files == expected_files,
                "pilot directory files %s != expected %s; additions (secrets, "
                "tunnel bindings, ingresses) require design review"
                % (sorted(actual_files), sorted(expected_files)))

          kust = yaml.safe_load((base / "kustomization.yaml").read_text()) or {}
          check(kust.get("resources") == ["persistent-volume-claim.yaml", "service.yaml"],
                "pilot kustomization resources must be exactly the PVC and Service")
          check(not kust.get("generators"), "pilot kustomization must not declare generators")

          pvc = yaml.safe_load((base / "persistent-volume-claim.yaml").read_text())
          check(pvc.get("kind") == "PersistentVolumeClaim", "PVC kind")
          check(pvc["metadata"]["name"] == "opencode-memory-pilot-home", "PVC name")
          check(pvc["metadata"]["namespace"] == "opencode", "PVC namespace")
          check(pvc["spec"]["accessModes"] == ["ReadWriteOnce"], "PVC access mode")
          check(pvc["spec"]["resources"]["requests"]["storage"] == "10Gi", "PVC size")
          check("storageClassName" not in pvc["spec"],
                "PVC must use the cluster-default storage class")

          svc = yaml.safe_load((base / "service.yaml").read_text())
          check(svc.get("kind") == "Service", "Service kind")
          check(svc["metadata"]["name"] == "opencode-memory-pilot", "Service name")
          check(svc["metadata"]["namespace"] == "opencode", "Service namespace")
          spec = svc["spec"]
          check(spec.get("type", "ClusterIP") == "ClusterIP",
                "Service must be ClusterIP only")
          check("externalIPs" not in spec, "Service must not set externalIPs")
          check("externalName" not in spec, "Service must not be ExternalName")
          check("loadBalancerSourceRanges" not in spec,
                "Service must not set loadBalancerSourceRanges")
          check(spec.get("selector") == {"app": "opencode-memory-pilot"},
                "Service selector")
          ports = spec.get("ports", [])
          check(len(ports) == 1, "Service must expose exactly one port")
          if ports:
              check(ports[0].get("port") == 4096, "Service port must be 4096")
              check(ports[0].get("targetPort") == "http",
                    "Service targetPort must be the http named port")
              check(ports[0].get("protocol", "TCP") == "TCP",
                    "Service port protocol must be the default TCP")

          app = yaml.safe_load((base / "application.yaml").read_text())
          check(app.get("kind") == "Application", "Application kind")
          check(app["metadata"]["name"] == "opencode-memory-pilot", "Application name")
          check(app["metadata"]["namespace"] == "argocd", "Application namespace")
          check(app["spec"]["project"] == "default", "Application project")
          check(app["spec"]["destination"]
                == {"server": "https://kubernetes.default.svc", "namespace": "opencode"},
                "Application destination must be the in-cluster server and the opencode namespace")

          sources = app["spec"].get("sources", [])
          check(len(sources) == 2, "Application must declare exactly two sources")
          chart_src = next((s for s in sources if "chart" in s), None)
          git_src = next((s for s in sources if "path" in s), None)
          check(chart_src is not None and chart_src["chart"] == "opencode-server"
                and chart_src["repoURL"] == "ghcr.io/makeitworkcloud/charts"
                and chart_src["targetRevision"] == "0.4.1",
                "chart source must pin opencode-server 0.4.1 from ghcr.io/makeitworkcloud/charts")
          check(git_src is not None
                and git_src["repoURL"] == "https://github.com/makeitworkcloud/kustomize-cluster.git"
                and git_src["path"] == "workloads/opencode-memory-pilot"
                and git_src["targetRevision"] == "main",
                "git source must point at workloads/opencode-memory-pilot on main")

          values = (chart_src or {}).get("helm", {}).get("valuesObject", {})
          check(set(values) == {"fullnameOverride", "persistence", "memoryPilot"},
                "valuesObject keys must be exactly fullnameOverride, persistence, memoryPilot")
          check(values.get("fullnameOverride") == "opencode-memory-pilot",
                "values fullnameOverride")
          check(set(values.get("persistence", {})) == {"existingClaim"},
                "persistence keys must be exactly existingClaim")
          check(values.get("persistence", {}).get("existingClaim")
                == "opencode-memory-pilot-home", "values existingClaim")
          mp = values.get("memoryPilot", {})
          check(set(mp) == {"enabled", "providerSecretName", "serverSecretName"},
                "memoryPilot keys must be exactly enabled, providerSecretName, serverSecretName")
          check(mp.get("enabled") is True, "memoryPilot.enabled must be true")
          check(mp.get("providerSecretName") == "opencode-memory-pilot-provider",
                "memoryPilot providerSecretName contract")
          check(mp.get("serverSecretName") == "opencode-memory-pilot-server-auth",
                "memoryPilot serverSecretName contract")

          sync = app["spec"].get("syncPolicy", {})
          check("automated" not in sync,
                "staged Application must not declare automated sync")
          check(sync.get("syncOptions") == ["CreateNamespace=true"],
                "staged Application syncOptions must be exactly CreateNamespace=true")
          check("retry" in sync, "staged Application keeps retry")

          # Inactivity: no kustomization outside the staged directory may
          # reference it, comparing resolved ref paths (handles ./, ../,
          # nested components, and legacy keys), not just name matching.
          kust_files = ["kustomization.yaml"] + subprocess.run(
              ["git", "ls-files", "*/kustomization.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          ref_keys = ("resources", "patches", "configurations", "generators",
                      "components", "bases", "patchesStrategicMerge",
                      "patchesJson6902")
          for f in kust_files:
              if Path(f).parent == base:
                  continue
              doc = yaml.safe_load(Path(f).read_text()) or {}
              for key in ref_keys:
                  entries = doc.get(key) or []
                  if isinstance(entries, (str, dict)):
                      entries = [entries]
                  for entry in entries:
                      ref = entry.get("path") if isinstance(entry, dict) else entry
                      if not isinstance(ref, str) or ref.startswith(("https://", "git::")):
                          continue
                      resolved = Path(os.path.normpath(Path(f).parent / ref))
                      if resolved == base or base in resolved.parents:
                          errors.append("active reference to pilot in %s: %s[%s]" % (f, key, ref))
          apps = yaml.safe_load(Path("workloads/apps/kustomization.yaml").read_text()) or {}
          refs = [r for r in apps.get("resources") or [] if "opencode-memory-pilot" in str(r)]
          check(not refs, "workloads/apps must not register the pilot yet: %s" % refs)
          check(not list(Path("workloads/apps").glob("*opencode-memory-pilot*")),
                "no pilot app manifest may exist in workloads/apps before activation")

          if errors:
              for e in errors:
                  print("PILOT-INVALID: %s" % e)
              sys.exit(1)
          print("OK: opencode-memory-pilot staged contract and inactivity verified")
          EOF

      - name: pre-commit tests
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # DisCode gates. discode-static asserts the approved active posture
  # (replicas 1, child Application registered exactly once, the dedicated
  # SOPS creation rule first-match contract for the bot Secret,
  # owner-approved-ID TOML shape via the stdlib tomllib) and extracts
  # the build-discode init script path-limited from
  # workloads/discode/deployment.yaml, cross-checking the init image,
  # archive URL, and digest literals. It also verifies the committed bot
  # Secret's encrypted shape (parse, SOPS envelope markers, and
  # creation-rule recipient match) without decryption or value logging:
  # a shape proof, not token validity or decryptability.
  # discode-build runs that script inside the same digest-pinned Node image
  # via a job container, as root in an ephemeral runner (the pod runs
  # uid 1000): it validates the build path, not the pod security context or
  # any runtime credential behavior.
  discode-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      - name: DisCode active assertions and init-script extraction
        env:
          EXPECTED_INIT_IMAGE: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import os, re, sys, tomllib, yaml
          from pathlib import Path

          dep = yaml.safe_load(Path("workloads/discode/deployment.yaml").read_text())
          spec = dep["spec"]
          if spec.get("replicas") != 1:
              sys.exit("deployment replicas must be 1 (approved active contract)")
          if spec.get("strategy", {}).get("type") != "Recreate":
              sys.exit("deployment strategy must be Recreate")
          pod = spec["template"]["spec"]
          if pod.get("automountServiceAccountToken") is not False:
              sys.exit("automountServiceAccountToken must be false")
          build = [c for c in pod["initContainers"] if c["name"] == "build-discode"]
          if len(build) != 1:
              sys.exit("expected exactly one build-discode init container")
          build = build[0]
          expected_image = os.environ["EXPECTED_INIT_IMAGE"]
          if build["image"] != expected_image:
              sys.exit(f"init image {build['image']} != build image {expected_image}")
          if build.get("command") != ["/bin/sh", "-ec"]:
              sys.exit(f"unexpected init command {build.get('command')}")

          script = build["args"][0] if build.get("args") else ""
          expected_url = (
              "https://codeload.github.com/upiscium/DisCode/tar.gz/"
              "6b936f6c7c6cfbb5995a44cbff9361b9d72e4bc2"
          )
          expected_digest = "4da1ecb7d1b5f4313189c2cfd130dc9ac515d7988e98c1f040eaf0de8c39adeb"
          if "npm ci --ignore-scripts --no-audit --no-fund" not in script:
              sys.exit("init script lacks the expected npm ci invocation")
          if expected_url not in script:
              sys.exit("init script lacks the pinned source archive URL")
          if expected_digest not in script:
              sys.exit("init script lacks the pinned archive sha256")

          runtime = [c for c in pod["containers"] if c["name"] == "discode"]
          if len(runtime) != 1:
              sys.exit("expected exactly one discode container")
          env_names = {e["name"] for e in runtime[0].get("env", [])}
          for name in ("OCB_CONFIG_FILE", "STATE_FILE", "DISCORD_TOKEN", "OPENCODE_HOST_CLUSTER_PASSWORD"):
              if name not in env_names:
                  sys.exit(f"runtime container lacks env {name}")

          apps = yaml.safe_load(Path("workloads/apps/kustomization.yaml").read_text()) or {}
          registered = [r for r in apps.get("resources") or [] if r == "discode-app.yaml"]
          if registered != ["discode-app.yaml"]:
              sys.exit(
                  "discode-app.yaml must be registered exactly once in "
                  "workloads/apps/kustomization.yaml"
              )

          # SOPS policy first-match contract for the bot Secret.
          # Credentialless: only .sops.yaml creation rules are read, never
          # secret material or ciphertext. The generic fallback's
          # case-sensitive encrypted_regex would not encrypt DISCORD_TOKEN,
          # so the first matching rule for the target path must be the
          # dedicated one, using the repository's existing recipient.
          sops = yaml.safe_load(Path(".sops.yaml").read_text()) or {}
          rules = sops.get("creation_rules") or []
          if not rules:
              sys.exit(".sops.yaml must declare creation_rules")
          target = "workloads/discode/discode-bot-auth-secret.yaml"
          # Mirror SOPS path matching: first rule whose path_regex matches
          # the path (unanchored search, like Go regexp MatchString), with
          # pathless rules as catch-all fallback.
          first = next(
              (r for r in rules
               if r.get("path_regex") is None
               or re.search(r["path_regex"], target)),
              None,
          )
          if first is None:
              sys.exit(f".sops.yaml has no creation rule matching {target}")
          if first.get("path_regex") != r"(^|/)discode-bot-auth-secret\.yaml$":
              sys.exit(
                  f"first creation rule matching {target} must be the dedicated "
                  f"discode-bot-auth-secret.yaml rule, got {first.get('path_regex')!r}"
              )
          if not re.fullmatch(first.get("encrypted_regex") or "", "DISCORD_TOKEN"):
              sys.exit(
                  f"discode creation rule encrypted_regex {first.get('encrypted_regex')!r} "
                  "must fullmatch DISCORD_TOKEN"
              )
          expected_recipient = "age152ek83tm4fj5u70r3fecytn4kg7c5xca24erjchxexx4pfqg6das7q763l"
          if first.get("age") != expected_recipient:
              sys.exit("discode creation rule must use the existing repository age recipient")

          cfg = tomllib.loads(Path("workloads/discode/discode-config.toml").read_text())
          if set(cfg) != {"discord", "routing", "host", "logging", "metrics"}:
              sys.exit(f"unexpected TOML top-level keys: {sorted(cfg)}")
          d = cfg["discord"]
          for key, value in (
              ("client_id", "1553536583355994272"),
              ("guild_id", "1540492160103620668"),
              ("parent_channel_id", "1540492160988610643"),
          ):
              if d.get(key) != value:
                  sys.exit(f"discord.{key} must be the owner-approved ID {value!r}")
          if d.get("allowed_user_ids") != ["1418250936547148011", "1553609131833696388"]:
              sys.exit('discord.allowed_user_ids must be exactly ["1418250936547148011", "1553609131833696388"]')
          for key in ("allow_permission_always", "stream_assistant_text", "show_tool_summaries"):
              if d[key] is not False:
                  sys.exit(f"discord.{key} must be false")
          if cfg["routing"] != {"default_host": "cluster"}:
              sys.exit("routing must be exactly default_host=cluster")
          host = cfg["host"]["cluster"]
          for key, value in (
              ("base_url", "https://opencode.makeitwork.cloud"),
              ("username", "opencode"),
              ("password_env", "OPENCODE_HOST_CLUSTER_PASSWORD"),
              ("home_directory", "/home/opencode"),
              ("allowed_roots", ["/home/opencode"]),
          ):
              if host.get(key) != value:
                  sys.exit(f"host.cluster.{key} must be {value!r}")
          if cfg["logging"] != {"level": "info", "format": "json"}:
              sys.exit("logging must be info/json")
          if cfg["metrics"] != {"enabled": True, "address": "0.0.0.0", "port": 9464}:
              sys.exit("metrics must match the documented shape")

          out = Path(".discode-ci/init.sh")
          out.parent.mkdir(exist_ok=True)
          out.write_text(script)
          print(f"active assertions passed; extracted {len(script)} bytes of init script")
          EOF

      # Encrypted-shape gate for the committed bot Secret. Credentialless:
      # parses the encrypted file with the existing pinned PyYAML and
      # asserts only shape: apiVersion/kind/type, exact name and
      # namespace, the single DISCORD_TOKEN stringData key as an
      # ENC[AES256_GCM,...] marker (plaintext or base64 fails closed), the
      # sops MAC marker, exactly one age recipient entry equal to the
      # first .sops.yaml creation rule matching this path, and the file's
      # sops.encrypted_regex equal to that rule's encrypted_regex. No sops
      # binary, no decryption, no secret artifacts or logs; failures emit
      # fixed messages only. Passing proves encrypted shape, NOT token
      # validity or cluster-side decryptability.
      - name: Verify encrypted DisCode bot Secret shape (no decryption)
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import re, sys, yaml
          from pathlib import Path

          secret_path = Path("workloads/discode/discode-bot-auth-secret.yaml")
          if not secret_path.is_file():
              sys.exit("MISSING: workloads/discode/discode-bot-auth-secret.yaml")

          try:
              doc = yaml.safe_load(secret_path.read_text())
          except yaml.YAMLError:
              sys.exit("MALFORMED: discode-bot-auth-secret.yaml is not parseable YAML")

          if not isinstance(doc, dict):
              sys.exit("MALFORMED: discode-bot-auth-secret.yaml is not a YAML mapping")
          if doc.get("apiVersion") != "v1":
              sys.exit("MALFORMED: Secret apiVersion must be v1")
          if doc.get("kind") != "Secret":
              sys.exit("MALFORMED: manifest kind must be Secret")
          meta = doc.get("metadata")
          if not isinstance(meta, dict):
              sys.exit("MALFORMED: Secret metadata must be a mapping")
          if meta.get("name") != "discode-bot-auth":
              sys.exit("MALFORMED: metadata.name must be exactly discode-bot-auth")
          if meta.get("namespace") != "opencode":
              sys.exit("MALFORMED: metadata.namespace must be opencode")
          if doc.get("type") != "Opaque":
              sys.exit("MALFORMED: Secret type must be Opaque")

          string_data = doc.get("stringData")
          if not isinstance(string_data, dict) or set(string_data) != {"DISCORD_TOKEN"}:
              sys.exit("MALFORMED: stringData must contain exactly the DISCORD_TOKEN key")
          token = string_data["DISCORD_TOKEN"]
          if not isinstance(token, str):
              sys.exit("UNENCRYPTED: DISCORD_TOKEN value must be a string")
          if not token.startswith("ENC[AES256_GCM,") or not token.endswith("]"):
              sys.exit(
                  "UNENCRYPTED: DISCORD_TOKEN must be a SOPS ENC[AES256_GCM,...] "
                  "value; plaintext or base64 is not acceptable; rotate the "
                  "token if plaintext was ever pushed"
              )

          sops = doc.get("sops")
          if not isinstance(sops, dict):
              sys.exit("MALFORMED: Secret must carry a sops metadata stanza")
          mac = sops.get("mac")
          if not isinstance(mac, str) or not mac.startswith("ENC[") or "AES256_GCM" not in mac:
              sys.exit("MALFORMED: sops.mac must be an ENC[AES256_GCM,...] marker")
          age_entries = sops.get("age")
          if not isinstance(age_entries, list) or len(age_entries) != 1:
              sys.exit("MALFORMED: sops.age must contain exactly one recipient entry")
          expected_recipient = "age152ek83tm4fj5u70r3fecytn4kg7c5xca24erjchxexx4pfqg6das7q763l"
          recipients = [e.get("recipient") for e in age_entries if isinstance(e, dict)]
          if recipients != [expected_recipient]:
              sys.exit("MALFORMED: sops.age recipient must be exactly the repository age recipient")

          # The file's recipient and encrypted_regex must equal the first
          # .sops.yaml creation rule matching this path, and that rule
          # must still select exactly DISCORD_TOKEN (SOPS first-match
          # semantics).
          rules_doc = yaml.safe_load(Path(".sops.yaml").read_text()) or {}
          first = next(
              (r for r in rules_doc.get("creation_rules") or []
               if r.get("path_regex") is None
               or re.search(r["path_regex"], str(secret_path))),
              None,
          )
          if first is None:
              sys.exit("MALFORMED: .sops.yaml has no creation rule matching the Secret path")
          if first.get("age") != expected_recipient:
              sys.exit("MALFORMED: creation rule must use the repository age recipient")
          if not re.fullmatch(first.get("encrypted_regex") or "", "DISCORD_TOKEN"):
              sys.exit("MALFORMED: creation rule encrypted_regex must match DISCORD_TOKEN")
          if sops.get("encrypted_regex") != first.get("encrypted_regex"):
              sys.exit("MALFORMED: file sops.encrypted_regex must equal the creation rule encrypted_regex")

          print(
              "OK: discode-bot-auth Secret encrypted shape verified "
              "(shape only, not token validity or decryptability)"
          )
          EOF

      - name: Upload init script
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discode-init
          path: .discode-ci/init.sh
          if-no-files-found: error

  discode-build:
    runs-on: ubuntu-latest
    needs: discode-static
    container:
      image: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
    steps:
      - name: Download init script
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discode-init

      - name: Validate bootstrap build
        run: |
          mkdir -p /app
          export HOME=/tmp NPM_CONFIG_CACHE=/tmp/npm-cache
          sh "$GITHUB_WORKSPACE/init.sh"
          test -f /app/dist/index.js
          test -f /app/package.json
          test -d /app/node_modules/discord.js
          test ! -d /app/node_modules/.bin/vitest
