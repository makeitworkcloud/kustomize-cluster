---
name: test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # setup-python main 2026-09-09. The previous pin (5fda3b95, v7.0.0)
        # became unresolvable to runners on 2026-09-09 across regions and
        # retries while the API tag cache still served it; upstream rewrote
        # the tagged commit. Re-pinned to a branch-reachable commit.
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      # A full `kustomize build` is not possible in CI: kustomizations such as
      # workloads/mcp-gateway use KSOPS generators whose SOPS decryption keys
      # are not available to pull-request runners. This check proves every
      # kustomization resource, patch, configuration, and generator reference
      # resolves to a tracked file, which is the failure class reference typos
      # introduce.
      - name: Verify kustomization references
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import subprocess, sys, yaml
          from pathlib import Path

          files = subprocess.run(
              ["git", "ls-files", "*/kustomization.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          missing = []
          for f in files:
              doc = yaml.safe_load(Path(f).read_text()) or {}
              base = Path(f).parent
              for key in ("resources", "patches", "configurations", "generators"):
                  for entry in doc.get(key) or []:
                      ref = entry.get("path") if isinstance(entry, dict) else entry
                      if not ref or not isinstance(ref, str):
                          continue
                      if ref.startswith(("./", "https://", "git::")):
                          continue
                      if not (base / ref).exists():
                          missing.append(f"{key} entry '{ref}' in {f}")
          if missing:
              for m in missing:
                  print(f"MISSING: {m}")
              sys.exit(1)
          print(f"OK: all kustomization references resolve across {len(files)} kustomizations")
          EOF

      # Guard the staged opencode-memory-pilot evaluation: minimal overlay,
      # fixed Application/values contract, and inactivity until the
      # owner-confirmed activation PR.
      - name: Validate staged opencode-memory-pilot contract and inactivity
        run: |
          python - <<'EOF'
          import os, subprocess, sys, yaml
          from pathlib import Path

          errors = []
          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          base = Path("workloads/opencode-memory-pilot")
          expected_files = {
              "kustomization.yaml", "persistent-volume-claim.yaml",
              "service.yaml", "application.yaml", "README.md",
          }
          actual_files = {p.name for p in base.iterdir() if p.is_file()}
          check(actual_files == expected_files,
                "pilot directory files %s != expected %s; additions (secrets, "
                "tunnel bindings, ingresses) require design review"
                % (sorted(actual_files), sorted(expected_files)))

          kust = yaml.safe_load((base / "kustomization.yaml").read_text()) or {}
          check(kust.get("resources") == ["persistent-volume-claim.yaml", "service.yaml"],
                "pilot kustomization resources must be exactly the PVC and Service")
          check(not kust.get("generators"), "pilot kustomization must not declare generators")

          pvc = yaml.safe_load((base / "persistent-volume-claim.yaml").read_text())
          check(pvc.get("kind") == "PersistentVolumeClaim", "PVC kind")
          check(pvc["metadata"]["name"] == "opencode-memory-pilot-home", "PVC name")
          check(pvc["metadata"]["namespace"] == "opencode", "PVC namespace")
          check(pvc["spec"]["accessModes"] == ["ReadWriteOnce"], "PVC access mode")
          check(pvc["spec"]["resources"]["requests"]["storage"] == "10Gi", "PVC size")
          check("storageClassName" not in pvc["spec"],
                "PVC must use the cluster-default storage class")

          svc = yaml.safe_load((base / "service.yaml").read_text())
          check(svc.get("kind") == "Service", "Service kind")
          check(svc["metadata"]["name"] == "opencode-memory-pilot", "Service name")
          check(svc["metadata"]["namespace"] == "opencode", "Service namespace")
          spec = svc["spec"]
          check(spec.get("type", "ClusterIP") == "ClusterIP",
                "Service must be ClusterIP only")
          check("externalIPs" not in spec, "Service must not set externalIPs")
          check("externalName" not in spec, "Service must not be ExternalName")
          check("loadBalancerSourceRanges" not in spec,
                "Service must not set loadBalancerSourceRanges")
          check(spec.get("selector") == {"app": "opencode-memory-pilot"},
                "Service selector")
          ports = spec.get("ports", [])
          check(len(ports) == 1, "Service must expose exactly one port")
          if ports:
              check(ports[0].get("port") == 4096, "Service port must be 4096")
              check(ports[0].get("targetPort") == "http",
                    "Service targetPort must be the http named port")
              check(ports[0].get("protocol", "TCP") == "TCP",
                    "Service port protocol must be the default TCP")

          app = yaml.safe_load((base / "application.yaml").read_text())
          check(app.get("kind") == "Application", "Application kind")
          check(app["metadata"]["name"] == "opencode-memory-pilot", "Application name")
          check(app["metadata"]["namespace"] == "argocd", "Application namespace")
          check(app["spec"]["project"] == "default", "Application project")
          check(app["spec"]["destination"]
                == {"server": "https://kubernetes.default.svc", "namespace": "opencode"},
                "Application destination must be the in-cluster server and the opencode namespace")

          sources = app["spec"].get("sources", [])
          check(len(sources) == 2, "Application must declare exactly two sources")
          chart_src = next((s for s in sources if "chart" in s), None)
          git_src = next((s for s in sources if "path" in s), None)
          check(chart_src is not None and chart_src["chart"] == "opencode-server"
                and chart_src["repoURL"] == "ghcr.io/makeitworkcloud/charts"
                and chart_src["targetRevision"] == "0.4.1",
                "chart source must pin opencode-server 0.4.1 from ghcr.io/makeitworkcloud/charts")
          check(git_src is not None
                and git_src["repoURL"] == "https://github.com/makeitworkcloud/kustomize-cluster.git"
                and git_src["path"] == "workloads/opencode-memory-pilot"
                and git_src["targetRevision"] == "main",
                "git source must point at workloads/opencode-memory-pilot on main")

          values = (chart_src or {}).get("helm", {}).get("valuesObject", {})
          check(set(values) == {"fullnameOverride", "persistence", "memoryPilot"},
                "valuesObject keys must be exactly fullnameOverride, persistence, memoryPilot")
          check(values.get("fullnameOverride") == "opencode-memory-pilot",
                "values fullnameOverride")
          check(set(values.get("persistence", {})) == {"existingClaim"},
                "persistence keys must be exactly existingClaim")
          check(values.get("persistence", {}).get("existingClaim")
                == "opencode-memory-pilot-home", "values existingClaim")
          mp = values.get("memoryPilot", {})
          check(set(mp) == {"enabled", "providerSecretName", "serverSecretName"},
                "memoryPilot keys must be exactly enabled, providerSecretName, serverSecretName")
          check(mp.get("enabled") is True, "memoryPilot.enabled must be true")
          check(mp.get("providerSecretName") == "opencode-memory-pilot-provider",
                "memoryPilot providerSecretName contract")
          check(mp.get("serverSecretName") == "opencode-memory-pilot-server-auth",
                "memoryPilot serverSecretName contract")

          sync = app["spec"].get("syncPolicy", {})
          check("automated" not in sync,
                "staged Application must not declare automated sync")
          check(sync.get("syncOptions") == ["CreateNamespace=true"],
                "staged Application syncOptions must be exactly CreateNamespace=true")
          check("retry" in sync, "staged Application keeps retry")

          # Inactivity: no kustomization outside the staged directory may
          # reference it, comparing resolved ref paths (handles ./, ../,
          # nested components, and legacy keys), not just name matching.
          kust_files = ["kustomization.yaml"] + subprocess.run(
              ["git", "ls-files", "*/kustomization.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          ref_keys = ("resources", "patches", "configurations", "generators",
                      "components", "bases", "patchesStrategicMerge",
                      "patchesJson6902")
          for f in kust_files:
              if Path(f).parent == base:
                  continue
              doc = yaml.safe_load(Path(f).read_text()) or {}
              for key in ref_keys:
                  entries = doc.get(key) or []
                  if isinstance(entries, (str, dict)):
                      entries = [entries]
                  for entry in entries:
                      ref = entry.get("path") if isinstance(entry, dict) else entry
                      if not isinstance(ref, str) or ref.startswith(("https://", "git::")):
                          continue
                      resolved = Path(os.path.normpath(Path(f).parent / ref))
                      if resolved == base or base in resolved.parents:
                          errors.append("active reference to pilot in %s: %s[%s]" % (f, key, ref))
          apps = yaml.safe_load(Path("workloads/apps/kustomization.yaml").read_text()) or {}
          refs = [r for r in apps.get("resources") or [] if "opencode-memory-pilot" in str(r)]
          check(not refs, "workloads/apps must not register the pilot yet: %s" % refs)
          check(not list(Path("workloads/apps").glob("*opencode-memory-pilot*")),
                "no pilot app manifest may exist in workloads/apps before activation")

          if errors:
              for e in errors:
                  print("PILOT-INVALID: %s" % e)
              sys.exit(1)
          print("OK: opencode-memory-pilot staged contract and inactivity verified")
          EOF

      - name: pre-commit tests
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # DisCode preparation gates. discode-static asserts the standby posture
  # (replicas 0, child Application unregistered, sentinel TOML shape via the
  # stdlib tomllib) and extracts the build-discode init script path-limited
  # from workloads/discode/deployment.yaml, cross-checking the init image,
  # archive URL, and digest literals. discode-build runs that script inside
  # the same digest-pinned Node image via a job container, as root in an
  # ephemeral runner (the pod runs uid 1000): it validates the build path,
  # not the pod security context or any runtime credential behavior.
  discode-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      - name: DisCode standby assertions and init-script extraction
        env:
          EXPECTED_INIT_IMAGE: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import os, sys, tomllib, yaml
          from pathlib import Path

          dep = yaml.safe_load(Path("workloads/discode/deployment.yaml").read_text())
          spec = dep["spec"]
          if spec.get("replicas") != 0:
              sys.exit("deployment replicas must be 0 while activation-gated")
          if spec.get("strategy", {}).get("type") != "Recreate":
              sys.exit("deployment strategy must be Recreate")
          pod = spec["template"]["spec"]
          if pod.get("automountServiceAccountToken") is not False:
              sys.exit("automountServiceAccountToken must be false")
          build = [c for c in pod["initContainers"] if c["name"] == "build-discode"]
          if len(build) != 1:
              sys.exit("expected exactly one build-discode init container")
          build = build[0]
          expected_image = os.environ["EXPECTED_INIT_IMAGE"]
          if build["image"] != expected_image:
              sys.exit(f"init image {build['image']} != build image {expected_image}")
          if build.get("command") != ["/bin/sh", "-ec"]:
              sys.exit(f"unexpected init command {build.get('command')}")

          script = build["args"][0] if build.get("args") else ""
          expected_url = (
              "https://codeload.github.com/upiscium/DisCode/tar.gz/"
              "6b936f6c7c6cfbb5995a44cbff9361b9d72e4bc2"
          )
          expected_digest = "4da1ecb7d1b5f4313189c2cfd130dc9ac515d7988e98c1f040eaf0de8c39adeb"
          if "npm ci --ignore-scripts --no-audit --no-fund" not in script:
              sys.exit("init script lacks the expected npm ci invocation")
          if expected_url not in script:
              sys.exit("init script lacks the pinned source archive URL")
          if expected_digest not in script:
              sys.exit("init script lacks the pinned archive sha256")

          runtime = [c for c in pod["containers"] if c["name"] == "discode"]
          if len(runtime) != 1:
              sys.exit("expected exactly one discode container")
          env_names = {e["name"] for e in runtime[0].get("env", [])}
          for name in ("OCB_CONFIG_FILE", "STATE_FILE", "DISCORD_TOKEN", "OPENCODE_HOST_CLUSTER_PASSWORD"):
              if name not in env_names:
                  sys.exit(f"runtime container lacks env {name}")

          apps = Path("workloads/apps/kustomization.yaml").read_text()
          if "discode-app.yaml" in apps:
              sys.exit("discode-app.yaml must stay unregistered until activation")

          cfg = tomllib.loads(Path("workloads/discode/discode-config.toml").read_text())
          if set(cfg) != {"discord", "routing", "host", "logging", "metrics"}:
              sys.exit(f"unexpected TOML top-level keys: {sorted(cfg)}")
          d = cfg["discord"]
          for key in ("client_id", "guild_id", "parent_channel_id"):
              if not d[key].startswith("REPLACE_WITH_"):
                  sys.exit(f"discord.{key} sentinel missing while activation-gated")
          if not isinstance(d["allowed_user_ids"], list) or not d["allowed_user_ids"]:
              sys.exit("discord.allowed_user_ids must be a non-empty array")
          for key in ("allow_permission_always", "stream_assistant_text", "show_tool_summaries"):
              if d[key] is not False:
                  sys.exit(f"discord.{key} must be false")
          if cfg["routing"] != {"default_host": "cluster"}:
              sys.exit("routing must be exactly default_host=cluster")
          host = cfg["host"]["cluster"]
          for key, value in (
              ("base_url", "https://opencode.makeitwork.cloud"),
              ("username", "opencode"),
              ("password_env", "OPENCODE_HOST_CLUSTER_PASSWORD"),
              ("home_directory", "/home/opencode"),
              ("allowed_roots", ["/home/opencode"]),
          ):
              if host.get(key) != value:
                  sys.exit(f"host.cluster.{key} must be {value!r}")
          if cfg["logging"] != {"level": "info", "format": "json"}:
              sys.exit("logging must be info/json")
          if cfg["metrics"] != {"enabled": True, "address": "0.0.0.0", "port": 9464}:
              sys.exit("metrics must match the documented standby shape")

          out = Path(".discode-ci/init.sh")
          out.parent.mkdir(exist_ok=True)
          out.write_text(script)
          print(f"standby assertions passed; extracted {len(script)} bytes of init script")
          EOF

      - name: Upload init script
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discode-init
          path: .discode-ci/init.sh
          if-no-files-found: error

  discode-build:
    runs-on: ubuntu-latest
    needs: discode-static
    container:
      image: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
    steps:
      - name: Download init script
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discode-init

      - name: Validate bootstrap build
        run: |
          mkdir -p /app
          export HOME=/tmp NPM_CONFIG_CACHE=/tmp/npm-cache
          sh "$GITHUB_WORKSPACE/init.sh"
          test -f /app/dist/index.js
          test -f /app/package.json
          test -d /app/node_modules/discord.js
          test ! -d /app/node_modules/.bin/vitest
