---
name: test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # setup-python main 2026-09-09. The previous pin (5fda3b95, v7.0.0)
        # became unresolvable to runners on 2026-09-09 across regions and
        # retries while the API tag cache still served it; upstream rewrote
        # the tagged commit. Re-pinned to a branch-reachable commit.
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      # A full `kustomize build` is not possible in CI: kustomizations such as
      # workloads/mcp-gateway use KSOPS generators whose SOPS decryption keys
      # are not available to pull-request runners. This check proves every
      # kustomization resource, patch, configuration, and generator reference
      # resolves to a tracked file, which is the failure class reference typos
      # introduce.
      - name: Verify kustomization references
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import subprocess, sys, yaml
          from pathlib import Path

          files = subprocess.run(
              ["git", "ls-files", "*/kustomization.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          missing = []
          for f in files:
              doc = yaml.safe_load(Path(f).read_text()) or {}
              base = Path(f).parent
              for key in ("resources", "patches", "configurations", "generators"):
                  for entry in doc.get(key) or []:
                      ref = entry.get("path") if isinstance(entry, dict) else entry
                      if not ref or not isinstance(ref, str):
                          continue
                      if ref.startswith(("./", "https://", "git::")):
                          continue
                      if not (base / ref).exists():
                          missing.append(f"{key} entry '{ref}' in {f}")
          if missing:
              for m in missing:
                  print(f"MISSING: {m}")
              sys.exit(1)
          print(f"OK: all kustomization references resolve across {len(files)} kustomizations")
          EOF

      - name: Validate OpenCode dashboard and auth-boundary probes
        run: |
          python - <<'EOF'
          import hashlib, json, sys, yaml
          from pathlib import Path

          errors = []
          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          docs = [d for d in yaml.safe_load_all(
              Path("workloads/grafana/status-monitoring.yaml").read_text())
              if isinstance(d, dict)]
          kind_names = [(d.get("kind"), d.get("metadata", {}).get("name"))
                        for d in docs]
          check(len(kind_names) == len(set(kind_names)),
                "status-monitoring documents must have unique kind/name")
          by_kind_name = dict(zip(kind_names, docs))

          cm = by_kind_name.get(("ConfigMap", "blackbox-exporter-config"))
          check(cm is not None, "blackbox-exporter-config ConfigMap missing")
          cfg = yaml.safe_load(cm["data"]["blackbox.yml"])
          modules = cfg.get("modules", {})
          check(set(modules) == {"http_2xx", "http_opencode_auth_boundary"},
                "blackbox modules must be exactly http_2xx and http_opencode_auth_boundary")
          check(modules.get("http_2xx") == {
              "prober": "http", "timeout": "10s",
              "http": {"method": "GET", "preferred_ip_protocol": "ip4",
                       "valid_http_versions": ["HTTP/1.1", "HTTP/2.0"]}},
                "http_2xx module must be unchanged")
          check(modules.get("http_opencode_auth_boundary") == {
              "prober": "http", "timeout": "5s",
              "http": {"method": "GET", "preferred_ip_protocol": "ip4",
                       "valid_http_versions": ["HTTP/1.1", "HTTP/2.0"],
                       "valid_status_codes": [401], "follow_redirects": False}},
                "http_opencode_auth_boundary must be a 401-only, no-redirect, 5s GET prober")
          forbidden = {"basic_auth", "authorization", "headers", "body",
                       "bearer_token", "bearer_token_file", "oauth2", "tls_config"}
          check(not (forbidden & set(modules["http_opencode_auth_boundary"]["http"])),
                "auth-boundary module must not carry credentials, headers, or body")

          dep = by_kind_name.get(("Deployment", "blackbox-exporter"))
          check(dep is not None, "blackbox-exporter Deployment missing")
          ann = dep["spec"]["template"]["metadata"].get("annotations", {})
          digest = hashlib.sha256(
              cm["data"]["blackbox.yml"].encode("utf-8")).hexdigest()
          check(ann.get("checksum/blackbox-exporter-config") == digest,
                "checksum/blackbox-exporter-config must equal sha256 of blackbox.yml")

          probes = {d["metadata"]["name"]: d for d in docs
                    if d.get("kind") == "Probe"}
          status = probes.get("status-endpoints")
          check(status is not None, "status-endpoints Probe missing")
          if status:
              check(status["spec"].get("module") == "http_2xx",
                    "status-endpoints module must remain http_2xx")
              check(status["spec"].get("interval") == "30s",
                    "status-endpoints interval must remain 30s")
              check(status["spec"]["targets"]["staticConfig"]["static"] == [
                  "https://argocd.makeitwork.cloud",
                  "https://grafana.makeitwork.cloud",
                  "https://status.makeitwork.cloud"],
                  "status-endpoints targets must be unchanged")
          expected_probes = {
              "opencode-internal-auth-boundary": (
                  "internal", "http://opencode.opencode.svc:4096/global/health"),
              "opencode-external-auth-boundary": (
                  "external", "https://opencode.makeitwork.cloud/global/health"),
          }
          check(set(expected_probes) <= set(probes),
                "both auth-boundary Probes must exist")
          for name, (path_label, url) in expected_probes.items():
              p = probes.get(name)
              if not p:
                  continue
              check(p["metadata"].get("namespace") == "grafana",
                    "%s namespace must be grafana" % name)
              labels = p["metadata"].get("labels", {})
              check(labels.get("application") == "opencode"
                    and labels.get("probe_path") == path_label,
                    "%s metadata labels must be application=opencode probe_path=%s"
                    % (name, path_label))
              spec = p["spec"]
              check(spec.get("interval") == "30s", "%s interval must be 30s" % name)
              check(spec.get("scrapeTimeout") == "10s",
                    "%s scrapeTimeout must be 10s" % name)
              check(spec.get("module") == "http_opencode_auth_boundary",
                    "%s module must be http_opencode_auth_boundary" % name)
              check(spec.get("jobName") == name,
                    "%s jobName must match the Probe name" % name)
              check(spec.get("prober") == {
                  "path": "/probe", "url": "blackbox-exporter.grafana.svc:9115"},
                  "%s prober must be blackbox-exporter.grafana.svc:9115 /probe" % name)
              static_cfg = spec["targets"]["staticConfig"]
              check(static_cfg["static"] == [url],
                    "%s target must be exactly %s" % (name, url))
              check(static_cfg.get("labels") == {
                  "application": "opencode", "probe_path": path_label},
                  "%s target labels must be application=opencode probe_path=%s"
                  % (name, path_label))

          dash_doc = yaml.safe_load(
              Path("workloads/grafana/opencode-dashboard.yaml").read_text())
          check(dash_doc.get("kind") == "GrafanaDashboard", "dashboard kind")
          check(dash_doc["metadata"].get("name") == "opencode-sessions",
                "dashboard name must be opencode-sessions")
          dash = json.loads(dash_doc["spec"]["json"])
          check(dash.get("uid") == "opencode-sessions",
                "dashboard uid must remain opencode-sessions")
          panels = dash.get("panels", [])
          ids = [p.get("id") for p in panels]
          check(len(ids) == len(set(ids)), "dashboard panel ids must be unique")
          check(sorted(ids) == list(range(1, 23)),
                "dashboard must contain exactly panels 1..22")
          grid = [(p["gridPos"]["x"], p["gridPos"]["y"],
                   p["gridPos"]["w"], p["gridPos"]["h"]) for p in panels]
          check(len(grid) == len(set(grid)),
                "dashboard panel grid positions must be unique")
          for p in panels:
              targets = p.get("targets") or []
              check(bool(targets), "panel %s must have targets" % p.get("id"))
              for t in targets:
                  check(t.get("datasource", {}).get("uid") == "prometheus",
                        "panel %s datasource uid must be prometheus" % p.get("id"))
                  check(isinstance(t.get("expr"), str) and t["expr"].strip(),
                        "panel %s must have a non-empty metric expression" % p.get("id"))

          by_id = {p.get("id"): p for p in panels}
          psi_exprs = " ".join(
              t.get("expr", "") for t in by_id.get(17, {}).get("targets", []))
          for metric in ("node_pressure_cpu_waiting_seconds_total",
                         "node_pressure_memory_stalled_seconds_total",
                         "node_pressure_io_stalled_seconds_total"):
              check(metric in psi_exprs,
                    "panel 17 must use exporter PSI metric %s" % metric)
          check("_full_stalled" not in psi_exprs,
                "panel 17 must not use nonexistent *_full_stalled PSI metric names")
          for pid in (20, 21, 22):
              for t in by_id.get(pid, {}).get("targets", []):
                  check("probe_path" in (t.get("legendFormat") or ""),
                        "panel %s legend must bind the probe_path label" % pid)

          if errors:
              for e in errors:
                  print("OPENCODE-OBS-INVALID: %s" % e)
              sys.exit(1)
          print("OK: OpenCode dashboard and auth-boundary probe contract verified")
          EOF

      - name: Test OpenCode session usage pagination contract
        run: |
          python - <<'EOF'
          import hashlib, json, math, os, types, unittest, urllib.request
          from pathlib import Path
          from unittest import mock

          import yaml

          DOCS = [d for d in yaml.safe_load_all(Path("workloads/opencode/session-metrics.yaml").read_text())
                  if isinstance(d, dict)]
          CONFIG_MAP = next(d for d in DOCS if d.get("kind") == "ConfigMap")
          DEPLOYMENT = next(d for d in DOCS if d.get("kind") == "Deployment")
          EXPORTER_SOURCE = CONFIG_MAP["data"]["exporter.py"]
          METRIC_NAMES = set((
              "opencode_session_status_up opencode_active_sessions "
              "opencode_session_status_last_success_timestamp_seconds "
              "opencode_session_status_poll_errors_total opencode_llm_tokens_total "
              "opencode_session_usage_scan_up "
              "opencode_session_usage_scan_last_success_timestamp_seconds "
              "opencode_session_usage_scan_errors_total "
              "opencode_session_usage_scan_truncated opencode_session_usage_projects "
              "opencode_session_usage_sessions opencode_session_usage_baseline_timestamp_seconds "
              "opencode_session_usage_scan_pages opencode_session_usage_scan_duration_seconds"
          ).split())

          def build_module():
              module = types.ModuleType("exporter_under_test")
              env = {"SESSION_LIST_LIMIT": "1000", "MAX_USAGE_SCAN_PAGES": "20",
                     "MAX_USAGE_SCAN_SESSIONS": "10000", "USAGE_SCAN_TIMEOUT_SECONDS": "15",
                     "MAX_RESPONSE_BYTES": "4194304", "REQUEST_TIMEOUT_SECONDS": "5"}
              with mock.patch.dict(os.environ, env):
                  exec(compile(EXPORTER_SOURCE, "exporter.py", "exec"), module.__dict__)
              return module

          class FakeClock:
              def __init__(self, wall=1700000000.0):
                  self.wall, self.mono = wall, 1000.0
              def time(self):
                  return self.wall
              def monotonic(self):
                  return self.mono

          def make_row(session_id, updated, project_id="proj-alpha", **kinds):
              return {
                  "id": session_id, "projectID": project_id, "time": {"updated": updated},
                  "tokens": {"input": kinds.get("input", 0), "output": kinds.get("output", 0),
                             "reasoning": kinds.get("reasoning", 0),
                             "cache": {"read": kinds.get("cache_read", 0),
                                       "write": kinds.get("cache_write", 0)}},
                  "title": "Synthetic Title", "directory": "/synthetic/worktree",
                  "provider": "synthetic-provider", "model": "synthetic-model",
              }

          class FakeUsageApi:
              def __init__(self, rows):
                  self.rows = sorted(rows, key=lambda r: (r["time"]["updated"], r["id"]), reverse=True)
                  self.calls = []
              def __call__(self, limit, cursor, budget_check):
                  self.calls.append((limit, cursor))
                  filtered = [r for r in self.rows if cursor is None or r["time"]["updated"] < cursor]
                  page = [dict(r) for r in filtered[:limit]]
                  return page, (str(page[-1]["time"]["updated"]) if len(filtered) > limit else None)

          class StaticResponse:
              def __init__(self, body, status=200, headers=None):
                  self.body, self.status, self.offset = (
                      body if isinstance(body, bytes) else body.encode()), status, 0
                  self.headers = dict(headers or {})
              def read1(self, size):
                  chunk = self.body[self.offset:self.offset + size]
                  self.offset = min(self.offset + size, len(self.body))
                  return chunk
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  return False

          class TrickleResponse(StaticResponse):
              def __init__(self, clock):
                  StaticResponse.__init__(self, b"x")
                  self.clock = clock
              def read1(self, size):
                  self.clock.mono += 2.0
                  return b"x"

          class RecordingOpener:
              def __init__(self, response):
                  self.response, self.requests = response, []
              def open(self, request, timeout=None):
                  self.requests.append((request.full_url, dict(request.header_items())))
                  return self.response

          def snapshot(module):
              with module.state_lock:
                  return (dict(module.state["usage_totals"]),
                          {k: (dict(v["tokens"]), v["missed"])
                           for k, v in module.state["usage_baselines"].items()},
                          module.state["usage_last_success"], module.state["usage_baseline_ts"],
                          module.state["usage_scan_pages"], module.state["usage_projects"],
                          module.state["usage_sessions"], module.state["usage_initialized"])

          class ExporterTestCase(unittest.TestCase):
              def setUp(self):
                  self.module = build_module()
                  self.clock = FakeClock()
                  self.module.time = self.clock
                  self.real_fetch_usage_page = self.module.fetch_usage_page
              def scan(self, api):
                  self.module.fetch_usage_page = api
                  self.module.poll_usage()
                  return self.module.state
              def seed(self):
                  self.scan(FakeUsageApi([make_row("synthetic-seed-a", 1400000000500, input=5),
                                          make_row("synthetic-seed-b", 1400000000400, input=6)]))
                  return snapshot(self.module)
              def assert_down(self, state, before, truncated, errors):
                  self.assertEqual((state["usage_up"], state["usage_scan_truncated"],
                                    state["usage_scan_errors"]), (0, truncated, errors))
                  self.assertEqual(snapshot(self.module), before)

          class TestPaging(ExporterTestCase):
              def test_two_pages_baseline_then_deltas(self):
                  base = 1700000000000
                  api = FakeUsageApi([make_row("synthetic-session-%04d" % i, base + i,
                                               project_id="proj-alpha" if i % 2 else "proj-beta")
                                      for i in range(1501)])
                  state = self.scan(api)
                  self.assertEqual((state["usage_up"], state["usage_scan_pages"],
                                    state["usage_sessions"], state["usage_projects"],
                                    sum(state["usage_totals"].values())), (1, 2, 1501, 2, 0.0))
                  rows = [make_row("synthetic-session-%04d" % i, base + 10000 + i, input=3)
                          for i in range(1501)]
                  rows.append(make_row("synthetic-session-new", base + 20000, input=10 ** 9))
                  self.clock.wall += 30.0
                  state = self.scan(FakeUsageApi(rows))
                  self.assertEqual((state["usage_totals"]["input"], state["usage_sessions"]),
                                   (1501 * 3, 1502))
              def test_exact_full_page_without_header_completes(self):
                  api = FakeUsageApi([make_row("synthetic-full-%04d" % i, 1600000000000 + i)
                                      for i in range(1000)])
                  state = self.scan(api)
                  self.assertEqual((state["usage_up"], state["usage_scan_pages"],
                                    state["usage_sessions"]), (1, 1, 1000))
              def test_tie_overlap_expands_limit_without_double_count(self):
                  updated = 1500000000000
                  api = FakeUsageApi([make_row("synthetic-tie-%04d" % i, updated, output=10)
                                      for i in range(2500)])
                  state = self.scan(api)
                  self.assertEqual((state["usage_scan_pages"], state["usage_sessions"],
                                    sum(state["usage_totals"].values())), (4, 2500, 0.0))
                  self.assertEqual([call[0] for call in api.calls], [1000, 1000, 2000, 4000])
                  state = self.scan(FakeUsageApi(
                      [make_row("synthetic-tie-%04d" % i, updated, output=15)
                       for i in range(2500)]))
                  self.assertEqual((state["usage_totals"]["output"], state["usage_sessions"]),
                                   (12500, 2500))

          class TestBounds(ExporterTestCase):
              def assert_incomplete(self, api, before):
                  self.assert_down(self.scan(api), before, 1, 0)
              def test_configured_bounds_fail_incomplete_atomic(self):
                  cases = [("tie-group-too-large", {"MAX_USAGE_SCAN_SESSIONS": 1500}, True, 2500),
                           ("unique-session-bound", {"MAX_USAGE_SCAN_SESSIONS": 100}, False, 150),
                           ("page-bound", {"MAX_USAGE_SCAN_PAGES": 2}, False, 2500)]
                  for name, overrides, tie, count in cases:
                      with self.subTest(bound=name):
                          self.setUp()
                          for key, value in overrides.items():
                              setattr(self.module, key, value)
                          before = self.seed()
                          updated = 1500000000000
                          rows = [make_row("synthetic-%04d" % i,
                                           updated if tie else updated + i)
                                  for i in range(count)]
                          self.assert_incomplete(FakeUsageApi(rows), before)
              def test_soft_time_budget_and_trickle_incomplete_atomic(self):
                  before = self.seed()
                  api = FakeUsageApi([make_row("synthetic-budget-%04d" % i, 1500000000000 + i)
                                      for i in range(1500)])
                  def slow_fetch(limit, cursor, budget_check):
                      result = api(limit, cursor, budget_check)
                      self.clock.mono += 16.0
                      return result
                  self.assert_incomplete(slow_fetch, before)
                  self.setUp()
                  before = self.seed()
                  self.module.usage_opener = RecordingOpener(TrickleResponse(self.clock))
                  self.module.fetch_usage_page = self.real_fetch_usage_page
                  self.module.poll_usage()
                  self.assert_down(self.module.state, before, 1, 0)
              def test_multichunk_body_decodes_only_at_eof(self):
                  rows = [dict(r, title="Synthetic " + "x" * 112)
                          for r in (make_row("synthetic-mc-%04d" % i, 1500000000000 - i)
                                    for i in range(1501))]
                  page_one, page_two = rows[:1000], rows[999:]
                  responses = [
                      StaticResponse(json.dumps(page_one).encode(),
                                     headers={"x-next-cursor": str(page_one[-1]["time"]["updated"])}),
                      StaticResponse(json.dumps(page_two).encode()),
                  ]
                  opener = RecordingOpener(None)
                  def queued_open(request, timeout=None):
                      opener.requests.append(request.full_url)
                      return responses.pop(0)
                  opener.open = queued_open
                  self.module.usage_opener = opener
                  self.module.fetch_usage_page = self.real_fetch_usage_page
                  self.module.poll_usage()
                  state = self.module.state
                  self.assertEqual((state["usage_up"], state["usage_scan_pages"],
                                    state["usage_sessions"]), (1, 2, 1501))
                  self.setUp()
                  before = self.seed()
                  slow = StaticResponse(json.dumps(rows[:900]).encode())
                  def slow_read1(size):
                      chunk = StaticResponse.read1(slow, size)
                      if not chunk:
                          self.clock.mono += 16.0
                      return chunk
                  slow.read1 = slow_read1
                  self.module.usage_opener = RecordingOpener(slow)
                  self.module.fetch_usage_page = self.real_fetch_usage_page
                  self.module.poll_usage()
                  self.assert_down(self.module.state, before, 1, 0)

          class TestProtocolFailures(ExporterTestCase):
              def static_api(self, page, header=None):
                  return lambda limit, cursor, budget_check: (page, header)
              def full_page(self):
                  return [make_row("synthetic-page-%04d" % i, 1000 - i) for i in range(1000)]
              def test_row_schema_failures_error_atomic(self):
                  def api_for(mutate):
                      row = make_row("synthetic-bad", 500)
                      mutate(row)
                      return self.static_api([row])
                  cases = [
                      ("non-array", lambda: self.static_api({"unexpected": True})),
                      ("non-dict-entry", lambda: self.static_api(["unexpected"])),
                      ("missing-id", lambda: api_for(lambda r: r.pop("id"))),
                      ("empty-id", lambda: api_for(lambda r: r.__setitem__("id", ""))),
                      ("missing-project-id", lambda: api_for(lambda r: r.pop("projectID"))),
                      ("missing-time", lambda: api_for(lambda r: r.pop("time"))),
                      ("bool-timestamp", lambda: api_for(lambda r: r.__setitem__("time", {"updated": True}))),
                      ("float-timestamp", lambda: api_for(lambda r: r.__setitem__("time", {"updated": 500.5}))),
                      ("negative-timestamp", lambda: api_for(lambda r: r.__setitem__("time", {"updated": -1}))),
                      ("missing-tokens", lambda: api_for(lambda r: r.pop("tokens"))),
                      ("missing-input-token", lambda: api_for(lambda r: r["tokens"].pop("input"))),
                      ("missing-cache-tokens", lambda: api_for(lambda r: r["tokens"].pop("cache"))),
                      ("nan-token", lambda: api_for(lambda r: r["tokens"].__setitem__("input", float("nan")))),
                      ("bool-token", lambda: api_for(lambda r: r["tokens"]["cache"].__setitem__("read", True))),
                      ("negative-token", lambda: api_for(lambda r: r["tokens"].__setitem__("output", -3))),
                      ("string-token", lambda: api_for(lambda r: r["tokens"].__setitem__("reasoning", "many"))),
                  ]
                  for name, make_api in cases:
                      with self.subTest(case=name):
                          self.setUp()
                          before = self.seed()
                          self.assert_down(self.scan(make_api()), before, 0, 1)
              def test_page_protocol_failures_error_atomic(self):
                  api = FakeUsageApi(self.full_page() + [make_row("synthetic-zero", 0)])
                  def cursor_violation(limit, cursor, budget_check):
                      if cursor is None:
                          return api(limit, None, budget_check)
                      return [make_row("synthetic-late", 999)], None
                  cases = [
                      ("page-ordering", self.static_api(
                          [make_row("synthetic-a", 300), make_row("synthetic-b", 200),
                           make_row("synthetic-c", 250)])),
                      ("cursor-filter", cursor_violation),
                      ("header-on-partial-page", self.static_api([make_row("synthetic-a", 50)], "50")),
                      ("header-mismatch", self.static_api(self.full_page(), "500")),
                      ("header-malformed", self.static_api(self.full_page(), "12x4")),
                      ("header-negative", self.static_api(self.full_page(), "-1")),
                      ("header-float", self.static_api(self.full_page(), "1.5")),
                  ]
                  for name, case_api in cases:
                      with self.subTest(case=name):
                          self.setUp()
                          before = self.seed()
                          self.assert_down(self.scan(case_api), before, 0, 1)
              def test_body_cap_json_overflow_partial_error_atomic(self):
                  self.scan(FakeUsageApi([make_row("synthetic-a", 1300000000500),
                                          make_row("synthetic-b", 1300000000400)]))
                  before = snapshot(self.module)
                  state = self.scan(FakeUsageApi(
                      [make_row("synthetic-a", 1300000000600, input=1.7e308),
                       make_row("synthetic-b", 1300000000500, input=1.7e308)]))
                  self.assert_down(state, before, 0, 1)
                  for name, body in (("body-cap", b"z" * 4096),
                                     ("malformed-json", b"{"), ("empty-body", b"")):
                      with self.subTest(case=name):
                          self.setUp()
                          before = self.seed()
                          if name == "body-cap":
                              self.module.MAX_RESPONSE_BYTES = 1024
                          self.module.usage_opener = RecordingOpener(StaticResponse(body))
                          self.module.fetch_usage_page = self.real_fetch_usage_page
                          self.module.poll_usage()
                          self.assert_down(self.module.state, before, 0, 1)
                  self.setUp()
                  base = 1300000000000
