---
name: test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # setup-python main 2026-09-09. The previous pin (5fda3b95, v7.0.0)
        # became unresolvable to runners on 2026-09-09 across regions and
        # retries while the API tag cache still served it; upstream rewrote
        # the tagged commit. Re-pinned to a branch-reachable commit.
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      # A full `kustomize build` is not possible in CI: kustomizations such as
      # workloads/mcp-gateway use KSOPS generators whose SOPS decryption keys
      # are not available to pull-request runners. This check proves every
      # kustomization resource, patch, configuration, and generator reference
      # resolves to a tracked file, which is the failure class reference typos
      # introduce.
      - name: Verify kustomization references
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import subprocess, sys, yaml
          from pathlib import Path

          files = subprocess.run(
              ["git", "ls-files", "*/kustomization.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          missing = []
          for f in files:
              doc = yaml.safe_load(Path(f).read_text()) or {}
              base = Path(f).parent
              for key in ("resources", "patches", "configurations", "generators"):
                  for entry in doc.get(key) or []:
                      ref = entry.get("path") if isinstance(entry, dict) else entry
                      if not ref or not isinstance(ref, str):
                          continue
                      if ref.startswith(("./", "https://", "git::")):
                          continue
                      if not (base / ref).exists():
                          missing.append(f"{key} entry '{ref}' in {f}")
          if missing:
              for m in missing:
                  print(f"MISSING: {m}")
              sys.exit(1)
          print(f"OK: all kustomization references resolve across {len(files)} kustomizations")
          EOF

      - name: Validate OpenCode dashboard and auth-boundary probes
        run: |
          python - <<'EOF'
          import hashlib, json, sys, yaml
          from pathlib import Path

          errors = []
          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          docs = [d for d in yaml.safe_load_all(
              Path("workloads/grafana/status-monitoring.yaml").read_text())
              if isinstance(d, dict)]
          kind_names = [(d.get("kind"), d.get("metadata", {}).get("name"))
                        for d in docs]
          check(len(kind_names) == len(set(kind_names)),
                "status-monitoring documents must have unique kind/name")
          by_kind_name = dict(zip(kind_names, docs))

          cm = by_kind_name.get(("ConfigMap", "blackbox-exporter-config"))
          check(cm is not None, "blackbox-exporter-config ConfigMap missing")
          cfg = yaml.safe_load(cm["data"]["blackbox.yml"])
          modules = cfg.get("modules", {})
          check(set(modules) == {"http_2xx", "http_opencode_auth_boundary"},
                "blackbox modules must be exactly http_2xx and http_opencode_auth_boundary")
          check(modules.get("http_2xx") == {
              "prober": "http", "timeout": "10s",
              "http": {"method": "GET", "preferred_ip_protocol": "ip4",
                       "valid_http_versions": ["HTTP/1.1", "HTTP/2.0"]}},
                "http_2xx module must be unchanged")
          check(modules.get("http_opencode_auth_boundary") == {
              "prober": "http", "timeout": "5s",
              "http": {"method": "GET", "preferred_ip_protocol": "ip4",
                       "valid_http_versions": ["HTTP/1.1", "HTTP/2.0"],
                       "valid_status_codes": [401], "follow_redirects": False}},
                "http_opencode_auth_boundary must be a 401-only, no-redirect, 5s GET prober")
          forbidden = {"basic_auth", "authorization", "headers", "body",
                       "bearer_token", "bearer_token_file", "oauth2", "tls_config"}
          check(not (forbidden & set(modules["http_opencode_auth_boundary"]["http"])),
                "auth-boundary module must not carry credentials, headers, or body")

          dep = by_kind_name.get(("Deployment", "blackbox-exporter"))
          check(dep is not None, "blackbox-exporter Deployment missing")
          ann = dep["spec"]["template"]["metadata"].get("annotations", {})
          digest = hashlib.sha256(
              cm["data"]["blackbox.yml"].encode("utf-8")).hexdigest()
          check(ann.get("checksum/blackbox-exporter-config") == digest,
                "checksum/blackbox-exporter-config must equal sha256 of blackbox.yml")

          probes = {d["metadata"]["name"]: d for d in docs
                    if d.get("kind") == "Probe"}
          status = probes.get("status-endpoints")
          check(status is not None, "status-endpoints Probe missing")
          if status:
              check(status["spec"].get("module") == "http_2xx",
                    "status-endpoints module must remain http_2xx")
              check(status["spec"].get("interval") == "30s",
                    "status-endpoints interval must remain 30s")
              check(status["spec"]["targets"]["staticConfig"]["static"] == [
                  "https://argocd.makeitwork.cloud",
                  "https://grafana.makeitwork.cloud",
                  "https://status.makeitwork.cloud"],
                  "status-endpoints targets must be unchanged")
          expected_probes = {
              "opencode-internal-auth-boundary": (
                  "internal", "http://opencode.opencode.svc:4096/global/health"),
              "opencode-external-auth-boundary": (
                  "external", "https://opencode.makeitwork.cloud/global/health"),
          }
          check(set(expected_probes) <= set(probes),
                "both auth-boundary Probes must exist")
          for name, (path_label, url) in expected_probes.items():
              p = probes.get(name)
              if not p:
                  continue
              check(p["metadata"].get("namespace") == "grafana",
                    "%s namespace must be grafana" % name)
              labels = p["metadata"].get("labels", {})
              check(labels.get("application") == "opencode"
                    and labels.get("probe_path") == path_label,
                    "%s metadata labels must be application=opencode probe_path=%s"
                    % (name, path_label))
              spec = p["spec"]
              check(spec.get("interval") == "30s", "%s interval must be 30s" % name)
              check(spec.get("scrapeTimeout") == "10s",
                    "%s scrapeTimeout must be 10s" % name)
              check(spec.get("module") == "http_opencode_auth_boundary",
                    "%s module must be http_opencode_auth_boundary" % name)
              check(spec.get("jobName") == name,
                    "%s jobName must match the Probe name" % name)
              check(spec.get("prober") == {
                  "path": "/probe", "url": "blackbox-exporter.grafana.svc:9115"},
                    "%s prober must be blackbox-exporter.grafana.svc:9115 /probe" % name)
              static_cfg = spec["targets"]["staticConfig"]
              check(static_cfg["static"] == [url],
                    "%s target must be exactly %s" % (name, url))
              check(static_cfg.get("labels") == {
                  "application": "opencode", "probe_path": path_label},
                  "%s target labels must be application=opencode probe_path=%s"
                  % (name, path_label))

          dash_doc = yaml.safe_load(
              Path("workloads/grafana/opencode-dashboard.yaml").read_text())
          check(dash_doc.get("kind") == "GrafanaDashboard", "dashboard kind")
          check(dash_doc["metadata"].get("name") == "opencode-sessions",
                "dashboard name must be opencode-sessions")
          dash = json.loads(dash_doc["spec"]["json"])
          check(dash.get("uid") == "opencode-sessions",
                "dashboard uid must remain opencode-sessions")
          panels = dash.get("panels", [])
          ids = [p.get("id") for p in panels]
          check(len(ids) == len(set(ids)), "dashboard panel ids must be unique")
          check(sorted(ids) == list(range(1, 23)),
                "dashboard must contain exactly panels 1..22")
          grid = [(p["gridPos"]["x"], p["gridPos"]["y"],
                   p["gridPos"]["w"], p["gridPos"]["h"]) for p in panels]
          check(len(grid) == len(set(grid)),
                "dashboard panel grid positions must be unique")
          for p in panels:
              targets = p.get("targets") or []
              check(bool(targets), "panel %s must have targets" % p.get("id"))
              for t in targets:
                  check(t.get("datasource", {}).get("uid") == "prometheus",
                        "panel %s datasource uid must be prometheus" % p.get("id"))
                  check(isinstance(t.get("expr"), str) and t["expr"].strip(),
                        "panel %s must have a non-empty metric expression" % p.get("id"))

          by_id = {p.get("id"): p for p in panels}
          psi_exprs = " ".join(
              t.get("expr", "") for t in by_id.get(17, {}).get("targets", []))
          for metric in ("node_pressure_cpu_waiting_seconds_total",
                         "node_pressure_memory_stalled_seconds_total",
                         "node_pressure_io_stalled_seconds_total"):
              check(metric in psi_exprs,
                    "panel 17 must use exporter PSI metric %s" % metric)
          check("_full_stalled" not in psi_exprs,
                "panel 17 must not use nonexistent *_full_stalled PSI metric names")
          for pid in (20, 21, 22):
              for t in by_id.get(pid, {}).get("targets", []):
                  check("probe_path" in (t.get("legendFormat") or ""),
                        "panel %s legend must bind the probe_path label" % pid)

          if errors:
              for e in errors:
                  print("OPENCODE-OBS-INVALID: %s" % e)
              sys.exit(1)
          print("OK: OpenCode dashboard and auth-boundary probe contract verified")
          EOF

      - name: Test OpenCode session usage pagination contract
        run: |
          python - <<'EOF'
          import hashlib, json, math, os, sys, types, unittest, urllib.request
          from pathlib import Path
          from unittest import mock

          import yaml

          METRICS_PATH = "workloads/opencode/session-metrics.yaml"
          DASHBOARD_PATH = "workloads/grafana/opencode-dashboard.yaml"
          EXPECTED_METRIC_NAMES = {
              "opencode_session_status_up",
              "opencode_active_sessions",
              "opencode_session_status_last_success_timestamp_seconds",
              "opencode_session_status_poll_errors_total",
              "opencode_llm_tokens_total",
              "opencode_session_usage_scan_up",
              "opencode_session_usage_scan_last_success_timestamp_seconds",
              "opencode_session_usage_scan_errors_total",
              "opencode_session_usage_scan_truncated",
              "opencode_session_usage_projects",
              "opencode_session_usage_sessions",
              "opencode_session_usage_baseline_timestamp_seconds",
              "opencode_session_usage_scan_pages",
              "opencode_session_usage_scan_duration_seconds",
          }
          EXPORTER_ENV = {
              "OPENCODE_API_BASE_URL": "http://opencode.opencode.svc:4096",
              "SESSION_LIST_LIMIT": "1000",
              "MAX_USAGE_SCAN_PAGES": "20",
              "MAX_USAGE_SCAN_SESSIONS": "10000",
              "USAGE_SCAN_TIMEOUT_SECONDS": "15",
              "MAX_RESPONSE_BYTES": "4194304",
              "REQUEST_TIMEOUT_SECONDS": "5",
          }

          metrics_docs = [d for d in yaml.safe_load_all(Path(METRICS_PATH).read_text())
                          if isinstance(d, dict)]
          config_map = next(d for d in metrics_docs if d.get("kind") == "ConfigMap")
          deployment = next(d for d in metrics_docs if d.get("kind") == "Deployment")
          exporter_source = config_map["data"]["exporter.py"]

          def build_module():
              module = types.ModuleType("exporter_under_test")
              with mock.patch.dict(os.environ, EXPORTER_ENV):
                  exec(compile(exporter_source, "exporter.py", "exec"), module.__dict__)
              return module

          class FakeClock:
              def __init__(self, wall=1700000000.0, mono=1000.0):
                  self.wall = wall
                  self.mono = mono

              def time(self):
                  return self.wall

              def monotonic(self):
                  return self.mono

              def sleep(self, seconds):
                  self.mono += seconds

          def make_row(session_id, updated, input_tokens=0, output_tokens=0,
                       reasoning_tokens=0, cache_read=0, cache_write=0,
                       project_id="proj-alpha", **extra):
              row = {
                  "id": session_id,
                  "projectID": project_id,
                  "time": {"updated": updated},
                  "tokens": {
                      "input": input_tokens,
                      "output": output_tokens,
                      "reasoning": reasoning_tokens,
                      "cache": {"read": cache_read, "write": cache_write},
                  },
                  "title": "Synthetic Title",
                  "directory": "/synthetic/worktree",
                  "provider": "synthetic-provider",
                  "model": "synthetic-model",
              }
              row.update(extra)
              return row

          class FakeUsageApi:
              def __init__(self, rows):
                  self.rows = sorted(rows, key=lambda r: (r["time"]["updated"], r["id"]), reverse=True)
                  self.calls = []

              def __call__(self, limit, cursor, budget_check):
                  self.calls.append((limit, cursor))
                  filtered = [r for r in self.rows
                              if cursor is None or r["time"]["updated"] < cursor]
                  page = [dict(r) for r in filtered[:limit]]
                  next_cursor = str(page[-1]["time"]["updated"]) if len(filtered) > limit else None
                  return page, next_cursor

          class StaticResponse:
              def __init__(self, body, status=200, next_cursor=None, extra_headers=None):
                  self.body = body if isinstance(body, bytes) else body.encode()
                  self.status = status
                  self.headers = dict(extra_headers or {})
                  if next_cursor is not None:
                      self.headers["x-next-cursor"] = next_cursor
                  self.offset = 0

              def read1(self, size):
                  if self.offset >= len(self.body):
                      return b""
                  chunk = self.body[self.offset:self.offset + size]
                  self.offset += len(chunk)
                  return chunk

              def read(self, size):
                  return self.read1(size)

              def __enter__(self):
                  return self

              def __exit__(self, *args):
                  return False

          class TrickleResponse(StaticResponse):
              def __init__(self, clock, advance=2.0):
                  super().__init__(b"x" * 65536)
                  self.clock = clock
                  self.advance = advance
                  self.chunks = 0

              def read1(self, size):
                  self.clock.mono += self.advance
                  self.chunks += 1
                  return b"x"

          class RecordingOpener:
              def __init__(self, response):
                  self.response = response
                  self.requests = []

              def open(self, request, timeout=None):
                  self.requests.append((request.full_url, dict(request.header_items()), timeout))
                  return self.response

          def state_snapshot(module):
              with module.state_lock:
                  return {
                      "usage_totals": dict(module.state["usage_totals"]),
                      "usage_baselines": {
                          key: {"tokens": dict(value["tokens"]), "missed": value["missed"]}
                          for key, value in module.state["usage_baselines"].items()
                      },
                      "usage_last_success": module.state["usage_last_success"],
                      "usage_baseline_ts": module.state["usage_baseline_ts"],
                      "usage_scan_pages": module.state["usage_scan_pages"],
                      "usage_projects": module.state["usage_projects"],
                      "usage_sessions": module.state["usage_sessions"],
                      "usage_initialized": module.state["usage_initialized"],
                  }

          def run_poll(module, api):
              module.fetch_usage_page = api
              module.poll_usage()

          class ExporterTestCase(unittest.TestCase):
              def setUp(self):
                  self.module = build_module()
                  self.clock = FakeClock()
                  self.module.time = self.clock

              def scan_with(self, api):
                  run_poll(self.module, api)
                  return self.module.state

              def seed_success(self):
                  rows = [
                      make_row("synthetic-seed-a", 1400000000500, input_tokens=5),
                      make_row("synthetic-seed-b", 1400000000400, input_tokens=6),
                  ]
                  self.scan_with(FakeUsageApi(rows))
                  return state_snapshot(self.module)

          class TestNativePaging(ExporterTestCase):
              def test_paging_baseline_then_known_increments(self):
                  base = 1700000000000
                  rows = [
                      make_row("synthetic-session-%04d" % i, base + i,
                               project_id="proj-alpha" if i % 2 else "proj-beta")
                      for i in range(2500)
                  ]
                  state = self.scan_with(FakeUsageApi(rows))
                  self.assertEqual(state["usage_up"], 1)
                  self.assertEqual(state["usage_scan_truncated"], 0)
                  self.assertEqual(state["usage_scan_pages"], 3)
                  self.assertEqual(state["usage_sessions"], 2500)
                  self.assertEqual(state["usage_projects"], 2)
                  self.assertEqual(state["usage_baseline_ts"], self.clock.wall)
                  self.assertEqual(sum(state["usage_totals"].values()), 0.0)
                  self.assertEqual(len(state["usage_baselines"]), 2500)
                  rows_two = [
                      make_row("synthetic-session-%04d" % i, base + 10000 + i, input_tokens=7)
                      for i in range(2500)
                  ]
                  rows_two.append(make_row("synthetic-session-new", base + 20000,
                                           input_tokens=999999999))
                  self.clock.wall += 30.0
                  state = self.scan_with(FakeUsageApi(rows_two))
                  self.assertEqual(state["usage_up"], 1)
                  self.assertEqual(state["usage_totals"]["input"], 2500 * 7)
                  self.assertEqual(state["usage_totals"]["output"], 0.0)
                  self.assertEqual(state["usage_sessions"], 2501)
                  self.assertEqual(state["usage_baseline_ts"], 1700000000.0)
                  self.assertEqual(state["usage_last_success"], self.clock.wall)

              def test_exact_full_single_page_without_header_completes(self):
                  base = 1600000000000
                  rows = [make_row("synthetic-full-%04d" % i, base + i) for i in range(1000)]
                  api = FakeUsageApi(rows)
                  state = self.scan_with(api)
                  self.assertEqual(state["usage_up"], 1)
                  self.assertEqual(state["usage_scan_pages"], 1)
                  self.assertEqual(state["usage_sessions"], 1000)
                  self.assertEqual(api.calls, [(1000, None)])
                  self.assertEqual(state["usage_scan_truncated"], 0)

              def test_exact_full_final_page_without_header_completes(self):
                  base = 1600000000000
                  rows = [make_row("synthetic-full-%04d" % i, base + i) for i in range(1999)]
                  api = FakeUsageApi(rows)
                  state = self.scan_with(api)
                  self.assertEqual(state["usage_up"], 1)
                  self.assertEqual(state["usage_scan_pages"], 2)
                  self.assertEqual(state["usage_sessions"], 1999)
                  self.assertEqual(api.calls, [(1000, None), (1000, base + 1000)])
                  self.assertEqual(state["usage_scan_truncated"], 0)

              def test_tie_boundary_double_limit_no_double_count(self):
                  updated = 1500000000000
                  rows = [make_row("synthetic-tie-%04d" % i, updated, output_tokens=10)
                          for i in range(2500)]
                  api = FakeUsageApi(rows)
                  state = self.scan_with(api)
                  self.assertEqual(state["usage_up"], 1)
                  self.assertEqual(state["usage_sessions"], 2500)
                  self.assertEqual(state["usage_scan_pages"], 4)
                  self.assertEqual([call[0] for call in api.calls], [1000, 1000, 2000, 4000])
                  self.assertEqual(sum(state["usage_totals"].values()), 0.0)
                  rows_two = [make_row("synthetic-tie-%04d" % i, updated, output_tokens=15)
                              for i in range(2500)]
                  state = self.scan_with(FakeUsageApi(rows_two))
                  self.assertEqual(state["usage_totals"]["output"], 2500 * 5)
                  self.assertEqual(state["usage_sessions"], 2500)

          class TestScanBounds(ExporterTestCase):
              def test_tie_group_exceeds_bounds_fails_atomic(self):
                  before = self.seed_success()
                  self.module.MAX_USAGE_SCAN_SESSIONS = 1500
                  updated = 1500000000000
                  rows = [make_row("synthetic-big-%04d" % i, updated) for i in range(2500)]
                  state = self.scan_with(FakeUsageApi(rows))
                  self.assertEqual(state["usage_up"], 0)
                  self.assertEqual(state["usage_scan_truncated"], 1)
                  self.assertEqual(state["usage_scan_errors"], 0)
                  self.assertEqual(state_snapshot(self.module), before)
                  self.assertTrue(math.isfinite(state["usage_scan_duration"]))

              def test_unique_session_bound_fails_atomic(self):
                  before = self.seed_success()
                  self.module.MAX_USAGE_SCAN_SESSIONS = 100
                  base = 1500000000000
                  rows = [make_row("synthetic-many-%04d" % i, base + i) for i in range(150)]
                  state = self.scan_with(FakeUsageApi(rows))
                  self.assertEqual(state["usage_up"], 0)
                  self.assertEqual(state["usage_scan_truncated"], 1)
                  self.assertEqual(state["usage_scan_errors"], 0)
                  self.assertEqual(state_snapshot(self.module), before)

              def test_page_bound_fails_atomic(self):
                  before = self.seed_success()
                  self.module.MAX_USAGE_SCAN_PAGES = 2
                  base = 1500000000000
                  rows = [make_row("synthetic-page-%04d" % i, base + i) for i in range(2500)]
                  state = self.scan_with(FakeUsageApi(rows))
                  self.assertEqual(state["usage_up"], 0)
                  self.assertEqual(state["usage_scan_truncated"], 1)
                  self.assertEqual(state["usage_scan_errors"], 0)
                  self.assertEqual(state_snapshot(self.module), before)

              def test_time_budget_fails_atomic(self):
                  before = self.seed_success()
                  base = 1500000000000
                  rows = [make_row("synthetic-budget-%04d" % i, base + i) for i in range(1500)]
                  api = FakeUsageApi(rows)

                  def slow_fetch(limit, cursor, budget_check):
                      result = api(limit, cursor, budget_check)
                      self.clock.mono += 16.0
                      return result

                  state = self.scan_with(slow_fetch)
                  self.assertEqual(state["usage_up"], 0)
                  self.assertEqual(state["usage_scan_truncated"], 1)
                  self.assertEqual(state["usage_scan_errors"], 0)
                  self.assertEqual(state_snapshot(self.module), before)

          class TestProtocolFailures(ExporterTestCase):
              def assert_protocol_failure(self, api):
                  before = self.seed_success()
                  state = self.scan_with(api)
                  self.assertEqual(state["usage_up"], 0, "protocol failure must mark the scan down")
                  self.assertEqual(state["usage_scan_truncated"], 0,
                                   "protocol failure must not mark truncated")
                  self.assertEqual(state["usage_scan_errors"], 1,
                                   "protocol failure must count one error")
                  self.assertEqual(state_snapshot(self.module), before,
                                   "protocol failure must not commit partial state")

              def static_api(self, page, header):
                  return lambda limit, cursor, budget_check: (page, header)

              def full_page(self):
                  return [make_row("synthetic-page-%04d" % i, 1000 - i) for i in range(1000)]

              def test_non_array_payload(self):
                  self.assert_protocol_failure(self.static_api({"unexpected": True}, None))

              def test_non_dict_entry(self):
                  self.assert_protocol_failure(self.static_api(["unexpected"], None))

              def test_missing_session_id(self):
                  row = make_row("synthetic-bad", 500)
                  del row["id"]
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_empty_session_id(self):
                  self.assert_protocol_failure(self.static_api([make_row("", 500)], None))

              def test_missing_project_id(self):
                  row = make_row("synthetic-bad", 500)
                  del row["projectID"]
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_missing_time(self):
                  row = make_row("synthetic-bad", 500)
                  del row["time"]
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_boolean_timestamp(self):
                  row = make_row("synthetic-bad", 500)
                  row["time"] = {"updated": True}
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_negative_timestamp(self):
                  self.assert_protocol_failure(self.static_api([make_row("synthetic-bad", -1)], None))

              def test_float_timestamp(self):
                  row = make_row("synthetic-bad", 500)
                  row["time"] = {"updated": 500.5}
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_missing_tokens(self):
                  row = make_row("synthetic-bad", 500)
                  del row["tokens"]
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_missing_token_field(self):
                  row = make_row("synthetic-bad", 500)
                  del row["tokens"]["input"]
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_missing_cache_tokens(self):
                  row = make_row("synthetic-bad", 500)
                  del row["tokens"]["cache"]
                  self.assert_protocol_failure(self.static_api([row], None))

              def test_nan_token_value(self):
                  row = make_row("synthetic-bad", 500)
                  row["tokens"]["input"] = float("nan")
                  self.assert_protocol_failure(self.static_api([row], None))

