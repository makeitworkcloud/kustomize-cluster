                  self.assertIn("max(opencode_session_usage_scan_last_success_timestamp_seconds) > 0", expr)
                  self.assertIn("No data", panel["description"])

              def test_no_zero_fill_anywhere(self):
                  for panel in self.dashboard["panels"]:
                      for target in panel["targets"]:
