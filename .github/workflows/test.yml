              def failing_api(self):
                  def api(limit, cursor, budget_check):
                      raise RuntimeError("synthetic failure")
                  return api

              def test_missing_grace_prune_and_return_baseline_only(self):
                  base = 1300000000000
                  self.scan_rows([make_row("synthetic-a", base + 500, input_tokens=10),
                                  make_row("synthetic-b", base + 400, input_tokens=20)])
                  state = self.scan_rows([make_row("synthetic-a", base + 600, input_tokens=15)])
                  self.assertEqual(state["usage_totals"]["input"], 5.0)
                  self.assertEqual(state["usage_sessions"], 1)
                  self.assertEqual(state["usage_baselines"]["synthetic-b"]["missed"], 1,
                                   "one complete-scan grace retained")
                  self.scan_with(self.failing_api())
                  self.assertEqual(
                      self.module.state["usage_baselines"]["synthetic-b"]["missed"], 1,
                      "failed scans do not advance pruning")
                  state = self.scan_rows([make_row("synthetic-a", base + 700, input_tokens=20)])
                  self.assertNotIn("synthetic-b", state["usage_baselines"], "second miss prunes")
                  self.assertEqual(state["usage_totals"]["input"], 10.0)
                  state = self.scan_rows([
                      make_row("synthetic-a", base + 800, input_tokens=25),
                      make_row("synthetic-b", base + 500, input_tokens=120),
                  ])
                  self.assertEqual(state["usage_totals"]["input"], 15.0,
                                   "returning session baselines only")
                  self.assertEqual(state["usage_sessions"], 2)
                  state = self.scan_rows([
                      make_row("synthetic-a", base + 900, input_tokens=30),
                      make_row("synthetic-b", base + 600, input_tokens=130),
                  ])
                  self.assertEqual(state["usage_totals"]["input"], 25.0,
                                   "delta resumes after re-baseline")

