          watch_namespaces = sorted(set(reloader_expected["namespaces"]) | {reloader_namespace})
          roles = [d for d in reloader_docs if d.get("kind") == "Role"]
          bindings = [d for d in reloader_docs if d.get("kind") == "RoleBinding"]
