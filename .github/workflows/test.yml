                          self.assertIn("(time() - opencode_session_usage_scan_last_success_timestamp_seconds) < 120", expr)
                          self.assertIn("opencode_session_usage_baseline_timestamp_seconds > 0", expr)
                          self.assertIn("(time() - opencode_session_usage_baseline_timestamp_seconds) " + baseline_window[1:], expr)
                          self.assertIn(window_up, expr)
