---
name: test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # setup-python main 2026-09-09. The previous pin (5fda3b95, v7.0.0)
        # became unresolvable to runners on 2026-09-09 across regions and
        # retries while the API tag cache still served it; upstream rewrote
        # the tagged commit. Re-pinned to a branch-reachable commit.
        uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"

      # A full `kustomize build` is not possible in CI: kustomizations such as
      # workloads/mcp-gateway use KSOPS generators whose SOPS decryption keys
      # are not available to pull-request runners. This check proves every
      # kustomization resource, patch, configuration, and generator reference
      # resolves to a tracked file, which is the failure class reference typos
      # introduce.
      - name: Verify kustomization references
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python - <<'EOF'
          import subprocess, sys, yaml
          from pathlib import Path

          files = subprocess.run(
              ["git", "ls-files", "*/kustomization.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          missing = []
          for f in files:
              doc = yaml.safe_load(Path(f).read_text()) or {}
              base = Path(f).parent
              for key in ("resources", "patches", "configurations", "generators"):
                  for entry in doc.get(key) or []:
                      ref = entry.get("path") if isinstance(entry, dict) else entry
                      if not ref or not isinstance(ref, str):
                          continue
                      if ref.startswith(("./", "https://", "git::")):
                          continue
                      if not (base / ref).exists():
                          missing.append(f"{key} entry '{ref}' in {f}")
          if missing:
              for m in missing:
                  print(f"MISSING: {m}")
              sys.exit(1)
          print(f"OK: all kustomization references resolve across {len(files)} kustomizations")
          EOF

      - name: pre-commit tests
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      # Validates the DisCode init-container bootstrap before any pod runs
      # it: fetch + upstream build + payload staging, inside the same
      # digest-pinned Node image the Deployment uses. The extraction is
      # path-limited to workloads/discode/deployment.yaml and reuses the
      # hash-pinned PyYAML installed above; it also cross-checks the init
      # image reference and asserts the pinned source archive URL and
      # sha256 literals are present in the script. The container action runs
      # as root in an ephemeral runner container (the pod runs uid 1000); it
      # validates the build path, not the pod security context.
      - name: Extract DisCode init script
        env:
          EXPECTED_INIT_IMAGE: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
        run: |
          python - <<'EOF'
          import os, sys, yaml
          from pathlib import Path

          path = Path("workloads/discode/deployment.yaml")
          docs = list(yaml.safe_load_all(path.read_text()))
          deployment = next((d for d in docs if d and d.get("kind") == "Deployment"), None)
          if deployment is None:
              sys.exit(f"{path}: no Deployment document")

          expected = os.environ["EXPECTED_INIT_IMAGE"]
          inits = deployment["spec"]["template"]["spec"]["initContainers"]
          build = [c for c in inits if c["name"] == "build-discode"]
          if len(build) != 1:
              sys.exit(f"{path}: expected exactly one build-discode init container")
          build = build[0]
          if build["image"] != expected:
              sys.exit(f"{path}: init image {build['image']} != CI image {expected}")
          if build.get("command") != ["/bin/sh", "-ec"]:
              sys.exit(f"{path}: unexpected init command {build.get('command')}")

          script = build["args"][0] if build.get("args") else ""
          if "npm ci --ignore-scripts --no-audit --no-fund" not in script:
              sys.exit(f"{path}: init script lacks the expected npm ci invocation")
          expected_url = (
              "https://codeload.github.com/upiscium/DisCode/tar.gz/"
              "6b936f6c7c6cfbb5995a44cbff9361b9d72e4bc2"
          )
          expected_digest = "4da1ecb7d1b5f4313189c2cfd130dc9ac515d7988e98c1f040eaf0de8c39adeb"
          if expected_url not in script:
              sys.exit(f"{path}: init script lacks the pinned source archive URL")
          if expected_digest not in script:
              sys.exit(f"{path}: init script lacks the pinned archive sha256")

          out = Path(".discode-ci/init.sh")
          out.parent.mkdir(exist_ok=True)
          out.write_text(script)
          print(f"extracted {len(script)} bytes of init script to {out}")
          EOF
      - name: Validate DisCode bootstrap in pinned Node image
        uses: docker://docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
        with:
          entrypoint: /bin/sh
          args:
            - -ec
            - |
              mkdir -p /app
              export HOME=/tmp NPM_CONFIG_CACHE=/tmp/npm-cache
              sh /github/workspace/.discode-ci/init.sh
              test -f /app/dist/index.js
              test -f /app/package.json
              test -d /app/node_modules/discord.js
              test ! -d /app/node_modules/.bin/vitest
