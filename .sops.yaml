creation_rules:
  - path_regex: cloudflared-credentials-secret\.yaml$
    age: age152ek83tm4fj5u70r3fecytn4kg7c5xca24erjchxexx4pfqg6das7q763l
    encrypted_regex: '^(credentials\.json)$'

  - path_regex: alertmanager-discord-secret\.yaml$
    age: age152ek83tm4fj5u70r3fecytn4kg7c5xca24erjchxexx4pfqg6das7q763l
    encrypted_regex: '^(alertmanager\.yaml)$'

  # The SSH key is the only encrypted field in this dedicated Secret.
  - path_regex: hero-ssh-secret\.yaml$
    age: age152ek83tm4fj5u70r3fecytn4kg7c5xca24erjchxexx4pfqg6das7q763l
    encrypted_regex: '^(privateKey)$'

  # OpenCode SMS bridge runtime inputs. Field names are exact; every value in
  # these three Secrets is credential or routing material.
  - path_regex: opencode-sms-bridge-(routing|shared|worker)-secret\.yaml$
    age: age152ek83tm4fj5u70r3fecytn4kg7c5xca24erjchxexx4pfqg6das7q763l
    encrypted_regex: '^(routing\.json|state-encryption-key|sender-hash-key|twilio-auth-token|twilio-api-key-sid|twilio-api-key-secret)$'

  # Encrypt credential fields only so metadata remains reviewable.
  - age: age152ek83tm4fj5u70r3fecytn4kg7c5xca24erjchxexx4pfqg6das7q763l
    encrypted_regex: '^(token|api-token|apiToken|clientID|clientSecret|client_id|client_secret|password|secret|authorization|github_token|github_app_private_key|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|ARGOCD_API_TOKEN|GRAFANA_SERVICE_ACCOUNT_TOKEN|CLOUDFLARE_API_TOKEN|KIMI_API_KEY|MINIMAX_API_KEY|ZHIPU_API_KEY|credentials\.json|auth\.json|.*_SERVICE_KEY|GF_AUTH_(GITHUB|GENERIC_OAUTH)_CLIENT_SECRET|GF_SECURITY_ADMIN_PASSWORD|dex\.[a-z]+\.clientID|dex\.[a-z]+\.clientSecret|OIDC_CLIENT_(ID|SECRET))$'
