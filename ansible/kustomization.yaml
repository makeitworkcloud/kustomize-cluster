---
# AWX (Ansible Automation Platform)
#
# Sync waves:
#   Wave 0: Operator subscription - installs CRDs
#   Wave 1: AWX instance - requires CRDs
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Wave 0: Operator
  - operator.yaml
  - certs.yaml
  # Wave 1: AWX instance
  - awx.yaml
