---
# Actions Runner Controller (ARC) for GitHub Actions self-hosted runners
#
# Sync waves:
#   Wave 0: Operator deployments (arcsystem, dindsystem) - installs CRDs
#   Wave 1: Runner instances (arcrunners, dindrunners) - requires CRDs
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - imageregistry.yaml
  - imagestream.yaml
  # Wave 0: Operators
  - arcsystem.yaml
  - dindsystem.yaml
  # Wave 1: Runner instances
  - arcrunners.yaml
  - dindrunners.yaml
  - registry.yaml
