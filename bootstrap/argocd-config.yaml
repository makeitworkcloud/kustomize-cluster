---
# OpenShift GitOps ArgoCD configuration
# - KSOPS for SOPS-encrypted secrets using AGE keys
# - GitHub OAuth authentication via Dex
# - RBAC with GitHub org/team mapping
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # KSOPS configuration
  kustomizeBuildOptions: "--enable-alpha-plugins --enable-exec"
  repo:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    env:
      - name: XDG_CONFIG_HOME
        value: /.config
      - name: SOPS_AGE_KEY_FILE
        value: /.config/sops/age/key.txt
    volumes:
      - name: custom-tools
        emptyDir: {}
      - name: sops-age-keys
        secret:
          secretName: sops-age-keys
    initContainers:
      # Use alpine to download and install KSOPS binaries
      - name: install-ksops
        image: docker.io/alpine:3.21
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Downloading kustomize v5.8.0..."
            wget -qO- https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz | tar xz -C /custom-tools
            echo "Downloading KSOPS v4.4.0..."
            wget -qO- https://github.com/viaduct-ai/kustomize-sops/releases/download/v4.4.0/ksops_4.4.0_Linux_x86_64.tar.gz | tar xz -C /custom-tools
            chmod +x /custom-tools/kustomize /custom-tools/ksops
            echo "Done."
        volumeMounts:
          - mountPath: /custom-tools
            name: custom-tools
    volumeMounts:
      - mountPath: /usr/local/bin/kustomize
        name: custom-tools
        subPath: kustomize
      - mountPath: /usr/local/bin/ksops
        name: custom-tools
        subPath: ksops
      - mountPath: /.config/sops/age/key.txt
        name: sops-age-keys
        subPath: key.txt
  # GitHub OAuth via Dex
  dex:
    openShiftOAuth: false
    config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $dex.github.clientID
            clientSecret: $dex.github.clientSecret
            orgs:
              - name: makeitworkcloud
            loadAllGroups: true
            teamNameField: slug
            useLoginAsID: true
  # RBAC with GitHub team mapping
  rbac:
    defaultPolicy: ''
    policy: |
      # Admin access for admins team
      g, makeitworkcloud:admins, role:admin
      # Read-only access for developers team
      g, makeitworkcloud:developers, role:readonly
    scopes: '[groups]'
