---
# Service account for CI/CD pipelines (GitHub Actions)
# Token is created as a long-lived secret for headless authentication
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Long-lived API token for CI/CD
# Extract with: oc get secret ci-deployer-token -n openshift-gitops -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
# Grant cluster-admin to CI service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-deployer-cluster-admin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: openshift-gitops
