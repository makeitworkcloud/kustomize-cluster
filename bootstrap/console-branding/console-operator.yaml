---
# Console operator configuration for custom branding (OpenShift 4.19+ modern API)
apiVersion: operator.openshift.io/v1
kind: Console
metadata:
  name: cluster
spec:
  customization:
    customProductName: makeitwork.cloud
    customLogoFile: null
    logos:
      - type: Masthead
        themes:
          - mode: Light
            source:
              from: ConfigMap
              configMap:
                name: console-custom-logo
                key: console-logo-light.svg
          - mode: Dark
            source:
              from: ConfigMap
              configMap:
                name: console-custom-logo
                key: console-logo-dark.svg
      - type: Favicon
        themes:
          - mode: Light
            source:
              from: ConfigMap
              configMap:
                name: console-custom-favicon
                key: favicon.png
          - mode: Dark
            source:
              from: ConfigMap
              configMap:
                name: console-custom-favicon
                key: favicon.png
