---
# OpenShift OAuth configuration with GitHub identity provider
# Replaces HTPasswd with GitHub org-based authentication
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  identityProviders:
    - name: github
      type: GitHub
      mappingMethod: claim
      github:
        clientID: Ov23liF7cgXcPqnZf6dk
        clientSecret:
          name: github-oauth-secret
        teams:
          - makeitworkcloud/admins
          - makeitworkcloud/developers
  tokenConfig:
    accessTokenMaxAgeSeconds: 31536000
