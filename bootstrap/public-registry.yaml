---
apiVersion: v1
kind: Namespace
metadata:
  name: public-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: gh-cli
  namespace: public-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  lookupPolicy:
    local: true
  tags:
    - from:
        kind: DockerImage
        name: ghcr.io/makeitworkcloud/gh-cli:latest
      name: latest
      importPolicy:
        scheduled: true
