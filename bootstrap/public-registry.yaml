---
apiVersion: v1
kind: Namespace
metadata:
  name: public-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: gh-cli
  namespace: public-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  lookupPolicy:
    local: true
  tags:
    - from:
        kind: DockerImage
        name: ghcr.io/makeitworkcloud/gh-cli:latest
      name: latest
      importPolicy:
        scheduled: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-viewers
  namespace: public-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: registry-viewer
subjects:
  - kind: Group
    name: system:unauthenticated
