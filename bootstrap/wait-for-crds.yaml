---
# PostSync hook to wait for operator CRDs before workloads sync
# Runs after operators app syncs, before workloads app syncs
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    ignore-check.kube-linter.io/non-existent-service-account: "SA created by GitOps operator"
    ignore-check.kube-linter.io/latest-tag: "bitnami/kubectl:latest is acceptable for a one-shot bootstrap wait Job"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 30
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: argocd-argocd-application-controller
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for operator CRDs..."

              # Wait for ARC CRDs
              echo "Checking for ARC CRDs..."
              until kubectl get crd runnerdeployments.actions.summerwind.dev 2>/dev/null; do
                echo "Waiting for runnerdeployments.actions.summerwind.dev CRD..."
                sleep 10
              done
              echo "ARC CRDs ready"

              # Wait for Cloudflare Operator CRDs
              echo "Checking for Cloudflare Operator CRDs..."
              until kubectl get crd clustertunnels.networking.cfargotunnel.com 2>/dev/null; do
                echo "Waiting for clustertunnels.networking.cfargotunnel.com CRD..."
                sleep 10
              done
              echo "Cloudflare Operator CRDs ready"

              # Wait for Tor Controller CRDs
              echo "Checking for Tor Controller CRDs..."
              until kubectl get crd onionservices.tor.k8s.torproject.org 2>/dev/null; do
                echo "Waiting for onionservices.tor.k8s.torproject.org CRD..."
                sleep 10
              done
              echo "Tor Controller CRDs ready"

              echo "All operator CRDs are available"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
