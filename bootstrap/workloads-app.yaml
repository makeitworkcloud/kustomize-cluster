---
# App-of-apps Application for cluster workloads
# Deployed in wave 1 after KSOPS is configured and repo-server is ready
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-workloads
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
    path: workloads
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
