---
# Workloads Application - CRs that depend on operator CRDs
# Deployed in wave 2 after operators are installed
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-workloads
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
    path: workloads
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
  # Ignore fields that OpenShift mutates on ImageStreams after import
  ignoreDifferences:
    - group: image.openshift.io
      kind: ImageStream
      jsonPointers:
        - /spec/lookupPolicy
        - /spec/tags/0/generation
        - /spec/tags/0/importPolicy/importMode
        - /spec/tags/0/referencePolicy
        - /spec/tags/0/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
