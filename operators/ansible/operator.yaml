---
apiVersion: v1
kind: Namespace
metadata:
  name: awx
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# AWX operator catalog - upstream operator not in community-operators
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: awx-operator-catalog
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  displayName: AWX Operator
  publisher: AWX Community
  sourceType: grpc
  image: quay.io/ansible/awx-operator-catalog:2.19.1
  updateStrategy:
    registryPoll:
      interval: 10m
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: awx-operator
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  targetNamespaces:
    - awx
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: awx-operator
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: alpha
  installPlanApproval: Automatic
  config:
    resources: {}
  name: awx-operator
  source: awx-operator-catalog
  sourceNamespace: openshift-marketplace
