---
# Configure OpenShift API server to use Let's Encrypt cert
# Replaces the default CRC self-signed cert for api.makeitwork.cloud
# Sync wave 2: after certificate is issued (wave 1)
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  servingCerts:
    namedCertificates:
      - names:
          - api.makeitwork.cloud
        servingCertificate:
          name: api-makeitwork-cloud-tls
