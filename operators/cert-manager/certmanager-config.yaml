---
# Configure cert-manager to use external DNS servers for DNS-01 challenges
# Required because cluster DNS cannot resolve external domains properly
apiVersion: operator.openshift.io/v1alpha1
kind: CertManager
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  managementState: Managed
  logLevel: Normal
  operatorLogLevel: Normal
  controllerConfig:
    overrideArgs:
      # Use Cloudflare and Google public DNS for ACME DNS-01 challenge validation
      - "--dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53"
      # Only use the specified nameservers (don't fall back to cluster DNS)
      - "--dns01-recursive-nameservers-only"
