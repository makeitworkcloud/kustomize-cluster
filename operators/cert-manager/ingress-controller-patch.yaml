---
# Patch OpenShift IngressController to use Let's Encrypt wildcard certificates
# Sync wave 2: after certificates are issued and secrets exist
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Sync options: allow ArgoCD to retry if secret doesn't exist yet
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Retry=true
spec:
  defaultCertificate:
    # Use the *.apps.makeitwork.cloud wildcard cert as default
    # This covers OpenShift routes: console, oauth, image-registry
    name: wildcard-apps-makeitwork-cloud-tls
