---
# cert-manager itself is bootstrap-installed from tfroot-libvirt cloud-init.
# This kustomization manages ClusterIssuers, the dedicated logging PKI, and
# the Cloudflare DNS-01 API token Secret they consume.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-issuer.yaml
  - logging-pki.yaml
generators:
  - ksops-cert-manager-secrets.yaml
