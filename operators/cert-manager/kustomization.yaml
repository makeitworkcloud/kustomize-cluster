---
# cert-manager itself is bootstrap-installed from tfroot-libvirt cloud-init.
# This kustomization manages ClusterIssuers, admission guardrails for the
# logging PKI, and the Cloudflare DNS-01 API token Secret they consume.
# logging-pki.yaml stays authored but intentionally UNREFERENCED until the
# separate activation PR, which follows live proof that these native
# admission policies deny unauthorized issuance: no logging selfsigned/root
# CA keys are created before that gate.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-issuer.yaml
  - logging-admission.yaml
generators:
  - ksops-cert-manager-secrets.yaml
