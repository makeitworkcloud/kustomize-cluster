---
# Native in-tree admission guardrails for the staged logging PKI: no new
# controller, image or webhook. ValidatingAdmissionPolicy is GA since
# Kubernetes 1.30 (cluster runs k3s v1.31.13). Reference:
#   https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
# Scope is ONLY the dedicated logging issuers (logging-selfsigned, logging-ca)
# and the logging-root-ca trust anchor; unrelated cert-manager issuers,
# Certificates, CertificateRequests and other CSR signers never match.
# "Spec unchanged" (metadata-only update) is detected via metadata.generation:
# the API server increments it only on non-metadata, non-status writes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: logging-certificate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificates"]
  matchConditions:
    - name: logging-pki-scope
      expression: >-
        (has(object.spec.issuerRef) && has(object.spec.issuerRef.name) &&
         (object.spec.issuerRef.name == 'logging-ca' || object.spec.issuerRef.name == 'logging-selfsigned') &&
         (!has(object.spec.issuerRef.kind) || object.spec.issuerRef.kind == 'ClusterIssuer') &&
         (!has(object.spec.issuerRef.group) || object.spec.issuerRef.group == 'cert-manager.io')) ||
        (has(object.spec.secretName) && object.spec.secretName == 'logging-root-ca') ||
        object.metadata.name == 'logging-root-ca'
  variables:
    - name: isArgo
      expression: >-
        request.userInfo.username == 'system:serviceaccount:argocd:argocd-argocd-application-controller'
    - name: metadataOnlyUpdate
      expression: >-
        request.operation == 'UPDATE' && object.metadata.generation == oldObject.metadata.generation
    - name: refSelfSigned
      expression: >-
        has(object.spec.issuerRef) && object.spec.issuerRef.name == 'logging-selfsigned' &&
        has(object.spec.issuerRef.kind) && object.spec.issuerRef.kind == 'ClusterIssuer' &&
        has(object.spec.issuerRef.group) && object.spec.issuerRef.group == 'cert-manager.io'
    - name: refCA
      expression: >-
        has(object.spec.issuerRef) && object.spec.issuerRef.name == 'logging-ca' &&
        has(object.spec.issuerRef.kind) && object.spec.issuerRef.kind == 'ClusterIssuer' &&
        has(object.spec.issuerRef.group) && object.spec.issuerRef.group == 'cert-manager.io'
    - name: leafKeyLifetime
      expression: >-
        has(object.spec.duration) && object.spec.duration == '2160h' &&
        has(object.spec.renewBefore) && object.spec.renewBefore == '360h' &&
        has(object.spec.privateKey) && has(object.spec.privateKey.algorithm) &&
        object.spec.privateKey.algorithm == 'ECDSA' &&
        has(object.spec.privateKey.size) && object.spec.privateKey.size == 256 &&
        has(object.spec.privateKey.rotationPolicy) && object.spec.privateKey.rotationPolicy == 'Always' &&
        (!has(object.spec.isCA) || object.spec.isCA == false)
    - name: isRootCA
      expression: >-
        object.metadata.name == 'logging-root-ca' && request.namespace == 'cert-manager' &&
        has(object.spec.secretName) && object.spec.secretName == 'logging-root-ca' &&
        variables.refSelfSigned &&
        has(object.spec.isCA) && object.spec.isCA == true &&
        has(object.spec.commonName) && object.spec.commonName == 'logging-root-ca' &&
        has(object.spec.usages) && size(object.spec.usages) == 3 &&
        object.spec.usages.all(u, u in ['signing', 'cert sign', 'crl sign']) &&
        has(object.spec.duration) && object.spec.duration == '87600h' &&
        has(object.spec.renewBefore) && object.spec.renewBefore == '720h' &&
        has(object.spec.privateKey) && has(object.spec.privateKey.algorithm) && object.spec.privateKey.algorithm == 'ECDSA' &&
        has(object.spec.privateKey.size) && object.spec.privateKey.size == 256 &&
        has(object.spec.privateKey.rotationPolicy) && object.spec.privateKey.rotationPolicy == 'Never' &&
        has(object.spec.secretTemplate) && has(object.spec.secretTemplate.annotations) &&
        object.spec.secretTemplate.annotations['argocd.argoproj.io/sync-options'] == 'Prune=false,Delete=false'
    - name: isLokiServer
      expression: >-
        object.metadata.name == 'loki-server' && request.namespace == 'logging' &&
        has(object.spec.secretName) && object.spec.secretName == 'loki-server-tls' &&
        variables.refCA && variables.leafKeyLifetime &&
        has(object.spec.commonName) && object.spec.commonName == 'loki.logging.svc' &&
        has(object.spec.dnsNames) && size(object.spec.dnsNames) == 4 &&
        object.spec.dnsNames.all(d, d in ['loki.logging.svc', 'loki.logging.svc.cluster.local', 'loki-headless.logging.svc', 'loki-headless.logging.svc.cluster.local']) &&
        has(object.spec.usages) && size(object.spec.usages) == 1 && object.spec.usages.all(u, u == 'server auth')
    - name: isAlloyClient
      expression: >-
        object.metadata.name == 'alloy-client' && request.namespace == 'logging' &&
        has(object.spec.secretName) && object.spec.secretName == 'loki-alloy-client' &&
        variables.refCA && variables.leafKeyLifetime &&
        has(object.spec.commonName) && object.spec.commonName == 'alloy.logging' &&
        !has(object.spec.dnsNames) &&
        has(object.spec.usages) && size(object.spec.usages) == 1 && object.spec.usages.all(u, u == 'client auth')
    - name: isGrafanaClient
      expression: >-
        object.metadata.name == 'grafana-loki-client' && request.namespace == 'grafana' &&
        has(object.spec.secretName) && object.spec.secretName == 'loki-grafana-client' &&
        variables.refCA && variables.leafKeyLifetime &&
        has(object.spec.commonName) && object.spec.commonName == 'grafana-client.logging' &&
        !has(object.spec.dnsNames) &&
        has(object.spec.usages) && size(object.spec.usages) == 1 && object.spec.usages.all(u, u == 'client auth')
  validations:
    - expression: >-
        variables.metadataOnlyUpdate ||
        (variables.isArgo && (variables.isRootCA || variables.isLokiServer || variables.isAlloyClient || variables.isGrafanaClient))
      message: >-
        Logging PKI Certificates: spec create/change requires the Argo CD
        application controller identity and one of the approved profiles
        (logging-root-ca, loki-server, alloy-client, grafana-loki-client);
        metadata-only updates stay permitted for controller renewal and
        finalizer bookkeeping.
---
# CertificateRequests are created by the cert-manager controller on behalf of
# a Certificate; the raw CSR bytes are operator-produced and not parsed here.
# Trust is bounded by: controller identity + controlling ownerReference to an
# approved Certificate + namespace/issuer/usages/isCA profile consistency.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: logging-certificaterequest
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificaterequests"]
  matchConditions:
    - name: logging-pki-scope
      expression: >-
        has(object.spec.issuerRef) && has(object.spec.issuerRef.name) &&
        (object.spec.issuerRef.name == 'logging-ca' || object.spec.issuerRef.name == 'logging-selfsigned') &&
        (!has(object.spec.issuerRef.kind) || object.spec.issuerRef.kind == 'ClusterIssuer') &&
        (!has(object.spec.issuerRef.group) || object.spec.issuerRef.group == 'cert-manager.io')
  variables:
    - name: isCertManager
      expression: >-
        request.userInfo.username == 'system:serviceaccount:cert-manager:cert-manager'
    - name: metadataOnlyUpdate
      expression: >-
        request.operation == 'UPDATE' && object.metadata.generation == oldObject.metadata.generation
    - name: controlledByApprovedCertificate
      expression: >-
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o,
          o.apiVersion == 'cert-manager.io/v1' && o.kind == 'Certificate' &&
          has(o.controller) && o.controller == true &&
          ((object.spec.issuerRef.name == 'logging-selfsigned' &&
            o.name == 'logging-root-ca' && request.namespace == 'cert-manager') ||
           (object.spec.issuerRef.name == 'logging-ca' &&
            ((o.name == 'loki-server' && request.namespace == 'logging') ||
             (o.name == 'alloy-client' && request.namespace == 'logging') ||
             (o.name == 'grafana-loki-client' && request.namespace == 'grafana')))))
    - name: requestProfile
      expression: >-
        (object.spec.issuerRef.name == 'logging-selfsigned' &&
         has(object.spec.isCA) && object.spec.isCA == true &&
         (!has(object.spec.usages) || object.spec.usages.all(u, u in ['signing', 'cert sign', 'crl sign']))) ||
        (object.spec.issuerRef.name == 'logging-ca' &&
         (!has(object.spec.isCA) || object.spec.isCA == false) &&
         has(object.spec.usages) && size(object.spec.usages) == 1 &&
         object.spec.usages.all(u, u in ['server auth', 'client auth']))
  validations:
    - expression: >-
        variables.isCertManager &&
        (variables.metadataOnlyUpdate ||
         (variables.controlledByApprovedCertificate && variables.requestProfile))
      message: >-
        Logging PKI CertificateRequests: only the cert-manager controller may
        create or change them, and only with a controlling ownerReference to
        the matching approved Certificate plus a profile-consistent
        usages/isCA; a forged ownerReference does not help a different
        requester.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: logging-clusterissuer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterissuers"]
  matchConditions:
    - name: logging-pki-scope
      expression: >-
        object.metadata.name == 'logging-selfsigned' || object.metadata.name == 'logging-ca'
  variables:
    - name: isArgo
      expression: >-
        request.userInfo.username == 'system:serviceaccount:argocd:argocd-argocd-application-controller'
    - name: metadataOnlyUpdate
      expression: >-
        request.operation == 'UPDATE' && object.metadata.generation == oldObject.metadata.generation
  validations:
    - expression: >-
        variables.metadataOnlyUpdate ||
        (variables.isArgo &&
         ((object.metadata.name == 'logging-selfsigned' && has(object.spec.selfSigned)) ||
          (object.metadata.name == 'logging-ca' && has(object.spec.ca) &&
           has(object.spec.ca.secretName) && object.spec.ca.secretName == 'logging-root-ca')))
      message: >-
        Logging PKI ClusterIssuers: spec create/change requires the Argo CD
        application controller identity and the fixed scheme
        (selfSigned {} for logging-selfsigned; ca.secretName logging-root-ca
        for logging-ca); metadata-only updates stay permitted.
---
# cert-manager's use of built-in CertificateSigningRequest resources is
# experimental and not enabled in this deployment; these policies keep the
# logging signers closed even if that feature is enabled later. Signer-name
# format per https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: logging-csr
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["certificates.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificatesigningrequests"]
  matchConditions:
    - name: logging-signers
      expression: >-
        object.spec.signerName in ['clusterissuers.cert-manager.io/logging-ca', 'clusterissuers.cert-manager.io/logging-selfsigned']
  validations:
    - expression: "false"
      message: >-
        The built-in CertificateSigningRequest path is disabled for the
        logging PKI signers; logging issuance flows only through cert-manager
        Certificate and CertificateRequest resources.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: logging-certificate-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  policyName: logging-certificate
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: logging-certificaterequest-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  policyName: logging-certificaterequest
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: logging-clusterissuer-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  policyName: logging-clusterissuer
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: logging-csr-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  policyName: logging-csr
  validationActions:
    - Deny
