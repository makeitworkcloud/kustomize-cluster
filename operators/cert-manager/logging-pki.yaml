---
# Dedicated PKI for the logging stack. A self-signed bootstrap ClusterIssuer
# issues a root CA (Secret logging-root-ca in namespace cert-manager), which
# backs the dedicated logging CA ClusterIssuer. cert-manager creates the
# private keys at deploy time only; they are never read, copied or exposed.
#
# The root CA key uses rotationPolicy: Never (10-year lifetime). Root CA
# rotation is a MANUAL, documented procedure (see workloads/logging/README.md):
# there is no automatic CA trust rotation.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logging-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: logging-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  commonName: logging-root-ca
  secretName: logging-root-ca
  duration: 87600h # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: logging-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logging-ca
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: logging-root-ca
