---
# Dedicated PKI for the logging stack. cert-manager creates the private keys
# at deploy time only; they are never read, copied or exposed. Root CA key
# uses rotationPolicy: Never (10-year lifetime): root CA rotation is a MANUAL
# documented procedure — there is no automatic CA trust rotation.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logging-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: logging-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  commonName: logging-root-ca
  secretName: logging-root-ca
  usages:
    - signing
    - cert sign
    - crl sign
  duration: 87600h # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  # cert-manager copies secretTemplate metadata onto the issued Secret so the
  # GitOps controller never prunes/deletes the root CA key material.
  secretTemplate:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  issuerRef:
    name: logging-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logging-ca
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: logging-root-ca
