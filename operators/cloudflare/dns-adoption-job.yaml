---
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflare-dns-adoption
  namespace: cloudflare-operator-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/unset-memory-requirements: "No limits on single-node cluster"
    ignore-check.kube-linter.io/unset-cpu-requirements: "No requests on single-node cluster"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adopt-dns
          image: docker.io/library/python:3.12-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-credentials
                  key: CLOUDFLARE_API_TOKEN
            - name: CF_DOMAIN
              value: makeitwork.cloud
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              python - <<'PY'
              import json
              import os
              import urllib.parse
              import urllib.request

              token = os.environ["CF_API_TOKEN"]
              domain = os.environ["CF_DOMAIN"]

              # Adoption-phase hosts already cleaned once; never replay their deletion.
              completed_hosts = ["argocd", "grafana", "status"]

              targets = [
                  {"fqdn": f"mcp-twilio-docs.{domain}", "type": "CNAME", "content_suffix": ".cfargotunnel.com"},
                  {"fqdn": f"_managed.mcp-twilio-docs.{domain}", "type": "TXT"},
              ]

              def cf_request(method, path, params=None):
                  url = "https://api.cloudflare.com/client/v4" + path
                  if params:
                      url += "?" + urllib.parse.urlencode(params)
                  req = urllib.request.Request(
                      url,
                      method=method,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Content-Type": "application/json",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                  if not body.get("success", False):
                      raise SystemExit(f"cloudflare api request failed: {method} {path}")
                  return body

              zone_resp = cf_request("GET", "/zones", {"name": domain, "per_page": 1})
              zone = zone_resp.get("result", [])
              if not zone:
                  raise SystemExit(f"zone not found: {domain}")
              zone_id = zone[0]["id"]

              for target in targets:
                  fqdn = target["fqdn"]
                  host = fqdn[: -len(domain) - 1]
                  if host in completed_hosts:
                      raise SystemExit(f"refusing replay of completed adoption host: {fqdn}")
                  recs = cf_request(
                      "GET",
                      f"/zones/{zone_id}/dns_records",
                      {"name": fqdn, "type": target["type"], "per_page": 100},
                  ).get("result", [])

                  if not recs:
                      print(f"no {target['type']} records to clean for {fqdn}")
                      continue

                  for rec in recs:
                      rec_id = rec["id"]
                      rec_type = rec.get("type", "")
                      rec_content = rec.get("content", "")
                      if rec_type != target["type"]:
                          raise SystemExit(f"unexpected record type for {fqdn}: {rec_type}")
                      suffix = target.get("content_suffix")
                      if suffix and not rec_content.endswith(suffix):
                          raise SystemExit(f"unexpected content for {fqdn}; refusing deletion")
                      if target["type"] == "CNAME":
                          print(f"deleting {rec_type} {fqdn} -> {rec_content}")
                      else:
                          print(f"deleting {rec_type} {fqdn}")
                      cf_request("DELETE", f"/zones/{zone_id}/dns_records/{rec_id}")

              print("cloudflare dns residual cleanup complete")
              PY
      volumes:
        - name: tmp
          emptyDir: {}
