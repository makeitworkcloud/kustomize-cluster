---
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflare-dns-adoption
  namespace: cloudflare-operator-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/unset-memory-requirements: "No limits on single-node cluster"
    ignore-check.kube-linter.io/unset-cpu-requirements: "No requests on single-node cluster"
spec:
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adopt-dns
          image: docker.io/library/python:3.12-alpine@sha256:c4634f578a412db396771b61b064c6e546c9d6414c7fb5b1b05d5871f1885f7b
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-credentials
                  key: CLOUDFLARE_API_TOKEN
            - name: CF_DOMAIN
              value: makeitwork.cloud
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              python - <<'PY'
              import json
              import os
              import urllib.error
              import urllib.parse
              import urllib.request

              EXPECTED_DOMAIN = "makeitwork.cloud"
              EXPECTED_ZONE_ID = "8a33ab52285fec7213ad952bcb75ea7e"
              EXPECTED_TUNNEL_ID = "d17bee03-8687-46a7-831b-df48aacdea1e"

              token = os.environ["CF_API_TOKEN"]
              domain = os.environ["CF_DOMAIN"]
              if domain != EXPECTED_DOMAIN:
                  raise SystemExit(f"unexpected CF_DOMAIN; refusing: {domain}")

              targets = [
                  {
                      "fqdn": f"mcp-twilio-docs.{EXPECTED_DOMAIN}",
                      "type": "CNAME",
                      "id": "b7f7e2f72473db09198de1befa52b989",
                      "content": f"{EXPECTED_TUNNEL_ID}.cfargotunnel.com",
                  },
                  {
                      "fqdn": f"_managed.mcp-twilio-docs.{EXPECTED_DOMAIN}",
                      "type": "TXT",
                      "id": "df3ce42a34d839712a73c4c42935a64f",
                      "dns_id": "b7f7e2f72473db09198de1befa52b989",
                      "tunnel_id": EXPECTED_TUNNEL_ID,
                  },
              ]

              def cf_request(method, path, params=None):
                  url = "https://api.cloudflare.com/client/v4" + path
                  if params:
                      url += "?" + urllib.parse.urlencode(params)
                  req = urllib.request.Request(
                      url,
                      method=method,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Content-Type": "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          body = json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as err:
                      raise SystemExit(f"cloudflare api error: {err.code} {method} {path}")
                  except urllib.error.URLError:
                      raise SystemExit(f"cloudflare api unreachable: {method} {path}")
                  if not body.get("success", False):
                      raise SystemExit(f"cloudflare api request failed: {method} {path}")
                  return body

              zone = cf_request("GET", "/zones", {"name": EXPECTED_DOMAIN, "per_page": 1}).get("result", [])
              if not zone:
                  raise SystemExit(f"zone not found: {EXPECTED_DOMAIN}")
              if zone[0].get("id", "") != EXPECTED_ZONE_ID:
                  raise SystemExit("unexpected zone id; refusing deletion")

              for target in targets:
                  fqdn = target["fqdn"]
                  recs = cf_request(
                      "GET",
                      f"/zones/{EXPECTED_ZONE_ID}/dns_records",
                      {"name": fqdn, "type": target["type"], "per_page": 100},
                  ).get("result", [])

                  if not recs:
                      print(f"no {target['type']} records to clean for {fqdn}")
                      continue

                  for rec in recs:
                      rec_id = rec.get("id", "")
                      if rec_id != target["id"]:
                          raise SystemExit(f"unexpected record id for {fqdn}; refusing deletion")
                      if rec.get("name", "") != fqdn:
                          raise SystemExit(f"unexpected record name for {fqdn}; refusing deletion")
                      if rec.get("type", "") != target["type"]:
                          raise SystemExit(f"unexpected record type for {fqdn}; refusing deletion")
                      if "content" in target and rec.get("content", "") != target["content"]:
                          raise SystemExit(f"unexpected content for {fqdn}; refusing deletion")
                      if "dns_id" in target:
                          try:
                              ownership = json.loads(rec.get("content", ""))
                          except ValueError:
                              raise SystemExit(f"unparsable ownership content for {fqdn}; refusing deletion")
                          if ownership.get("DnsId") != target["dns_id"]:
                              raise SystemExit(f"ownership DnsId mismatch for {fqdn}; refusing deletion")
                          if ownership.get("TunnelId") != target["tunnel_id"]:
                              raise SystemExit(f"ownership TunnelId mismatch for {fqdn}; refusing deletion")
                      print(f"deleting {target['type']} {fqdn}")
                      cf_request("DELETE", f"/zones/{EXPECTED_ZONE_ID}/dns_records/{rec_id}")

              print("cloudflare dns residual cleanup complete")
              PY
      volumes:
        - name: tmp
          emptyDir: {}
