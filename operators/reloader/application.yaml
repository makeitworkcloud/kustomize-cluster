# Reloader is scoped to the Grafana namespace and restarts only workloads that
# explicitly opt into a named Secret reload annotation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  source:
    chart: reloader
    repoURL: https://stakater.github.io/stakater-charts
    targetRevision: 2.2.16
    helm:
      releaseName: reloader
      valuesObject:
        reloader:
          autoReloadAll: false
          watchGlobally: false
          namespaces:
            - grafana
          # Grafana service-account token rotation replaces its Secret.
          reloadOnCreate: true
          reloadOnDelete: true
          syncAfterRestart: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
