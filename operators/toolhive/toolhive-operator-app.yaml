---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toolhive-operator
  namespace: argocd
  annotations:
    # Operator crashes on startup if its CRDs are missing.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: toolhive-system
  source:
    chart: toolhive-operator
    repoURL: ghcr.io/stacklok/toolhive
    targetRevision: 0.46.0
    helm:
      releaseName: toolhive-operator
      values: |
        operator:
          # Chart defaults carry requests/limits; empty keeps single-node policy.
          resources: {}
          env:
            - name: TOOLHIVE_SKIP_UPDATE_CHECK
              value: "true"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
