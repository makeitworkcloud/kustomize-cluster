apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: awx
  namespace: awx
spec:
  admin_password_secret: makeitwork-admin-password
  ingress_type: Route
  route_host: ansible.makeitwork.cloud
  extra_settings_files:
    secrets:
      - name: awx-github-oauth
        key: github_settings.py
  extra_volumes: |
    - name: awx-logo-login
      configMap:
        name: awx-logo
        items:
          - key: logo-login.svg
            path: logo-login.svg
    - name: awx-logo-header
      configMap:
        name: awx-logo
        items:
          - key: logo-header.svg
            path: logo-header.svg
    - name: awx-brand-logo
      configMap:
        name: awx-logo
        items:
          - key: brand-logo.svg
            path: brand-logo.svg
  web_extra_volume_mounts: |
    - name: awx-logo-login
      mountPath: /var/lib/awx/public/static/media/logo-login.svg
      subPath: logo-login.svg
    - name: awx-logo-header
      mountPath: /var/lib/awx/public/static/media/logo-header.svg
      subPath: logo-header.svg
    - name: awx-brand-logo
      mountPath: /var/lib/awx/public/static/media/brand-logo.svg
      subPath: brand-logo.svg
  postgres_data_volume_init: true
  postgres_security_context_settings:
    runAsUser: 26
    fsGroup: 26
  security_context_settings:
    runAsUser: 26
    fsGroup: 26
  postgres_init_container_commands: |-
    mkdir -p /var/lib/pgsql/data/data/userdata
    chown -R 26:26 /var/lib/pgsql/data/data
    chmod 0770 /var/lib/pgsql/data/data
    chmod 0700 /var/lib/pgsql/data/data/userdata
  web_resource_requirements: {}
  task_resource_requirements: {}
  ee_resource_requirements: {}
  redis_resource_requirements: {}
  rsyslog_resource_requirements: {}
  postgres_resource_requirements: {}
  init_container_resource_requirements: {}
  postgres_init_container_resource_requirements: {}
