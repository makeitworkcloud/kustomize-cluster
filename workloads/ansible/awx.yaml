apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "1"
        kustomize.config.k8s.io/behavior: merge
    name: awx
    namespace: awx
spec:
    admin_password_secret: makeitwork-admin-password
    ingress_type: Route
    route_host: ansible.makeitwork.cloud
    extra_settings_files:
        secrets:
            - name: awx-github-oauth
              key: github_settings.py
    extra_volumes: |
        - name: awx-logo-login
          configMap:
            name: awx-logo
            items:
              - key: logo-login.svg
                path: logo-login.svg
        - name: awx-logo-header
          configMap:
            name: awx-logo
            items:
              - key: logo-header.svg
                path: logo-header.svg
        - name: awx-brand-logo
          configMap:
            name: awx-logo
            items:
              - key: brand-logo.svg
                path: brand-logo.svg
    web_extra_volume_mounts: |
        - name: awx-logo-login
          mountPath: /var/lib/awx/public/static/media/logo-login.svg
          subPath: logo-login.svg
        - name: awx-logo-header
          mountPath: /var/lib/awx/public/static/media/logo-header.svg
          subPath: logo-header.svg
        - name: awx-brand-logo
          mountPath: /var/lib/awx/public/static/media/brand-logo.svg
          subPath: brand-logo.svg
