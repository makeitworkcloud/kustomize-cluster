---
apiVersion: tor.k8s.torproject.org/v1alpha2
kind: OnionService
metadata:
  name: awx
  namespace: awx
spec:
  version: 3
  privateKeySecret:
    name: tor-proxy-key
    key: AWX_TOR_SERVICE_KEY
  rules:
    - port:
        number: 80
      backend:
        service:
          name: awx-service
          port:
            number: 80
