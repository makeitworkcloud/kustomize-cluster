---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-15-awx-postgres-15-0
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: awx-postgres-permissions
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    ignore-check.kube-linter.io/run-as-non-root: "Needs root to chown postgres data directory"
    ignore-check.kube-linter.io/unset-memory-requirements: "No limits on single-node cluster"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fix-perms
          image: docker.io/library/busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /var/lib/pgsql/data/data/userdata
              chown -R 26:0 /var/lib/pgsql/data/data
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-15-awx-postgres-15-0
        - name: tmp
          emptyDir: {}
