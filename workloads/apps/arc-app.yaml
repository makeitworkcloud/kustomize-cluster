---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
    path: workloads/arc
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
  # Ignore fields that OpenShift mutates on ImageStreams after import
  ignoreDifferences:
    - group: image.openshift.io
      kind: ImageStream
      jqPathExpressions:
        - .spec.lookupPolicy
        - .spec.tags[].generation
        - .spec.tags[].importPolicy.importMode
        - .spec.tags[].referencePolicy
        - .spec.tags[].annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
