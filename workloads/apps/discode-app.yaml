---
# ACTIVATION GATE — deliberately NOT registered.
#
# This child Application is complete but intentionally absent from
# workloads/apps/kustomization.yaml. Register it (add `discode-app.yaml`
# under resources) only together with the workload activation steps in
# workloads/discode/README.md: real Discord identifiers in
# discode-config.toml, the SOPS-encrypted discode-bot-auth Secret, and owner
# deploy authorization. SkipDryRunOnMissingResource is omitted because this
# Application manages no custom resources. CreateNamespace is a no-op: the
# opencode namespace is owned by workloads/opencode.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discode
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
    path: workloads/discode
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: opencode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
