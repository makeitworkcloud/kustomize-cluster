---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gotenberg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
    path: workloads/gotenberg
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: gotenberg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
