---
# Workload Applications - each workload is deployed as a separate ArgoCD Application
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Wave 0: No CRD dependencies
  - argocd-proxy-app.yaml
  - makeitwork-proxy-app.yaml
  - warp-app.yaml
  - ../uptime-kuma  # Direct include - contains its own Helm Application
  # Wave 1: Depend on operator CRDs (TunnelBinding requires cloudflare-operator)
  - ansible-app.yaml
  - arc-app.yaml
  - grafana-app.yaml
  - ollama-app.yaml
  - ../openshift-gitops  # Direct include - TunnelBinding for ArgoCD
