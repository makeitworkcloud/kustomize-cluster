---
# Loki log aggregation (Monolithic) for opt-in cluster logging.
# Helm source renders the pinned upstream chart; the git source applies the
# companion manifests under workloads/logging/loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 18.13.7
      helm:
        releaseName: loki
        skipCrds: true
        values: |
          deploymentMode: Monolithic
          fullnameOverride: loki

          write:
            replicas: 0
          read:
            replicas: 0
          backend:
            replicas: 0

          # No gateway/reverse proxy: clients reach Loki directly on the
          # mTLS-protected port 3100.
          gateway:
            enabled: false
          ingress:
            enabled: false

          minio:
            enabled: false
          rollout_operator:
            enabled: false
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
          lokiCanary:
            enabled: false
          test:
            enabled: false

          # Chart ServiceMonitor is tied to the mTLS port 3100; metrics are
          # scraped from the internal server via companion manifests instead.
          monitoring:
            dashboards:
              enabled: false
            rules:
              enabled: false
            alerts:
              enabled: false
            serviceMonitor:
              enabled: false
            selfMonitoring:
              enabled: false
              grafanaAgent:
                installOperator: false

          loki:
            storage:
              type: filesystem
            server:
              http_listen_port: 3100
              grpc_listen_port: 9095
            # structuredConfig fully replaces the chart-templated config (it
            # is NOT merged), so this is the complete native Loki config.
            structuredConfig:
              # Authentication is the mTLS client certificate below; Loki
              # multi-tenancy stays off behind the TLS boundary.
              auth_enabled: false
              server:
                http_listen_address: 0.0.0.0
                http_listen_port: 3100
                grpc_listen_address: 127.0.0.1
                grpc_listen_port: 9095
                log_level: info
                http_tls_config:
                  cert_file: /etc/loki/server-tls/tls.crt
                  key_file: /etc/loki/server-tls/tls.key
                  client_ca_file: /etc/loki/server-tls/ca.crt
                  client_auth_type: RequireAndVerifyClientCert
              # Native operational-only listener: ready/metrics/buildinfo/
              # rings, no log query/push API (Loki docs, internal_server).
              internal_server:
                enable: true
                http_listen_address: 0.0.0.0
                http_listen_port: 3101
              common:
                instance_addr: 127.0.0.1
                path_prefix: /var/loki
                replication_factor: 1
                storage:
                  filesystem:
                    chunks_directory: /var/loki/chunks
                ring:
                  kvstore:
                    store: inmemory
              memberlist:
                join_members: []
              analytics:
                reporting_enabled: false
              storage_config:
                tsdb_shipper:
                  active_index_directory: /var/loki/tsdb-index
                  cache_location: /var/loki/tsdb-cache
                filesystem:
                  directory: /var/loki/chunks
              schema_config:
                configs:
                  - from: "2025-01-01"
                    store: tsdb
                    object_store: filesystem
                    schema: v13
                    index:
                      prefix: loki_index_
                      period: 24h
              compactor:
                working_directory: /var/loki/compactor
                compaction_interval: 10m
                retention_enabled: true
                retention_delete_delay: 2h
                retention_delete_worker_count: 150
                delete_request_store: filesystem
              ingester:
                wal:
                  enabled: true
                  dir: /var/loki/wal
              frontend_worker:
                frontend_address: 127.0.0.1:9095
              querier:
                max_concurrent: 4
              limits_config:
                # 30-day retention target is nominal: the 100Gi PVC is not a
                # quota and node-local storage is the real ceiling.
                retention_period: 720h
                max_query_lookback: 720h
                split_queries_by_interval: 24h
                ingestion_rate_mb: 0.02
                ingestion_burst_size_mb: 1
                per_stream_rate_limit: 20KiB
                per_stream_rate_limit_burst: 1MiB
                max_streams_per_user: 1000
                max_line_size: 4KiB
                max_entries_limit_per_query: 5000
                max_query_series: 500
                reject_old_samples: true
                reject_old_samples_max_age: 168h

          singleBinary:
            replicas: 1
            # Reloader reads controller (StatefulSet) annotations, not pod
            # annotations: roll on mounted leaf TLS secret renewal.
            annotations:
              reloader.stakater.com/auto: "true"
            persistence:
              enabled: true
              size: 100Gi
              storageClass: local-path
              enableStatefulSetAutoDeletePVC: true
              whenDeleted: Retain
              whenScaled: Retain
              annotations:
                argocd.argoproj.io/sync-options: Prune=false,Delete=false
            extraVolumes:
              - name: server-tls
                secret:
                  secretName: loki-server-tls
                  defaultMode: 0440
            extraVolumeMounts:
              - name: server-tls
                mountPath: /etc/loki/server-tls
                readOnly: true
            startupProbe:
              httpGet:
                path: /ready
                port: 3101
                scheme: HTTP
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
            readinessProbe:
              httpGet:
                path: /ready
                port: 3101
                scheme: HTTP
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /ready
                port: 3101
                scheme: HTTP
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
    - repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
      targetRevision: main
      path: workloads/logging/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  # Reloader (controller reloadStrategy=annotations) stamps the system-managed
  # reloader.stakater.com/last-reloaded-from annotation onto the pod template
  # when a mounted TLS secret renews; ArgoCD must not treat that legitimate
  # controller-generated annotation as drift. Nothing else is ignored.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      namespace: logging
      jqPathExpressions:
        - '.spec.template.metadata.annotations["reloader.stakater.com/last-reloaded-from"]'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
