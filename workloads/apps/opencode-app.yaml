---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - chart: opencode-server
      repoURL: ghcr.io/makeitworkcloud/charts
      targetRevision: 0.1.21
    - repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
      path: workloads/opencode
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: opencode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
