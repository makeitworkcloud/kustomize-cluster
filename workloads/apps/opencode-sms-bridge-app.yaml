apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode-sms-bridge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - chart: opencode-sms-bridge
      repoURL: ghcr.io/makeitworkcloud/charts
      targetRevision: 0.1.2
      helm:
        values: |
          image:
            tag: "caa3224f9c1a8f64c8f93c9fb1662bebf64189bc"
          config:
            canonicalWebhookUrl: https://sms.makeitwork.cloud/twilio/inbound
    - repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
      path: workloads/opencode-sms-bridge
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: opencode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
