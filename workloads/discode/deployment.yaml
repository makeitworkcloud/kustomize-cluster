---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discode
  namespace: opencode
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/unset-cpu-requirements: "single-node policy"
    ignore-check.kube-linter.io/unset-memory-requirements: "single-node policy"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discode
  template:
    metadata:
      labels:
        app: discode
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: app
          emptyDir:
            sizeLimit: 1Gi
        - name: build-tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: state
          persistentVolumeClaim:
            claimName: discode-state
        - name: config
          configMap:
            name: discode-config
      initContainers:
        - name: build-discode
          image: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              umask 022
              # emptyDir contents survive init retries in the same pod.
              rm -rf /app/dist /app/node_modules /app/package.json \
                /tmp/src /tmp/src.tar.gz /tmp/fetch.mjs /tmp/npm-cache

              # Fail-closed fetch: HTTP 200 only, redirects rejected, 60s
              # deadline, streaming with a 64 MiB ceiling.
              cat >/tmp/fetch.mjs <<'EOF'
              import fs from "node:fs";
              const archiveUrl =
                "https://codeload.github.com/upiscium/DisCode/tar.gz/6b936f6c7c6cfbb5995a44cbff9361b9d72e4bc2";
              const maxBytes = 64 * 1024 * 1024;
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 60_000);
              try {
                const res = await fetch(archiveUrl, {
                  redirect: "error",
                  signal: controller.signal,
                  headers: { "user-agent": "makeitworkcloud-gitops-discode-init" },
                });
                if (res.status !== 200) {
                  throw new Error(`unexpected HTTP status ${res.status}`);
                }
                const reader = res.body.getReader();
                const chunks = [];
                let total = 0;
                for (;;) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  total += value.byteLength;
                  if (total > maxBytes) {
                    controller.abort();
                    throw new Error(`archive exceeds ${maxBytes} bytes`);
                  }
                  chunks.push(value);
                }
                if (total === 0) throw new Error("archive is empty");
                fs.writeFileSync("/tmp/src.tar.gz", Buffer.concat(chunks.map(Buffer.from)));
              } finally {
                clearTimeout(timer);
              }
              EOF
              node /tmp/fetch.mjs

              # Archive sha256 computed from a read-only public fetch of the
              # pinned commit on 2026-09-19; GitHub publishes no checksums.
              # If GitHub's generated bytes change, this fails closed and
              # the digest must be recomputed.
              echo "4da1ecb7d1b5f4313189c2cfd130dc9ac515d7988e98c1f040eaf0de8c39adeb  /tmp/src.tar.gz" \
                | sha256sum -c -

              mkdir -p /tmp/src
              tar -xzf /tmp/src.tar.gz -C /tmp/src --strip-components=1
              cd /tmp/src
              test -f package.json
              test -f package-lock.json
              npm ci --ignore-scripts --no-audit --no-fund
              npm run build
              test -f dist/index.js
              npm prune --omit=dev --ignore-scripts

              cp -a dist package.json /app/
              cp -a node_modules /app/node_modules
              rm -rf /tmp/src /tmp/src.tar.gz /tmp/fetch.mjs /tmp/npm-cache
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/npm-cache
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
            - name: build-tmp
              mountPath: /tmp
      containers:
        - name: discode
          image: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          workingDir: /app
          command:
            - node
            - dist/index.js
          env:
            - name: HOME
              value: /tmp
            - name: OCB_CONFIG_FILE
              value: /config/config.toml
            - name: STATE_FILE
              value: /state/state.json
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discode-bot-auth
                  key: DISCORD_TOKEN
            - name: OPENCODE_HOST_CLUSTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-server-auth
                  key: password
          ports:
            - name: metrics
              containerPort: 9464
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            - name: build-tmp
              mountPath: /tmp
