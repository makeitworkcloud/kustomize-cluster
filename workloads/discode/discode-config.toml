# Owner-supplied Discord IDs (identifiers, not credentials) and activation
# gates: see README.md in this directory.
# allowed_user_ids is an array of user-ID strings (upstream schema).

[discord]
client_id = "1553536583355994272"
guild_id = "1540492160103620668"
parent_channel_id = "1540492160988610643"
allowed_user_ids = ["1418250936547148011"]
allow_permission_always = false
stream_assistant_text = false
show_tool_summaries = false

[routing]
default_host = "cluster"

[host.cluster]
base_url = "https://opencode.makeitwork.cloud"
username = "opencode"
password_env = "OPENCODE_HOST_CLUSTER_PASSWORD"
home_directory = "/home/opencode"
allowed_roots = ["/home/opencode"]

[logging]
level = "info"
format = "json"

[metrics]
enabled = true
address = "0.0.0.0"
port = 9464
