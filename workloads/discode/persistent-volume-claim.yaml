---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discode-state
  namespace: opencode
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # DisCode persists one small JSON bindings file (STATE_FILE);
      # credentials are never written to state (upstream README security
      # boundary). 128Mi is generous headroom.
      storage: 128Mi
