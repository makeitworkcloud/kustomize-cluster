---
# Gotenberg: document-conversion API (markdown/HTML -> PDF via headless
# Chromium). Deployed for OpenCode agents as the md->PDF engine documented in
# agent-knowledge docs/agents/career/pipeline.md ("PDF generation and storage
# pathways") and the packaged md-to-pdf skill. Cluster-internal only: the
# chromium image variant exposes only Chromium routes (no LibreOffice, no
# ExifTool); SSRF hardenings >= 8.32 are included in the pinned digest.
#
# Deployment and Service share one multi-document file so per-file kube-linter
# can resolve the Service selector against this workload's pod labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: gotenberg
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.36.0-chromium@sha256:a40f92d7419adbf98fd2ab2e4211f6186c9fd44f196a5aadbd2769bf237faae6
          args:
            - gotenberg
            - --api-port=3000
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: gotenberg
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: http
