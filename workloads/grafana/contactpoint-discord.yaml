---
# Discord contact point for Dependabot PR alerts. The webhook URL lives in
# the SOPS-encrypted discord-webhook Secret (its `token` key matches the
# .sops.yaml encrypted_regex); the operator resolves it via valuesFrom.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: discord
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  name: discord
  receivers:
    - type: discord
      settings:
        title: Dependabot PR
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: discord-webhook
              key: token
