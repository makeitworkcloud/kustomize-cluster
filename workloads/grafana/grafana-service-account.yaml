# The Grafana Operator owns the token Secret; Git never stores its value.
# Rotate deliberately by changing the token name while retaining secretName.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: mcp-grafana
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceName: grafana
  name: mcp-grafana
  # mcp-grafana exposes write-capable tools; Editor is the narrowest built-in
  # Grafana role that supports the existing tool surface.
  role: Editor
  tokens:
    - name: mcp-grafana-v1
      secretName: mcp-grafana-service-account-token
