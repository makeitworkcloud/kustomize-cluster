---
# Loki datasource for the main Grafana instance. mTLS client authentication
# against the dedicated logging CA; the client certificate comes from the
# loki-grafana-client Secret (see loki-client-certificate.yaml). Selected
# onto the main Grafana only, via the matching `dashboards: grafana` label.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: grafana-loki
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  uid: loki
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Loki
    type: loki
    access: proxy
    isDefault: false
    url: https://loki.logging.svc:3100
    jsonData:
      tlsAuth: true
      tlsAuthWithCACert: true
      tlsSkipVerify: false
      serverName: loki.logging.svc
      maxLines: 1000
  valuesFrom:
    - targetPath: secureJsonData.tlsClientCert
      valueFrom:
        secretKeyRef:
          name: loki-grafana-client
          key: tls.crt
    - targetPath: secureJsonData.tlsClientKey
      valueFrom:
        secretKeyRef:
          name: loki-grafana-client
          key: tls.key
    - targetPath: secureJsonData.tlsCACert
      valueFrom:
        secretKeyRef:
          name: loki-grafana-client
          key: ca.crt
