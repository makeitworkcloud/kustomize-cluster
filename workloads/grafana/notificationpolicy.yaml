---
# Root notification policy: deliver all alerts to the Discord contact point.
# This CR owns the entire Grafana notification policy tree — when new alert
# sources are added, extend `route.routes` here instead of editing the tree
# in the UI.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: root-discord
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  route:
    receiver: discord
    group_by:
      - alertname
      - repository
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
