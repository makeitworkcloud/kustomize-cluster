---
apiVersion: tor.k8s.torproject.org/v1alpha2
kind: OnionService
metadata:
  name: grafana
  namespace: grafana
spec:
  version: 3
  privateKeySecret:
    name: tor-proxy-key
    key: GRAFANA_TOR_SERVICE_KEY
  rules:
    - port:
        number: 80
      backend:
        service:
          name: grafana-service
          port:
            number: 3000
