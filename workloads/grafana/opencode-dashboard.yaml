---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: opencode-sessions
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "uid": "opencode-sessions",
      "title": "OpenCode Sessions",
      "schemaVersion": 39,
      "version": 5,
      "editable": false,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Session-status poll health",
          "description": "1 means the latest session-status poll succeeded; 0 means it failed. No session identifiers or content are exposed.",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max(opencode_session_status_up)", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Active sessions",
          "description": "Current sessions reported as busy or retrying. This is observability only; it does not block rollouts.",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(opencode_active_sessions)", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Session-status poll age",
          "description": "Seconds since the most recent successful session-status poll. Increasing age indicates stale health data.",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "time() - max(opencode_session_status_last_success_timestamp_seconds)", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 60}, {"color": "red", "value": 300}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Active sessions by state",
          "description": "Aggregated counts by exporter-defined state: busy or retrying.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 8},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "opencode_active_sessions", "legendFormat": "{{state}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "decimals": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Observed token delta rate by kind",
          "description": "Aggregate token deltas after the exporter baseline. Observed deltas only, not provider billing data; token history cached before a session was first observed is excluded. No data until a complete, fresh scan covers the entire window. No session, prompt, directory, or identity labels are exported.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 18},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (kind) (rate(opencode_llm_tokens_total[5m])) and on() (min(opencode_session_usage_scan_up) == 1) and on() (min(opencode_session_usage_scan_last_success_timestamp_seconds) > 0) and on() ((time() - max(opencode_session_usage_scan_last_success_timestamp_seconds)) >= 0) and on() ((time() - min(opencode_session_usage_scan_last_success_timestamp_seconds)) < 120) and on() (min(opencode_session_usage_baseline_timestamp_seconds) > 0) and on() ((time() - max(opencode_session_usage_baseline_timestamp_seconds)) >= 300) and on() (min(min_over_time(opencode_session_usage_scan_up[5m])) == 1)", "legendFormat": "{{kind}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "tokens/s", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Session-usage scan health",
          "description": "1 means the latest complete project/session usage scan succeeded. A failed or truncated scan makes token counters incomplete.",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 28},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "min(opencode_session_usage_scan_up)", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Usage scan age",
          "description": "Seconds since the most recent complete session-usage scan, current value only. Increasing age indicates stale token data. No data before the first complete scan.",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 28},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "time() - max(opencode_session_usage_scan_last_success_timestamp_seconds) and on() (max(opencode_session_usage_scan_last_success_timestamp_seconds) > 0)", "instant": true, "range": false, "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 60}, {"color": "red", "value": 300}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Sessions in last complete scan",
          "description": "Number of sessions included in the latest complete usage scan. This is a coverage count, not session data.",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 28},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max(opencode_session_usage_sessions)", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "decimals": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Observed token deltas, 1h",
          "description": "Token growth observed during the last hour after the exporter baseline, computed point-in-time. Observed deltas only, not provider billing data; token history before the exporter observed a session is excluded. No data until a complete, fresh scan covers the entire hour window.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 36},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(increase(opencode_llm_tokens_total[1h])) and on() (min(opencode_session_usage_scan_up) == 1) and on() (min(opencode_session_usage_scan_last_success_timestamp_seconds) > 0) and on() ((time() - max(opencode_session_usage_scan_last_success_timestamp_seconds)) >= 0) and on() ((time() - min(opencode_session_usage_scan_last_success_timestamp_seconds)) < 120) and on() (min(opencode_session_usage_baseline_timestamp_seconds) > 0) and on() ((time() - max(opencode_session_usage_baseline_timestamp_seconds)) >= 3600) and on() (min(min_over_time(opencode_session_usage_scan_up[1h])) == 1)", "instant": true, "range": false, "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "tokens", "min": 0, "decimals": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Observed cache-read ratio, 1h",
          "description": "Observed cache-read tokens divided by non-cached input plus cache-read tokens during the last hour, computed point-in-time. Observed deltas only, not provider billing data; this is an efficiency signal, not proof of waste. No data until a complete, fresh scan covers the entire hour window.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 36},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(sum(increase(opencode_llm_tokens_total{kind=\"cache_read\"}[1h])) / clamp_min(sum(increase(opencode_llm_tokens_total{kind=~\"input|cache_read\"}[1h])), 1)) and on() (min(opencode_session_usage_scan_up) == 1) and on() (min(opencode_session_usage_scan_last_success_timestamp_seconds) > 0) and on() ((time() - max(opencode_session_usage_scan_last_success_timestamp_seconds)) >= 0) and on() ((time() - min(opencode_session_usage_scan_last_success_timestamp_seconds)) < 120) and on() (min(opencode_session_usage_baseline_timestamp_seconds) > 0) and on() ((time() - max(opencode_session_usage_baseline_timestamp_seconds)) >= 3600) and on() (min(min_over_time(opencode_session_usage_scan_up[1h])) == 1)", "instant": true, "range": false, "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "decimals": 2}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "OpenCode pod CPU usage",
          "description": "CPU cores per OpenCode server pod (cgroup usage rate). A replaced pod starts a new series; current and historical pod series remain queryable within Prometheus retention. Missing data means the workload or its scrape target is absent, not zero usage.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 44},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"opencode\", container=\"opencode\", pod=~\"opencode-[a-f0-9]+-.*\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "cores", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "OpenCode pod memory (working set and RSS)",
          "description": "Working set and RSS bytes per OpenCode server pod. These are distinct memory indicators; neither alone proves OOM risk or a leak. Series reset on pod replacement while prior series remain queryable within Prometheus retention. Missing data means the workload or its scrape target is absent, not zero usage.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 44},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"opencode\", container=\"opencode\", pod=~\"opencode-[a-f0-9]+-.*\"})", "legendFormat": "{{pod}} working set", "refId": "A"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (pod) (container_memory_rss{namespace=\"opencode\", container=\"opencode\", pod=~\"opencode-[a-f0-9]+-.*\"})", "legendFormat": "{{pod}} RSS", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "OpenCode pod container restarts",
          "description": "Cumulative container restart counter per OpenCode pod instance. A new pod starts a new counter; the prior pod's counter history remains queryable within Prometheus retention. Missing data means the workload or kube-state-metrics scrape is absent.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 52},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (pod) (kube_pod_container_status_restarts_total{namespace=\"opencode\", container=\"opencode\", pod=~\"opencode-[a-f0-9]+-.*\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "decimals": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Node CPU non-idle (includes steal and IO wait)",
          "description": "Non-idle CPU ratio per cluster node, including steal and IO wait time. Shows all cluster nodes, not only the node running OpenCode. Missing data means node-exporter metrics are absent.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 52},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Node CPU steal",
          "description": "CPU steal ratio per cluster node: time the hypervisor withheld CPU. Sustained steal suggests possible host contention; it is not proof of oversubscription. Shows all cluster nodes. Missing data means node-exporter metrics are absent.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 60},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (instance) (rate(node_cpu_seconds_total{mode=\"steal\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Node memory used ratio",
          "description": "Used memory ratio per cluster node derived from MemAvailable and MemTotal. Shows all cluster nodes, not only the node running OpenCode. Missing data means node-exporter metrics are absent.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 60},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (instance) (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Node pressure stall (PSI)",
          "description": "Pressure Stall Information rates per cluster node: CPU waiting (some), memory full stalled, and IO full stalled, as ratios of wall time. Sustained nonzero values indicate resource contention. Missing data means node-level PSI metrics are absent (requires kernel PSI support).",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 68},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (instance) (rate(node_pressure_cpu_waiting_seconds_total[5m]))", "legendFormat": "{{instance}} cpu waiting", "refId": "A"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (instance) (rate(node_pressure_memory_stalled_seconds_total[5m]))", "legendFormat": "{{instance}} memory full stalled", "refId": "B"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (instance) (rate(node_pressure_io_stalled_seconds_total[5m]))", "legendFormat": "{{instance}} io full stalled", "refId": "C"}
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Node disk IO busy",
          "description": "Fraction of time each block device had outstanding IO per cluster node (loop and ram devices excluded). This is an activity indicator; values near 1 are not proof of a bottleneck on parallel-IO devices such as NVMe. Correlate with PSI and IO latency. Missing data means node-exporter metrics are absent.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 68},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (instance, device) (rate(node_disk_io_time_seconds_total{device!~\"loop.*|ram.*\"}[5m]))", "legendFormat": "{{instance}} {{device}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Root/data filesystem space available",
          "description": "Available bytes on the root and data filesystems (/ and /var/lib/rancher) per cluster node. Downward trends risk image-gc and datastore pressure. Missing data means node-exporter filesystem metrics are absent.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 76},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (instance, mountpoint) (node_filesystem_avail_bytes{mountpoint=~\"/|/var/lib/rancher\"})", "legendFormat": "{{instance}} {{mountpoint}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "OpenCode auth-boundary probe success",
          "description": "1 means the synthetic probe received the expected 401 from the OpenCode auth boundary; 0 means it received 200, 403, 5xx, or a redirect, or timed out. This measures authentication-boundary reachability only, not server or provider health. A missing series means the probe is not deployed or the target is not scraped; missing is not zero.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 76},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "probe_success{job=~\"opencode-(internal|external)-auth-boundary\"}", "legendFormat": "{{probe_path}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "none", "min": 0, "max": 1, "decimals": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "OpenCode auth-boundary probe duration",
          "description": "Total duration of the synthetic unauthenticated probe to the 401 auth boundary. This is boundary response timing only; it is not user request, session, or LLM latency. A missing series means the probe is not deployed or the target is not scraped.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 84},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "probe_duration_seconds{job=~\"opencode-(internal|external)-auth-boundary\"}", "legendFormat": "{{probe_path}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "OpenCode auth-boundary probe HTTP status",
          "description": "HTTP status code returned by the synthetic auth-boundary probe. The expected value is 401; 200, 403, 5xx, or redirect codes fail the probe. This validates the authentication boundary, not application health. A missing series means the probe is not deployed or the target is not scraped.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 84},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "probe_http_status_code{job=~\"opencode-(internal|external)-auth-boundary\"}", "legendFormat": "{{probe_path}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "none", "min": 0, "decimals": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        }
      ]
    }
