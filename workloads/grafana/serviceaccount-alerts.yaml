---
# Service account used by GitHub Actions (dependabot-notify reusable workflow)
# to POST synthetic alerts to Grafana's embedded Alertmanager API. The
# operator creates the account in Grafana and stores the generated token in
# the grafana-alerts-token Secret (key: token).
#
# The token still has to reach GitHub Actions out of band (GitHub is outside
# the cluster trust boundary): copy the value into tfroot-github's SOPS
# secrets.yaml as grafana_alerts_token:
#
#   kubectl --context k3s -n grafana get secret grafana-alerts-token \
#     -o jsonpath='{.data.token}' | base64 -d
#
# If posting alerts returns 403, recreate this CR with role: Admin.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: github-actions-alerts
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: github-actions-alerts
  instanceName: grafana
  role: Editor
  isDisabled: false
  tokens:
    - name: alerts
      secretName: grafana-alerts-token
