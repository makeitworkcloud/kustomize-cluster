---
# Alloy mTLS client certificate for pushing to Loki, issued by the dedicated
# logging CA (operators/cert-manager/logging-pki.yaml). 90-day leaf with
# private key rotation on every renewal; Reloader rolls the Deployment.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alloy-client
  namespace: logging
spec:
  secretName: loki-alloy-client
  commonName: alloy.logging
  usages:
    - client auth
  duration: 2160h # 90 days
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: logging-ca
    kind: ClusterIssuer
    group: cert-manager.io
