---
# Nginx reverse proxy to makeitwork.cloud (external site)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: makeitwork-proxy
data:
  default.conf: |
    server {
        listen 8080;
        location / {
            proxy_pass https://makeitwork.cloud;
            proxy_set_header Host makeitwork.cloud;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: makeitwork-proxy
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "nginx needs /var/cache/nginx writable"
    ignore-check.kube-linter.io/run-as-non-root: "nginx requires root for port binding"
    ignore-check.kube-linter.io/unset-memory-requirements: "No limits on single-node cluster"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: makeitwork-proxy
spec:
  selector:
    app: nginx-proxy
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: tor.k8s.torproject.org/v1alpha2
kind: OnionService
metadata:
  name: makeitwork
  namespace: makeitwork-proxy
spec:
  version: 3
  privateKeySecret:
    name: tor-proxy-key
    key: WWW_TOR_SERVICE_KEY
  rules:
    - port:
        number: 80
      backend:
        service:
          name: nginx-proxy
          port:
            number: 8080
