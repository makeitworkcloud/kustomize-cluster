---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tor-proxy
  namespace: makeitwork-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tor-proxy-privileged
  namespace: makeitwork-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: tor-proxy
    namespace: makeitwork-proxy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tor-hidden-service-keys
  namespace: makeitwork-proxy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: makeitwork-proxy
data:
  default.conf: |
    server {
        listen 8080;
        location / {
            proxy_pass https://makeitwork.cloud;
            proxy_set_header Host makeitwork.cloud;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-proxy
  namespace: makeitwork-proxy
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "tor requires write access to /etc/tor"
    ignore-check.kube-linter.io/run-as-non-root: "tor hidden service requires root"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tor-proxy
  template:
    metadata:
      labels:
        app: tor-proxy
    spec:
      serviceAccountName: tor-proxy
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: tor
          image: goldy/tor-hidden-service:v0.4.7.12-54c0e54
          securityContext:
            runAsUser: 0
          env:
            - name: WWW_TOR_SERVICE_HOSTS
              value: "80:localhost:8080"
          volumeMounts:
            - name: tor-keys
              mountPath: /var/lib/tor/hidden_service
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: tor-keys
          persistentVolumeClaim:
            claimName: tor-hidden-service-keys
        - name: nginx-config
          configMap:
            name: nginx-config
