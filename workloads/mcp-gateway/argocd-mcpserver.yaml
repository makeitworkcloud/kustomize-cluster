apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: makeitwork-argocd
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # ToolHive's supported rolling restart annotation reloads the rotated
    # ARGOCD_API_TOKEN from the referenced Secret without changing auth scope.
    mcpserver.toolhive.stacklok.dev/restarted-at: "2026-08-30T21:25:00Z"
spec:
  groupRef:
    name: gateway
  image: ghcr.io/argoproj-labs/mcp-for-argocd:v0.9.0@sha256:dffc6c719d8635be2d5f2c8ad1c0178540325da4b40da0b373307e12b4c48f86
  transport: streamable-http
  mcpPort: 3000
  args:
    - http
    - --port
    - "3000"
    # The proxyrunner runs in a separate pod, so the server must leave
    # loopback. Unauthenticated + skipped Host check (no --allowed-host-header)
    # is acceptable: the backend svc is ClusterIP-only behind the gateway, the
    # same trust boundary as the vmcp anonymous decision in vmcp.yaml, and the
    # real credential (the ArgoCD mcp account token) stays server-side.
    - --bind-address
    - 0.0.0.0
    - --allow-unauthenticated
  env:
    - name: ARGOCD_BASE_URL
      value: https://argocd-server.argocd.svc.cluster.local
    # argocd-server terminates TLS with a self-signed cert in-cluster, and this
    # pod's only upstream is argocd-server, so skipping verification is scoped
    # to that one hop. RBAC scope lives on the ArgoCD `mcp` account instead.
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
  secrets:
    - name: mcp-argocd
      key: ARGOCD_API_TOKEN
      targetEnvName: ARGOCD_API_TOKEN
