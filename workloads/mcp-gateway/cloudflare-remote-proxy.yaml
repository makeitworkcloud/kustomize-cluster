---
# Cloudflare's hosted API MCP server remains the upstream. This in-cluster
# ToolHive proxy keeps the dedicated API token in the mcp namespace instead of
# in OpenCode. groupRef adds it to the externally exposed VirtualMCPServer
# aggregate: external callers still authenticate through the shared MCP
# Gateway Cloudflare Access service token, never with the Cloudflare API
# token, which the proxy injects only on outbound upstream requests.
#
# Required credential contract: a separate, account-wide token scoped only to
# Cloudflare API read permission groups for the account containing xnoto.dev,
# makeitwork.cloud, and orthodox.channel, including Account Resources: Read for
# account-token discovery. The upstream exposes generic execute capability, so
# token permissions—not this proxy name or agent instructions—must block writes.
# Cloudflare's hosted MCP does not support client-IP-filtered API tokens.
#
# ToolHive v0.46.0 reads this token through an environment variable. Rotate it
# through the encrypted Secret, then perform a separately approved rollout of
# the generated proxy Deployment; changing the Secret alone does not restart it.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: cloudflare-read-auth
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: bearerToken
  bearerToken:
    tokenSecretRef:
      name: mcp-cloudflare-api-token
      key: token
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: cloudflare-read
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  groupRef:
    name: gateway
  # https://github.com/cloudflare/mcp documents this Streamable HTTP endpoint.
  remoteUrl: https://mcp.cloudflare.com/mcp
  transport: streamable-http
  externalAuthConfigRef:
    name: cloudflare-read-auth
