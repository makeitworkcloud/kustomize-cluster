---
# Staged, unreferenced overlay (see README.md). Read-only tool surface.
# Sync wave 0 so the filter exists before the MCPServer that references it.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: discord-readonly
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  toolsFilter:
    - get_server_info
    - find_channel
    - read_messages
