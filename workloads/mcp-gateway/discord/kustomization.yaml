# Staged, unreferenced discord MCP overlay: not included by any active
# Kustomization or Application (see README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - discord-toolconfig.yaml
  - discord-mcpserver.yaml
configMapGenerator:
  - name: mcp-discord-logging
    namespace: mcp
    files:
      - logback.xml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
# ToolHive stores podTemplateSpec as a RawExtension, outside Kustomize's
# default name-reference rules; this rewrites the generated ConfigMap name.
configurations:
  - name-reference.yaml
