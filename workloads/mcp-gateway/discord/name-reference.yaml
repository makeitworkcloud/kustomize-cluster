# ToolHive stores podTemplateSpec as a RawExtension, outside Kustomize's
# default name-reference rules. Teach Kustomize to rewrite the generated,
# content-addressed ConfigMap name in the MCPServer volume source so a logback
# policy change rolls the backend pod (same pattern as
# hero-ssh-namereference.yaml and gcloud-mcp-namereference.yaml).
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - group: toolhive.stacklok.dev
        version: v1beta1
        kind: MCPServer
        path: spec/podTemplateSpec/spec/volumes/configMap/name
