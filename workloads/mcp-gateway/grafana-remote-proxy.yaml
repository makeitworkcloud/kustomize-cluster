# The Grafana MCP backend runs with its operator-owned token in the grafana
# namespace. This proxy preserves the existing external gateway exposure.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: makeitwork-grafana
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  groupRef:
    name: gateway
  remoteUrl: http://mcp-grafana-mcp-backend-proxy.grafana.svc.cluster.local:8080/mcp
  transport: streamable-http
