# ssh-mcp policy for the dedicated, cluster-internal hero backend. The target
# is production infrastructure, so the host key is pinned and the profile is
# explicitly classified as prod. `approvalPolicy = "auto"` is owner-approved
# because the current OpenCode MCP client does not advertise elicitation; the
# packaged OpenCode policy still requires explicit confirmation before a live
# or mutating SSH operation is requested.
[defaults]
defaultProfile = "hero"
sessionMaxPerConnection = 3
sessionIdleTimeoutMs = 300000
sessionBackgroundMaxMs = 3600000
commandTimeoutMs = 60000
commandMaxChars = 5000
commandMaxOutputBytes = 1048576
connectionIdleReapMs = 900000
# ssh-mcp defines 0 as unlimited; retain command-class and confirmation gates.
commandQuotaPerDay = 0
approvalMode = "auto"

[[profiles]]
name = "hero"
host = "hero.makeitwork.cloud"
port = 22
user = "user"
auth = "key"
keyRef = "/home/node/.ssh/identity"
group = "prod"
trustedHostKey = "SHA256:1dJiKJMUmxbZCW0E5PV91E6DAaRBmxcf5dOciH2Bw98"
role = "admin"
readOnly = false
approvalPolicy = "auto"
tty = false

# The dedicated hero account is an owner-approved break-glass admin profile.
# This explicit production binding is required for privileged-command
# (sudo); the upstream default deliberately withholds it on prod.
[policy.roleBindings.admin]
prod = ["read-only", "safe", "destructive", "privileged"]

[policy]
# OpenTofu operations remain exclusively in their canonical roots and CI.
denylist = ["(^|\\s)(?:terraform|tofu)(?:\\s|$)"]
