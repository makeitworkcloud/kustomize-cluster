---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-kubernetes
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
# The server authenticates to the API with this token. Its ClusterRole permits
# CRUD for the explicitly listed non-Secret resources.
automountServiceAccountToken: true
---
# Operator access across the cluster. Secrets stay excluded: KSOPS-decrypted
# secrets live in-cluster and the gateway must not become a read or write path
# to them. The Kubernetes MCP server's generic resource operations use
# server-side apply, which requires patch in addition to create/update/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-kubernetes-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - persistentvolumeclaims
      - pods
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod logs remain readable and exec is needed by the server's core pod tool.
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs: ["create"]
  - apiGroups:
      - actions.github.com
      - apiextensions.k8s.io
      - apps
      - argoproj.io
      - autoscaling
      - batch
      - cert-manager.io
      - grafana.integreatly.org
      - metrics.k8s.io
      - monitoring.coreos.com
      - networking.cfargotunnel.com
      - networking.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - storage.k8s.io
      - toolhive.stacklok.dev
      - tor.k8s.torproject.org
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kubernetes-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-kubernetes-operator
subjects:
  - kind: ServiceAccount
    name: mcp-kubernetes
    namespace: mcp
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: makeitwork-kubernetes
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  groupRef:
    name: gateway
  image: ghcr.io/containers/kubernetes-mcp-server:v0.0.66@sha256:6d650f4bd6ac303ad82713c997e73a2d001602f9bf17392c9b9a0e30e29c6423
  transport: streamable-http
  mcpPort: 8080
  serviceAccount: mcp-kubernetes
  args:
    - --cluster-provider
    - in-cluster
    - --port
    - "8080"
