---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - mcpgroup.yaml
  - kubernetes-mcpserver.yaml
  - argocd-mcpserver.yaml
  - grafana-remote-proxy.yaml
  - aws-docs-mcpserver.yaml
  - mcp-aws-config.yaml
  - makeitwork-aws-mcpserver.yaml
  - terraform-docs-mcpserver.yaml
  - playwright-config.yaml
  - playwright-mcpserver.yaml
  - makeitwork-github-remote-proxy.yaml
  - repo-cache-pvc.yaml
  - repo-cache-sync.yaml
  - repo-search-toolconfig.yaml
  - repo-search-mcpserver.yaml
  - hero-ssh-toolconfig.yaml
  - hero-ssh-mcpserver.yaml
  - remote-proxies.yaml
  - slidespeak-remote-proxy.yaml
  - vmcp.yaml
  - tunnel-binding.yaml
configMapGenerator:
  # A content-addressed ConfigMap name changes the MCPServer pod template,
  # causing ToolHive to roll the proxy and backend when this policy changes.
  - name: mcp-hero-ssh-config
    namespace: mcp
    files:
      - config.toml=hero-ssh-config.toml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
configurations:
  - hero-ssh-namereference.yaml
patches:
  - path: repo-cache-sync-xnoto.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: repo-cache-sync
      namespace: mcp
  - path: repo-cache-sync-twilio.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: repo-cache-sync
      namespace: mcp
  - path: repo-cache-sync-private.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: repo-cache-sync
      namespace: mcp
  # The single-node workload policy favors spare-capacity bursts over CPU CFS
  # throttling. Keep this inline so kube-linter does not lint a partial patch as
  # a standalone Deployment.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: repo-cache-sync
        namespace: mcp
      spec:
        template:
          spec:
            containers:
              - name: sync-agent-knowledge
                resources: null
              - name: sync-channel-project
                resources: null
              - name: sync-charts
                resources: null
              - name: sync-cflan
                resources: null
              - name: sync-dotgithub
                resources: null
              - name: sync-images
                resources: null
              - name: sync-kustomize-cluster
                resources: null
              - name: sync-shared-workflows
                resources: null
              - name: sync-terraform-libvirt-domain
                resources: null
              - name: sync-tfroot-aws
                resources: null
              - name: sync-tfroot-cloudflare
                resources: null
              - name: sync-tfroot-gcp
                resources: null
              - name: sync-tfroot-github
                resources: null
              - name: sync-tfroot-libvirt
                resources: null
              - name: sync-tfroot-namecheap
                resources: null
              - name: sync-tfroot-twilio
                resources: null
              - name: sync-www
                resources: null
              - name: sync-xnoto-dotgithub
                resources: null
              - name: sync-xnoto-alacritty-theme-linux-vconsole
                resources: null
              - name: sync-xnoto-brewfile
                resources: null
              - name: sync-xnoto-claude-config
                resources: null
              - name: sync-xnoto-codex-config
                resources: null
              - name: sync-xnoto-dotfiles
                resources: null
              - name: sync-xnoto-herofand
                resources: null
              - name: sync-xnoto-homebrew-opencode-agent-hub
                resources: null
              - name: sync-xnoto-llama-hero
                resources: null
              - name: sync-xnoto-mcp-gateway
                resources: null
              - name: sync-xnoto-messaging-service
                resources: null
              - name: sync-xnoto-opencode-agent-hub
                resources: null
              - name: sync-xnoto-opencode-config
                resources: null
              - name: sync-xnoto-opencode-llama-config
                resources: null
              - name: sync-xnoto-xbox-media-utils
                resources: null
    target:
      group: apps
      version: v1
      kind: Deployment
      name: repo-cache-sync
      namespace: mcp
generators:
  - ksops-mcp-gateway-secrets.yaml
