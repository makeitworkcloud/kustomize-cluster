apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: makeitwork-github
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  groupRef:
    name: gateway
  image: ghcr.io/github/github-mcp-server:v1.11.0@sha256:fbec75de11c255213fa08d80fb166abe73d851fff631c51c0079872967720699
  # Native HTTP mode requires every MCP client to supply its own GitHub bearer
  # token. Keep the PAT server-side in stdio mode and let ToolHive expose the
  # Streamable HTTP endpoint consumed by OpenCode.
  transport: stdio
  proxyMode: streamable-http
  secrets:
    - name: mcp-makeitwork-github-token
      key: github_token
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
