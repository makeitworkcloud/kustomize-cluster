---
# Keep the GitHub PAT in the mcp namespace. This file injects it on outbound
# requests to GitHub's official remote MCP endpoint; the same
# mcp-makeitwork-github-token Secret is also mounted read-only at
# /etc/git-secret in the two credentialed repo-cache-sync private-allowlist
# containers (repo-cache-sync-private.yaml) and nowhere else.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: makeitwork-github-auth
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: bearerToken
  bearerToken:
    tokenSecretRef:
      name: mcp-makeitwork-github-token
      key: github_token
---
# Cluster-internal only: omitting groupRef keeps this backend out of the
# externally exposed VirtualMCPServer aggregation.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: makeitwork-github
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  remoteUrl: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  externalAuthConfigRef:
    name: makeitwork-github-auth
  # GitHub's default remote-MCP toolsets omit Actions. Preserve the defaults
  # and expose read-only Actions discovery and logs to OpenCode agents.
  headerForward:
    addPlaintextHeaders:
      X-MCP-Toolsets: "default,actions"
