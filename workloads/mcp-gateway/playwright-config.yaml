---
# Playwright MCP launch configuration. Mounted read-only into the backend
# container at /config/config.json and referenced by --config.
#
# Why this exists: Chromium 128+ crashpad in containers fails with
# "chrome_crashpad_handler: --database is required" and the browser exits
# SIGTRAP when it cannot resolve a writable crash-report database (observed
# 2026-09-02; same class as chrome-php#649 / playwright#34031).
#
# Chromium resolves the crashpad database under $XDG_CONFIG_HOME / $HOME/.config;
# with a read-only root filesystem that path is unwritable/empty, so the handler
# is invoked with no --database at all. The container-level fix (MCPServer
# podTemplateSpec env) points HOME and XDG_CONFIG_HOME at the writable emptyDir
# /tmp; these launch args additionally disable the crash reporters outright.
# Chromium-1243 ignores some of these flags for the handler spawn, hence the
# belt-and-braces combination.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-playwright-config
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  config.json: |
    {
      "browser": {
        "browserName": "chromium",
        "isolated": true,
        "launchOptions": {
          "headless": true,
          "args": [
            "--no-sandbox",
            "--disable-crash-reporter",
            "--no-crashpad",
            "--disable-crashpad-handler",
            "--disable-breakpad",
            "--crash-dumps-dir=/tmp"
          ]
        }
      },
      "capabilities": ["core", "pdf"]
    }
