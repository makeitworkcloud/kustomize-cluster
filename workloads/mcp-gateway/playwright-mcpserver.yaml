---
# Playwright MCP (Microsoft official container): headless Chromium with the
# PDF capability enabled. Serves server-side browser automation and HTML/markdown
# print-to-PDF for OpenCode agents (career-agent research thread, see
# agent-knowledge docs/agents/career/work/2026-09-02-pdf-generation-mcp-landscape.md).
#
# Cluster-internal only: omitting groupRef keeps this backend out of the
# externally exposed VirtualMCPServer aggregation (same decision as
# makeitwork-github in makeitwork-github-remote-proxy.yaml).
#
# Image digest resolved against the registry manifest API (OCI image index,
# amd64/linux present): sha256 of the v0.0.80 index.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: makeitwork-playwright
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  image: mcr.microsoft.com/playwright/mcp:v0.0.80@sha256:dda1f7f9b812e22946635c8af7df9288b96d3b9e3f0f1b8576d6823e2031c1de
  transport: streamable-http
  mcpPort: 8080
  args:
    - --headless
    - --browser
    - chromium
    - --no-sandbox
    # Enable the PDF capability (browser_page_pdf). Core automation tools are
    # always on; pdf is opt-in per upstream README.
    - --caps
    - pdf
    # Shared long-lived service: keep browser state in memory per session
    # instead of persisting a profile to disk across agent sessions.
    - --isolated
    # The proxyrunner dials the backend svc ClusterIP, whose Host header fails
    # playwright-mcp's DNS-rebinding Host check (observed: HTTP 403 on every
    # initialize, proxyrunner log 2026-09-02). Wildcard is upstream's documented
    # case for a server behind a trusted reverse proxy — same rationale and fix
    # as the grafana MCPServer entry. Backend remains ClusterIP-only.
    - --allowed-hosts
    - "*"
    # The proxyrunner runs in a separate pod, so the server must leave
    # loopback (same rationale as the argocd and grafana MCPServer entries).
    - --host
    - 0.0.0.0
    - --port
    - "8080"
    # Browser launch configuration (crashpad workaround; see the ConfigMap
    # mcp-playwright-config for rationale and contents).
    - --config
    - /config/config.json
  # ToolHive runs MCP server pods with a read-only root filesystem by
  # default. playwright-mcp mkdtemp()s an artifacts directory under /tmp on
  # every browser action, so without a writable /tmp every tool call fails
  # with EROFS (observed 2026-09-02: mkdtemp '/tmp/playwright-artifacts-*').
  # The emptyDir-at-/tmp mount is ToolHive's documented pattern for this
  # (operator quickstart); same podTemplateSpec.volume pattern as the aws
  # MCPServer entry. The container name must be `mcp` per the CRD contract.
  podTemplateSpec:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: mcp-playwright-config
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true
