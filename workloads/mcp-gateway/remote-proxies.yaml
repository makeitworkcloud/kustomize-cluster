---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: context7
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  groupRef:
    name: gateway
  remoteUrl: https://mcp.context7.com/mcp
  transport: streamable-http
---
# Static PAT injection uses headerForward: externalAuthConfigRef is token
# exchange, which needs an incoming client token we don't have (anonymous
# incoming auth), so it rendered an empty auth middleware and the upstream
# saw no Authorization header at all.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: github
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  groupRef:
    name: gateway
  remoteUrl: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: mcp-github
          key: github_token
