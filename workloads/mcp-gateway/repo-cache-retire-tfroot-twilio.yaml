# One-time retirement of the orphaned /repos/tfroot-twilio cache root.
# Rationale, safety contract, and disarm procedure live in this directory's
# README; the contract is enforced by the retirement step in
# .github/workflows/test.yml.
apiVersion: batch/v1
kind: Job
metadata:
  name: repo-cache-retire-tfroot-twilio
  namespace: mcp
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    ignore-check.kube-linter.io/unset-memory-requirements: "No limits on single-node cluster"
    ignore-check.kube-linter.io/unset-cpu-requirements: "No requests on single-node cluster"
spec:
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: repo-cache-retire-tfroot-twilio
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: retire-tfroot-twilio
          # Same digest as the canonical pin in codebase-memory-mcpserver.yaml;
          # Debian coreutils rm supports --one-file-system, busybox rm does not.
          image: docker.io/library/node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              TARGET='/repos/tfroot-twilio'
              grep -q ' /repos ' /proc/mounts
              if [ -L "${TARGET}" ]; then
                echo "refusing: ${TARGET} is a symlink" >&2
                exit 1
              fi
              if [ ! -e "${TARGET}" ]; then
                echo "already retired: ${TARGET} is absent"
                exit 0
              fi
              if [ ! -d "${TARGET}" ]; then
                echo "refusing: ${TARGET} is not a directory" >&2
                exit 1
              fi
              if [ "$(readlink -f -- "${TARGET}")" != "${TARGET}" ]; then
                echo "refusing: ${TARGET} does not resolve to itself" >&2
                exit 1
              fi
              rm -rf --one-file-system -- "${TARGET}"
              if [ -e "${TARGET}" ]; then
                echo "failed to remove ${TARGET}" >&2
                exit 1
              fi
              echo "retired repository-cache root ${TARGET}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65533
            runAsGroup: 65533
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: repos
              mountPath: /repos
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: mcp-repo-cache
