---
# Removes CPU and memory resource constraints from the read-only cache sync
# containers. On this single-node cluster, the workload policy intentionally
# favors spare-capacity bursts over artificial CPU CFS throttling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-cache-sync
  namespace: mcp
spec:
  template:
    spec:
      containers:
        - name: sync-charts
          resources: null
        - name: sync-cflan
          resources: null
        - name: sync-dotgithub
          resources: null
        - name: sync-images
          resources: null
        - name: sync-kustomize-cluster
          resources: null
        - name: sync-shared-workflows
          resources: null
        - name: sync-terraform-libvirt-domain
          resources: null
        - name: sync-tfroot-aws
          resources: null
        - name: sync-tfroot-cloudflare
          resources: null
        - name: sync-tfroot-gcp
          resources: null
        - name: sync-tfroot-github
          resources: null
        - name: sync-tfroot-libvirt
          resources: null
        - name: sync-tfroot-namecheap
          resources: null
        - name: sync-www
          resources: null
        - name: sync-xnoto-dotgithub
          resources: null
        - name: sync-xnoto-alacritty-theme-linux-vconsole
          resources: null
        - name: sync-xnoto-brewfile
          resources: null
        - name: sync-xnoto-claude-config
          resources: null
        - name: sync-xnoto-codex-config
          resources: null
        - name: sync-xnoto-dotfiles
          resources: null
        - name: sync-xnoto-herofand
          resources: null
        - name: sync-xnoto-homebrew-opencode-agent-hub
          resources: null
        - name: sync-xnoto-llama-hero
          resources: null
        - name: sync-xnoto-mcp-gateway
          resources: null
        - name: sync-xnoto-messaging-service
          resources: null
        - name: sync-xnoto-opencode-agent-hub
          resources: null
        - name: sync-xnoto-opencode-config
          resources: null
        - name: sync-xnoto-opencode-llama-config
          resources: null
        - name: sync-xnoto-xbox-media-utils
          resources: null
