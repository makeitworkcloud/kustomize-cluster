---
# Extends repo-cache-sync with every public xnoto repository. Cache roots use
# the xnoto- prefix to avoid collisions with the makeitworkcloud source set;
# xnoto/.github is exposed as xnoto-dotgithub. These sources remain public,
# default-branch-only, credential-free, and read-only to the MCP backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-cache-sync
  namespace: mcp
spec:
  selector:
    matchLabels:
      app: repo-cache-sync
  template:
    metadata:
      labels:
        app: repo-cache-sync
    spec:
      containers:
        - name: sync-xnoto-dotgithub
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=https://github.com/xnoto/.github
            - --ref=HEAD
            - --root=/sync/xnoto-dotgithub
            - --link=current
            - --depth=1
            - --period=120s
            - --max-failures=-1
            - --group-write
            - --http-bind=:9815
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: probe9815
              containerPort: 9815
          readinessProbe:
            httpGet:
              path: /
              port: probe9815
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: probe9815
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65533
            runAsGroup: 65533
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: repos
              mountPath: /sync
            - name: tmp
              mountPath: /tmp
        - name: sync-xnoto-alacritty-theme-linux-vconsole
