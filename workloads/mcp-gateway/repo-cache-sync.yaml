---
# Read-only cache of the public makeitworkcloud repositories, synced with
# the Kubernetes SIG git-sync image. This is the read/discovery surface for
# OpenCode agents: it removes per-file GitHub API round trips (private-repo
# code search is also unreliable for this org) in exchange for staleness
# bounded by --period plus one sync. agent-knowledge is deliberately
# excluded: it is private and its agent subtrees may hold personal or
# operational data, so it stays GitHub-MCP-only. Adding a private repo here
# later requires credentials and a fresh owner review.
#
# Writes never flow through this cache; agents keep using the GitHub MCP for
# mutations and for anything they just pushed.
#
# Consumer contract (git-sync's published API): each repo lives at
# /repos/<name>/current, a symlink git-sync flips atomically; the hash-named
# sibling directory is the synced commit SHA agents should cite.
#
# One container per repo (git-sync syncs exactly one repo per process) with
# a per-container --http-bind probe port: git-sync's HTTP endpoint returns
# 5xx until the first sync completes and 200 thereafter, which is exactly
# the readiness semantic wanted here. --max-failures=-1 keeps transient
# GitHub failures from crash-looping a cache pod; staleness is preferable
# to absence for this use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-cache-sync
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repo-cache-sync
  template:
    metadata:
      labels:
        app: repo-cache-sync
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65533
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: sync-charts
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=https://github.com/makeitworkcloud/charts
            - --ref=HEAD
            - --root=/sync/charts
            - --link=current
            - --depth=1
            - --period=120s
            - --max-failures=-1
            - --group-write
            - --http-bind=:9801
          env:
            - name: HOME
              value: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 9801
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 9801
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65533
            runAsGroup: 65533
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: repos
              mountPath: /sync
            - name: tmp
              mountPath: /tmp
        - name: sync-cflan
