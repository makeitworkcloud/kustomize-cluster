apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: terraform-docs
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  image: docker.io/hashicorp/terraform-mcp-server:1.4.1@sha256:11dd418bba6003dd5777e9d0979b68de59929a155b355f338f407947e00e9d80
  transport: streamable-http
  mcpPort: 8080
  env:
    - name: TRANSPORT_MODE
      value: streamable-http
    - name: TRANSPORT_HOST
      value: 0.0.0.0
    - name: TRANSPORT_PORT
      value: "8080"
