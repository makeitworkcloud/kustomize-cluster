---
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: mcp-gateway
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - name: vmcp-gateway
    spec:
      fqdn: mcp.makeitwork.cloud
      target: http://vmcp-gateway.mcp.svc:4483
  # Per-backend endpoints move to first-level mcp-<name>.makeitwork.cloud
  # hostnames: Cloudflare Universal SSL only covers one subdomain level, so
  # <name>.mcp.makeitwork.cloud cannot present a cert. Subjects return after
  # the tfroot-cloudflare CNAME swap (AGENTS.md: remove before rename).
tunnelRef:
  kind: ClusterTunnel
  name: cluster-apps
