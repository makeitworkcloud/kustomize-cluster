---
# Staged and intentionally inactive: not registered in
# workloads/apps/kustomization.yaml and not rendered by this directory's
# kustomization.yaml. Activation requires the owner-confirmed gates in
# README.md (chart 0.3.2 published, isolated pilot secrets provisioned,
# validations passed); sync stays manual, so nothing deploys itself even
# after registration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode-memory-pilot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - chart: opencode-server
      repoURL: ghcr.io/makeitworkcloud/charts
      targetRevision: 0.3.2
      helm:
        valuesObject:
          fullnameOverride: opencode-memory-pilot
          persistence:
            existingClaim: opencode-memory-pilot-home
          memoryPilot:
            enabled: true
            providerSecretName: opencode-memory-pilot-provider
            providerSecretKey: ZHIPU_API_KEY
            serverSecretName: opencode-memory-pilot-server-auth
            serverSecretKey: password
    - repoURL: https://github.com/makeitworkcloud/kustomize-cluster.git
      path: workloads/opencode-memory-pilot
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: opencode
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
