---
# Staged pilot overlay: renders only cluster-owned storage and the stable
# Service. application.yaml is deliberately NOT a resource here, and this
# directory is not referenced by workloads/apps or any active kustomization.
# See README.md for the activation gates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - persistent-volume-claim.yaml
  - service.yaml
