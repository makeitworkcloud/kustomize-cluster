---
# Cluster-internal upload helper for validated, short-lived agent artifacts.
# It has no AWS credentials or ServiceAccount token. It can read only the
# dedicated artifacts PVC; agents must obtain a short-lived presigned S3 PUT
# URL and explicit owner confirmation before execing curl in this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-pipe-uploader
  namespace: opencode
  annotations:
    # local-path uses WaitForFirstConsumer. Keep this Deployment in the PVC's
    # wave so Argo creates a consumer before waiting for the claim to bind.
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/unset-cpu-requirements: "single-node policy"
    ignore-check.kube-linter.io/unset-memory-requirements: "single-node policy"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-pipe-uploader
  template:
    metadata:
      labels:
        app: agent-pipe-uploader
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          # Official curl image; index digest for curl 8.21.0, resolved
          # from Docker Hub on 2026-09-02. curl-container publishes cosign
          # signatures for the image.
          image: docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command: ["/bin/sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
              readOnly: true
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: opencode-artifacts
            readOnly: true
