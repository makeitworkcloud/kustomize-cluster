---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - persistent-volume-claim.yaml
  - artifacts-persistent-volume-claim.yaml
  - service.yaml
  - tunnel-binding.yaml
  - session-metrics.yaml
generators:
  - ksops-opencode-secrets.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: opencode-session-metrics
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          opencode.makeitwork.cloud/config-revision: token-telemetry-v1
