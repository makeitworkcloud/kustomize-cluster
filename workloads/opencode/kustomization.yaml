---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - persistent-volume-claim.yaml
  - artifacts-persistent-volume-claim.yaml
  - service.yaml
  - tunnel-binding.yaml
  - session-metrics.yaml
generators:
  - ksops-opencode-secrets.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: opencode-session-metrics
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opencode-session-metrics
      spec:
        template:
          metadata:
            annotations:
              opencode.makeitwork.cloud/config-revision: token-telemetry-v2
