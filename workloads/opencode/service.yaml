---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/dangling-service: "Targets the OpenCode Deployment in this Application"
spec:
  selector:
    app: opencode
  ports:
    - name: http
      port: 4096
      targetPort: http
