---
apiVersion: v1
kind: Namespace
metadata:
  name: warp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: warp
data:
  config.yml: |
    tunnel: 20a5dc6e-0607-42a7-a070-7061a7b157d9
    credentials-file: /etc/cloudflared/credentials.json
    warp-routing:
      enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: warp
  annotations:
    ignore-check.kube-linter.io/unset-memory-requirements: "No limits on single-node cluster"
    ignore-check.kube-linter.io/unset-cpu-requirements: "No requests on single-node cluster"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.8.1
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config.yml
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yml
              subPath: config.yml
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: cloudflared-credentials
